name: Publish Desktop Release

on:
  push:
    tags:
      - 'desktop-v*.*.*'

permissions:
  contents: read

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Build and publish Windows release
        run: npm run desktop:publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          EP_PUBLISH_REPO: ahmed0soliman6/mitali-hospital-releases

