<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173B4A">
  <meta name="description" content="نظام إدارة مستشفى لجنة زكاة ميت على التخصصي — Web App / PWA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>نظام إدارة مستشفى لجنة زكاة ميت على التخصصي</title>
  <style>
    :root{color-scheme:light;--navy:#173B4A;--teal:#0F6674;--gold:#C79A3E;--bg:#F4F6F5}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:#173B4A}
    #app{position:fixed;inset:0;background:#fff}
    #loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(135deg,#102A35,#173B4A);color:#fff;transition:opacity .3s}
    .loading-card{text-align:center;padding:28px;max-width:420px}
    .logo{width:72px;height:72px;margin:0 auto 16px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}
    .loading-card h1{font-size:20px;margin:0 0 8px;line-height:1.6}.loading-card p{margin:0;color:#CFE4E1;font-size:13px}
    .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    iframe{border:0;width:100%;height:100%;display:block;background:#fff}
    #installBtn{position:fixed;left:16px;bottom:16px;z-index:30;border:0;border-radius:999px;padding:11px 16px;background:var(--gold);color:#fff;font-weight:800;font-size:13px;box-shadow:0 8px 25px rgba(0,0,0,.18);cursor:pointer;display:none}
    #installBtn:active{transform:translateY(1px)}
    @media(max-width:600px){#installBtn{left:12px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;padding:10px 14px}}
  </style>
</head>
<body>
  <main id="app">
    <section id="loading" aria-live="polite">
      <div class="loading-card">
        <img class="logo" src="./icon.svg" alt="شعار النظام">
        <h1>نظام إدارة مستشفى لجنة زكاة ميت على التخصصي</h1>
        <p>جاري تشغيل التطبيق...</p>
        <div class="spinner" aria-hidden="true"></div>
      </div>
    </section>
    <iframe id="systemFrame" src="./system.html" title="نظام إدارة المستشفى" allow="clipboard-read; clipboard-write"></iframe>
  </main>
  <button id="installBtn" type="button">تثبيت التطبيق</button>
  <script>
    const loading=document.getElementById('loading');
    const frame=document.getElementById('systemFrame');
    const installBtn=document.getElementById('installBtn');
    let deferredPrompt=null;
    frame.addEventListener('load',()=>{setTimeout(()=>{loading.style.opacity='0';setTimeout(()=>loading.remove(),350)},150)});
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});
    installBtn.addEventListener('click',async()=>{
      if(!deferredPrompt)return;
      deferredPrompt.prompt();
      try{await deferredPrompt.userChoice}catch(_){ }
      deferredPrompt=null;installBtn.style.display='none';
    });
    window.addEventListener('appinstalled',()=>{installBtn.style.display='none';deferredPrompt=null});
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(console.error));
    }
  </script>
</body>
</html>
