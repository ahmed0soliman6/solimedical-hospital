      </div>
      <form id="visitForm" class="form-grid visit-grid-3">
        <div class="field"><label>التاريخ</label><input type="date" name="date" required value="${editing?.date || todayISO()}"></div>
        <input type="hidden" name="fileNo" id="visitFileNoInput" value="${esc(editing ? editing.fileNo : "")}">
        <div class="field" style="grid-column:span 2; position:relative;">
          <label>اسم المريض</label>
          <input type="text" name="patient" id="visitPatientInput" required autocomplete="off" value="${esc(editing?.patient)}">
          <div id="visitPatientSuggest" style="display:none; position:absolute; z-index:20; top:100%; right:0; left:0; background:#fff; border:1px solid var(--border,#ccc); border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.12); max-height:220px; overflow:auto;"></div>
        </div>
        <div class="field"><label>رقم الهاتف</label><input type="text" name="phone" id="visitPhoneInput" value="${esc(editing?.phone)}"></div>
        <div class="field"><label>الطبيب</label>
          <select name="doctorId" id="visitDoctorSelect" required>
            <option value="">اختر طبيبًا</option>
            ${doctorsPool.map(d => `<option value="${d.id}" ${editing?.doctorId === d.id ? "selected" : ""} data-checkup-price="${d.checkupPrice ?? ""}" data-followup-price="${d.followupPrice ?? ""}">${esc(d.name)} — ${esc(d.specialty)}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>نوع الكشف</label><select name="examType" id="visitExamTypeSelect">${option(LISTS.examTypes, editing?.examType)}</select></div>
        <div class="field"><label>إجمالي الحساب (ج.م)</label><input type="text" inputmode="decimal" step="0.01" name="total" id="visitTotalInput" required value="${editing?.total ?? ""}"></div>
        <div class="field"><label>المدفوع</label><input type="text" inputmode="decimal" step="0.01" name="paid" required value="${editing?.paid ?? ""}"></div>
        <div class="field"><label>حالة الدفع</label><select name="status">${option(LISTS.payStatus, editing?.status)}</select></div>
        <div class="field"><label>ملاحظات</label><input type="text" name="notes" value="${esc(editing?.notes)}"></div>
        <div class="field"><label>موعد المتابعة (اختياري)</label><input type="date" name="nextVisitDate" value="${editing?.nextVisitDate || ""}"></div>
        <div class="field" style="align-self:end; display:flex; gap:8px;">
          <button type="submit" class="btn">${editing ? "حفظ التعديل" : "تسجيل الزيارة"}</button>
          ${editing ? `<button type="button" class="btn ghost" id="cancelEdit">إلغاء</button>` : ""}
        </div>
      </form>
    </div>` : ""}

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
        <div class="section-title" style="margin:0;">سجل الزيارات <span class="hint">${displayList.length} زيارة</span></div>
        ${periodFilterHTML(`visit_${kind}`, granularity, filterValue, list.map(v => v.date))}
      </div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>التاريخ</th><th>المريض</th><th>الطبيب</th><th>النوع</th><th>الإجمالي</th><th>المدفوع</th>
          <th>الباقي</th><th>حصة المجمع</th><th>حصة الطبيب</th><th>الحالة</th><th></th>
        </tr></thead>
        <tbody>
          ${displayList.length === 0 ? `<tr class="empty-row"><td colspan="11">لا توجد زيارات مسجّلة فى هذه الفترة</td></tr>` : ""}
          ${visitsPg.pageItems.map(v => {
            const share = computeShare(v);
            const remaining = visitRemaining(v);
            const pillClass = v.status === "تم" ? "paid" : v.status === "جزئي" ? "partial" : "unpaid";
            return `<tr>
              <td>${v.date || "-"}${entryTimeDisplay(v.createdAt) ? `<div class="hint" style="font-size:11px;">${entryTimeDisplay(v.createdAt)}</div>` : ""}</td>
              <td>${esc(v.patient)}</td>
              <td>${esc(dName(v.doctorId))}</td>
              <td>${esc(v.examType)}</td>
              <td>${fmt(v.total)}</td>
              <td>${fmt(v.paid)}</td>
              <td style="color:${remaining > 0 ? "var(--expense)" : "var(--ink)"}; font-weight:${remaining > 0 ? 700 : 400};">${fmt(remaining)}</td>
              <td>${fmt(share.clinic)}</td>
              <td>${fmt(share.doc)}</td>
              <td><span class="pill ${pillClass}">${v.status || "-"}</span>${v.linkedIncomeId ? ` <span class="hint" title="سُجِّل تلقائيًا فى دفتر الخزينة">🔗</span>` : ""}</td>
              <td style="display:flex; gap:6px; flex-wrap:wrap;">
                ${canEdit ? `<button class="btn sm ghost" data-edit="${v.id}">تعديل</button>` : ""}
                ${canDelete ? `<button class="btn sm danger" data-del="${v.id}">حذف</button>` : ""}
                ${waIconButtonHTML(v.phone, "wa-booking", v.id)}
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>
      ${paginationControlsHTML(`visits_${kind}`, visitsPg)}
    </div>
  `;

  bindPaginationEvents(c);
  bindPeriodFilterEvents(`visit_${kind}`, granKey, valKey);

  // اقتراحات تلقائية لاسم المريض: بتمنع مشكلة إن المريض يرجع تاني والموظف ينسى
  // يكتب رقم الهاتف زي المرة اللي فاتت، فيعتبره النظام ملف جديد تمامًا منفصل عن
  // تاريخه القديم (بدل ما يُحسب زيارة إضافية لنفس المريض). بمجرد ما يختار
  // الموظف اسمًا من الاقتراحات، بيتملى رقم الهاتف (ورقم الملف لو موجود) تلقائيًا
  // بنفس القيم المسجَّلة قبل كده، فيضمن ربط كل زياراته تحت ملف واحد دائمًا.
  const patientInput = document.getElementById("visitPatientInput");
  const phoneInput = document.getElementById("visitPhoneInput");
  const fileNoInput = document.getElementById("visitFileNoInput");
  const suggestBox = document.getElementById("visitPatientSuggest");
  if (patientInput && suggestBox) {
    const knownPatients = groupPatients(allPatientVisits());
    patientInput.addEventListener("input", () => {
      const q = patientInput.value.trim().toLowerCase();
      if (q.length < 2) { suggestBox.style.display = "none"; suggestBox.innerHTML = ""; return; }
      const matches = knownPatients.filter(g => (g.name || "").toLowerCase().includes(q)).slice(0, 6);
      if (!matches.length) { suggestBox.style.display = "none"; suggestBox.innerHTML = ""; return; }
      suggestBox.innerHTML = matches.map(g => `
        <div class="patient-suggest-item" data-name="${esc(g.name)}" data-phone="${esc(g.phone)}" data-fileno="${esc(g.fileNos[0] || "")}"
          style="padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--border,#eee); font-size:13.5px;">
          <div style="font-weight:700;">${esc(g.name)}</div>
          <div class="hint" style="font-size:11.5px;">${g.phone ? "📞 " + esc(g.phone) : "بلا رقم هاتف مسجّل"} · ${g.visits.length} زيارة سابقة</div>
        </div>`).join("");
      suggestBox.style.display = "block";
    });
    suggestBox.addEventListener("click", (e) => {
      const item = e.target.closest("[data-name]");
      if (!item) return;
      patientInput.value = item.dataset.name;
      if (phoneInput && item.dataset.phone) phoneInput.value = item.dataset.phone;
      if (fileNoInput && item.dataset.fileno) fileNoInput.value = item.dataset.fileno;
      suggestBox.style.display = "none"; suggestBox.innerHTML = "";
    });
    // إخفاء الاقتراحات عند مغادرة الحقل - بتأخير بسيط عشان نداء الـ click على
    // اقتراح مُختار يتنفَّذ الأول قبل ما الصندوق يختفي من تحت إصبع المستخدم.
    patientInput.addEventListener("blur", () => { setTimeout(() => { suggestBox.style.display = "none"; }, 150); });
    patientInput.addEventListener("focus", () => { if (patientInput.value.trim().length >= 2 && suggestBox.innerHTML) suggestBox.style.display = "block"; });
  }

  const visitForm = document.getElementById("visitForm");
  // إصلاح: كان ممكن الضغط على "حفظ" أكتر من مرة بسرعة (لمس مزدوج بالغلط على
  // الموبايل عادة) قبل ما تعيد الصفحة رسم نفسها، فيتنفَّذ نفس الحدث القديم مرة
  // ثانية بنفس رقم الملف المعروض (لسه ما اتحدّثش) - فيتسجَّل مريضان مختلفان
  // بنفس رقم الملف، ويظهر وكأن التسجيل الجديد "اختفى" لأن الاتنين بقوا يشتركوا
  // فى نفس الرقم بدل ظهور كل واحد لوحده. القفل ده متغيّر محلى لكل رسم جديد
  // للصفحة (يتصفّر تلقائيًا مع أي route() جديدة) فمفيش داعٍ لإعادة فتحه يدويًا.
  let formLocked = false;
  if (visitForm) visitForm.addEventListener("submit", async e => {
    e.preventDefault();
    if (formLocked) return;
    if (editing ? !canEdit : !canAdd) { showToast("⚠️ ليس لديك صلاحية كافية لهذا الإجراء"); return; }
    formLocked = true;
    // إصلاح جوهري: لو حصل أي خطأ غير متوقع أثناء الحفظ (مثلاً بيانات ناقصة أو
    // خطأ برمجي فى خطوة فرعية)، كان النموذج يفضل "مقفولًا" للأبد بصمت بسبب القفل
    // أعلاه بدون أي رسالة توضّح السبب - يبدو للمستخدم وكأن "النظام لا يسجل" رغم
    // إنه فعليًا توقّف بسبب استثناء. الآن أي خطأ يُظهر تنبيهًا واضحًا ويُعيد فتح
    // النموذج فورًا للمحاولة تانى، بدل التجمّد الصامت.
    try {
      await runVisitSave();
    } catch (err) {
      console.error("Visit save error:", err);
      formLocked = false;
      showToast("⚠️ حدث خطأ غير متوقع أثناء الحفظ - حاول مرة أخرى");
    }
    async function runVisitSave() {
    const fd = new FormData(e.target);
    const total = Number(fd.get("total")) || 0;
    const rec = {
      id: editing ? editing.id : uid(),
      date: fd.get("date"), fileNo: fd.get("fileNo"), patient: fd.get("patient"), phone: fd.get("phone"),
      doctorId: fd.get("doctorId"), examType: fd.get("examType"), xray: 0, lab: 0, services: 0,
      total, paid: Number(fd.get("paid")) || 0, paymentMethod: "نقدي", // الدفع فى العيادات نقدي فقط - لا حاجة لخانة اختيار
      status: fd.get("status"), notes: fd.get("notes"), nextVisitDate: fd.get("nextVisitDate") || null,
      linkedIncomeId: editing ? (editing.linkedIncomeId || null) : null,
      // إصلاح ترتيب: وقت التسجيل الفعلى (وليس تاريخ الزيارة نفسها) - يُحفَظ مرة
      // واحدة فقط عند الإنشاء الأول ولا يتغيّر أبدًا عند أي تعديل لاحق، ليكون
      // معيارًا ثابتًا وصحيحًا لترتيب "الأحدث إدخالًا" بغض النظر عن تاريخ الزيارة
      // نفسها أو رقم الملف أو أي قيمة أخرى قابلة للتغيير.
      createdAt: editing ? (editing.createdAt || null) : nowISO(),
    };
    // إصلاح محاسبي: نأخذ "لقطة" من نصيب المجمع الثابت الحالى (لطبيب نظامه "مبلغ
    // ثابت لكل زيارة") ونحفظها على الزيارة نفسها وقت التسجيل، بدل قراءتها حيّة من
    // إعدادات الطبيب كل مرة - حتى لو غُيِّر سعر الطبيب مستقبلًا، تبقى هذه الزيارة
    // محسوبة بالسعر الذى كان ساريًا فعلًا وقت تسجيلها. نُعيد اللقطة فقط لو كانت
    // زيارة جديدة، أو تغيّر الطبيب/نوع الكشف عن التعديل السابق؛ غير ذلك نحتفظ
    // باللقطة القديمة كما هى عند مجرد تعديل تفاصيل أخرى (اسم، ملاحظات...).
    if (!isDental) {
      const doc = dInfo(rec.doctorId);
      const mode = doc && doc.type !== "أسنان" ? (doc.feeMode || "fixed_visit") : null;
      const changedDoctorOrType = !editing || editing.doctorId !== rec.doctorId || editing.examType !== rec.examType;
      if (mode === "fixed_visit") {
        rec.clinicFeeSnapshot = (changedDoctorOrType || editing?.clinicFeeSnapshot == null)
          ? (rec.examType === "متابعة" ? Number(doc.followupClinicFee) || 0 : Number(doc.checkupClinicFee) || 0)
          : editing.clinicFeeSnapshot;
      } else {
        rec.clinicFeeSnapshot = null;
      }
    }
    if (editing) {
      const idx = list.findIndex(v => v.id === editing.id);
      list[idx] = rec;
      logActivity(isDental ? "تعديل حالة أسنان" : "تعديل زيارة", kind, editing, rec);
    } else {
      list.push(rec);
      logActivity(isDental ? "إضافة حالة أسنان" : "إضافة زيارة", kind, null, rec);
    }
    syncVisitIncomeLink(rec, kind);
    // إصلاح جوهري: ننتظر persist() فعليًا هنا (بدل إطلاقها بدون انتظار كما كان
    // سابقًا) قبل استدعاء route(). هذا يضمن أن أى تحديث خلفى آخر (مثلًا
    // backgroundRefreshAll أو سحب فورى بعد التنقل) لا يمكن أبدًا أن يبدأ ويقرأ
    // نسخة سحابية لم تصل إليها هذه الزيارة بعد - وهو السبب الجذرى وراء اختفاء
    // الزيارة الجديدة مؤقتًا. PENDING_WRITES (المُحدَّث داخل persist نفسها) يبقى
    // > 0 طوال مدة هذا الانتظار، وهو ما يحمى منه backgroundRefreshAll أعلاه أيضًا.
    let pushFailedOnline = false;
    try {
      await persist(isDental ? "visitsDental" : "visitsClinic");
    } catch (err) {
      // فشل الرفع الفورى للسحابة رغم وجود اتصال (خطأ شبكة عابر، رفض من الخادم...).
      // البيانات محفوظة محليًا بالفعل وأُضيفت لطابور إعادة المحاولة التلقائية
      // (داخل storeSetInner)، فهذا ليس فشلًا حقيقيًا للعملية من منظور المستخدم -
      // لا نُظهر رسالة خطأ عامة ولا نمنعه من المتابعة، فقط نوضّح أن الحفظ محلى الآن.
      console.error("Visit sync push failed (saved locally, will retry):", err);
      pushFailedOnline = true;
    }
    state.editId = null;
    if (pushFailedOnline) {
      showToast(`💾 ${editing ? "تم حفظ التعديل" : "تم تسجيل الزيارة"} محليًا — تعذّر رفعه للسحابة الآن وسيُعاد رفعه تلقائيًا عند توفر الاتصال`, 3800);
    } else {
      saveToast(editing ? "تم حفظ التعديل" : "تم تسجيل الزيارة بنجاح");
    }
    route();
    }
  });

  const cancelBtn = document.getElementById("cancelEdit");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { state.editId = null; route(); });
  // تعبئة تلقائية لسعر الكشف الافتراضى للطبيب المختار (زيارة جديدة فقط - لا نغيّر
  // رقمًا مُدخَلًا بالفعل عند مجرد فتح زيارة قديمة للتعديل)
  if (!isDental && !editing) {
    const visitDoctorSelect = document.getElementById("visitDoctorSelect");
    const visitExamTypeSelect = document.getElementById("visitExamTypeSelect");
    const visitTotalInput = document.getElementById("visitTotalInput");
    function prefillDefaultPrice() {
      const opt = visitDoctorSelect?.selectedOptions[0];
      if (!opt || !opt.value) return;
      const price = visitExamTypeSelect?.value === "متابعة" ? opt.dataset.followupPrice : opt.dataset.checkupPrice;
      if (price) visitTotalInput.value = price;
    }
    if (visitDoctorSelect) visitDoctorSelect.addEventListener("change", prefillDefaultPrice);
    if (visitExamTypeSelect) visitExamTypeSelect.addEventListener("change", prefillDefaultPrice);
  }
  // إصلاح جوهري: بناءً على طلب صريح، أُلغيت آلية توليد/إعادة استخدام رقم الملف
  // بالكامل (لا حساب تلقائى ولا إعادة استخدام) - كل زيارة جديدة تُسجَّل بلا رقم
  // ملف إطلاقًا من الآن. ربط زيارات نفس المريض بين الأقسام يعتمد فقط على تطابق
  // الاسم/الهاتف (نفس آلية patientKey الاحتياطية، وهى كافية وحدها لهذا الغرض).
  //
  // إصلاح جوهري آخر (سبب حقيقي لمشكلة "بعض المرضى ما اتسجلوش" فى التسجيل
  // السريع): تنبيه "مريض مشابه" كان صندوقًا يظهر فجأة داخل الفورم بين حقل
  // الهاتف والطبيب أثناء الكتابة (blur) - ظهوره كان يدفع كل الحقول اللي تحته
  // (ومنها زرار "تسجيل الزيارة" نفسه) لأسفل فجأة، فلو المستخدم كان بيضغط بسرعة
  // فى المكان اللي "كان" فيه الزرار قبل الإزاحة، كانت ضغطته بتقع على فراغ أو
  // عنصر تاني تمامًا - وتبان الزيارة وكأنها "ما اتسجلتش" رغم إنها مشكلة إزاحة
  // بصرية، مش مشكلة حفظ بيانات. الحل: نقلنا هذا التنبيه بالكامل ليظهر فقط عند
  // الضغط على "تسجيل الزيارة" نفسه (داخل runVisitSave)، كنافذة تأكيد قياسية
  // (confirm) لا تحرّك تخطيط الصفحة إطلاقًا، فمفيش أي احتمال إزاحة بعد كده.

  c.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => { state.editId = b.dataset.edit; route(); }));
  c.querySelectorAll("[data-wa-booking]").forEach(b => b.addEventListener("click", () => {
    const v2 = list.find(v => v.id === b.dataset.waBooking);
    if (!v2) return;
    openWhatsAppChat(v2.phone, {
      patientName: v2.patient, clinicName: isDental ? "قسم الأسنان" : "قسم العيادات",
      doctorName: dName(v2.doctorId), orderNo: v2.fileNo || v2.id,
      paid: v2.paid, remaining: visitRemaining(v2),
    });
  }));
  c.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    if (!canDelete) { showToast("⚠️ ليس لديك صلاحية حذف الزيارات"); return; }
    const target = list.find(v => v.id === b.dataset.del);
    const hasLinked = target && target.linkedIncomeId;
    if (!confirm(hasLinked ? "هل تريد حذف هذه الزيارة؟ سيتم أيضًا حذف حركة الوارد المرتبطة بها فى دفتر الخزينة." : "هل تريد حذف هذه الزيارة؟")) return;
    if (hasLinked) {
      const idx2 = DB.income.findIndex(x => x.id === target.linkedIncomeId);
      if (idx2 > -1) DB.income.splice(idx2, 1);
      persist("income");
    }
    const idx = list.findIndex(v => v.id === b.dataset.del);
    const removed = idx > -1 ? list[idx] : null;
    if (idx > -1) list.splice(idx, 1);
    logActivity(isDental ? "حذف حالة أسنان" : "حذف زيارة", kind, removed, null);
    persist(isDental ? "visitsDental" : "visitsClinic");
    showToast("تم الحذف");
    route();
  }));
}

// صفحات العمليات والتحاليل - خدمات تحصيل نقدي مباشر بدون طبيب أو نسبة

const SERVICE_KIND_CONFIG = {
  operations: { listKey: "visitsOperations", label: "العمليات", serviceLabel: "اسم العملية", addLabel: "تسجيل عملية جديدة", waSection: "قسم العمليات", addAction: "إضافة عملية", editAction: "تعديل عملية", deleteAction: "حذف عملية" },
  labs:       { listKey: "visitsLabs",       label: "التحاليل", serviceLabel: "نوع التحليل", addLabel: "تسجيل تحليل جديد", waSection: "قسم التحاليل", addAction: "إضافة تحليل", editAction: "تعديل تحليل", deleteAction: "حذف تحليل", serviceOptionsKey: "labTestTypes" },
  radiology:  { listKey: "visitsRadiology",  label: "الأشعة",   serviceLabel: "نوع الأشعة",   addLabel: "تسجيل أشعة جديدة",  waSection: "قسم الأشعة",   addAction: "إضافة أشعة",   editAction: "تعديل أشعة",   deleteAction: "حذف أشعة",   serviceOptionsKey: "xrayTypes", simple: true },

  const displayList = list.filter(v => periodMatches(v.date, granularity, filterValue));
  const sortedVisits = sortByEntryOrderDesc(displayList);
  const visitsPg = paginateList(sortedVisits, `visits_${kind}`);

  c.innerHTML = `
    ${(editing ? canEdit : canAdd) ? `
    <div class="card" style="margin-bottom:18px;">
      <div class="section-title">${editing ? "تعديل السجل" : cfg.addLabel}</div>
      <form id="serviceVisitForm" class="form-grid visit-grid-3">
        <div class="field"><label>التاريخ</label><input type="date" name="date" required value="${editing?.date || todayISO()}"></div>
        <input type="hidden" name="fileNo" id="svcFileNoInput" value="${esc(editing ? editing.fileNo : "")}">
        <div class="field" style="grid-column:span 2; position:relative;">
          <label>اسم المريض</label>
          <input type="text" name="patient" id="svcPatientInput" required autocomplete="off" value="${esc(editing?.patient)}">
          <div id="svcPatientSuggest" style="display:none; position:absolute; z-index:20; top:100%; right:0; left:0; background:#fff; border:1px solid var(--border,#ccc); border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.12); max-height:220px; overflow:auto;"></div>
        </div>
        <div class="field"><label>رقم الهاتف</label><input type="text" name="phone" id="svcPhoneInput" value="${esc(editing?.phone)}"></div>
        <div class="field" style="grid-column:span 2;"><label>${cfg.serviceLabel}</label>
          ${typeOptions ? (() => {
              const selectedNames = editing?.serviceName ? editing.serviceName.split(/،\s*|,\s*/).filter(Boolean) : [];
              return `<select name="serviceName" multiple required style="height:120px;">
                ${typeOptions.map(t => `<option value="${esc(t)}" ${selectedNames.includes(t) ? "selected" : ""}>${esc(t)}</option>`).join("")}
              </select>
              <div class="hint" style="margin-top:4px;">اضغط مع الاستمرار (أو اسحب إصبعك) لاختيار أكثر من نوع للمريض الواحد</div>`;
            })()
                        : `<input type="text" name="serviceName" required value="${esc(editing?.serviceName)}">`}
        </div>
        ${cfg.simple ? `
        <div class="field"><label>المبلغ (ج.م)</label><input type="text" inputmode="decimal" step="0.01" name="amount" required value="${editing?.total ?? ""}"></div>
        <div class="field" style="align-self:end; display:flex; gap:8px;">
          <button type="submit" class="btn">${editing ? "حفظ التعديل" : "تسجيل"}</button>
          ${editing ? `<button type="button" class="btn ghost" id="cancelEdit">إلغاء</button>` : ""}
        </div>` : `
        <div class="field"><label>إجمالي الحساب (ج.م)</label><input type="text" inputmode="decimal" step="0.01" name="total" required value="${editing?.total ?? ""}"></div>
        <div class="field"><label>المدفوع</label><input type="text" inputmode="decimal" step="0.01" name="paid" required value="${editing?.paid ?? ""}"></div>
        <div class="field"><label>حالة الدفع</label><select name="status">${option(LISTS.payStatus, editing?.status)}</select></div>
        <div class="field"><label>ملاحظات</label><input type="text" name="notes" value="${esc(editing?.notes)}"></div>

  if (patientInput && suggestBox) {

    patientInput.addEventListener("input", () => {
      const q = patientInput.value.trim().toLowerCase();
      if (q.length < 2) { suggestBox.style.display = "none"; suggestBox.innerHTML = ""; return; }
      const matches = knownPatients.filter(g => (g.name || "").toLowerCase().includes(q)).slice(0, 6);
      if (!matches.length) { suggestBox.style.display = "none"; suggestBox.innerHTML = ""; return; }
      suggestBox.innerHTML = matches.map(g => `
        <div class="patient-suggest-item" data-name="${esc(g.name)}" data-phone="${esc(g.phone)}" data-fileno="${esc(g.fileNos[0] || "")}"

  }

  const svcForm = document.getElementById("serviceVisitForm");

    e.preventDefault();

    if (editing ? !canEdit : !canAdd) { showToast("⚠️ ليس لديك صلاحية كافية لهذا الإجراء"); return; }
    formLocked = true;

      await runServiceSave();

      console.error("Service visit save error:", err);
      formLocked = false;
      showToast("⚠️ حدث خطأ غير متوقع أثناء الحفظ - حاول مرة أخرى");
    }
    async function runServiceSave() {
      const fd = new FormData(e.target);
      const total = cfg.simple ? (Number(fd.get("amount")) || 0) : (Number(fd.get("total")) || 0);
      const paid = cfg.simple ? total : (Number(fd.get("paid")) || 0);
      const serviceNameVal = cfg.serviceOptionsKey ? fd.getAll("serviceName").filter(Boolean).join("، ") : fd.get("serviceName");
      const rec = {
        id: editing ? editing.id : uid(),
        date: fd.get("date"), fileNo: fd.get("fileNo"), patient: fd.get("patient"), phone: fd.get("phone"),
        serviceName: serviceNameVal,
        total, paid, paymentMethod: "نقدي",
        status: cfg.simple ? "تم" : fd.get("status"), notes: cfg.simple ? "" : fd.get("notes"),
        nextVisitDate: cfg.simple ? null : (fd.get("nextVisitDate") || null),
        linkedIncomeId: editing ? (editing.linkedIncomeId || null) : null,
        createdAt: editing ? (editing.createdAt || null) : nowISO(),
      };
      if (editing) {
        const idx = list.findIndex(v => v.id === editing.id);
        list[idx] = rec;
        logActivity(cfg.editAction, kind, editing, rec);
      } else {
        list.push(rec);
        logActivity(cfg.addAction, kind, null, rec);
      }
      syncVisitIncomeLink(rec, kind);
      let pushFailedOnline = false;
      try {
        await persist(cfg.listKey);
      } catch (err) {
        console.error("Service visit sync push failed (saved locally, will retry):", err);
        pushFailedOnline = true;
      }
      state.editId = null;
      if (pushFailedOnline) {
        showToast(`💾 ${editing ? "تم حفظ التعديل" : "تم التسجيل"} محليًا — تعذّر رفعه للسحابة الآن وسيُعاد رفعه تلقائيًا عند توفر الاتصال`, 3800);
      } else {
        saveToast(editing ? "تم حفظ التعديل" : "تم التسجيل بنجاح");
      }
      route();
    }
  });

  const cancelBtn = document.getElementById("cancelEdit");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { state.editId = null; route(); });

  c.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => { state.editId = b.dataset.edit; route(); }));
  c.querySelectorAll("[data-wa-booking]").forEach(b => b.addEventListener("click", () => {
    const v2 = list.find(v => v.id === b.dataset.waBooking);
    if (!v2) return;
    openWhatsAppChat(v2.phone, {
      patientName: v2.patient, clinicName: cfg.waSection,
      doctorName: "", orderNo: v2.fileNo || v2.id,
      paid: v2.paid, remaining: visitRemaining(v2),
    });

  c.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    if (!canDelete) { showToast("⚠️ ليس لديك صلاحية حذف السجلات"); return; }
    const target = list.find(v => v.id === b.dataset.del);
    const hasLinked = target && target.linkedIncomeId;
    if (!confirm(hasLinked ? "هل تريد حذف هذا السجل؟ سيتم أيضًا حذف حركة الوارد المرتبطة به فى دفتر الخزينة." : "هل تريد حذف هذا السجل؟")) return;
    if (hasLinked) {
      const idx2 = DB.income.findIndex(x => x.id === target.linkedIncomeId);
      if (idx2 > -1) DB.income.splice(idx2, 1);
      persist("income");
    }
    const idx = list.findIndex(v => v.id === b.dataset.del);
    const removed = idx > -1 ? list[idx] : null;
    if (idx > -1) list.splice(idx, 1);
    logActivity(cfg.deleteAction, kind, removed, null);
    persist(cfg.listKey);
    showToast("تم الحذف");
    route();
  }));
}

function renderPatientFilesPage(kind) {
  const c = document.getElementById("content");
  // كل صفحة (عيادات / أسنان) بقت مستقلة تمامًا: بياناتها، بحثها، فلاترها،
  // والمريض المفتوح فيها - كل ده بحالة خاصة بيها (مفاتيح state مميّزة بلاحقة
  // القسم) عشان التنقل بين الصفحتين ما يخلطش بحث/فلتر/مريض مفتوح فى واحدة
  // مع التانية.
  const ns = kind === "أسنان" ? "Dental" : "Clinic";
  const K = (base) => base + ns;
  const allVisits = allPatientVisits().filter(v => v.kind === kind);
  const allGroups = groupPatients(allVisits); // بدون فلاتر - تُستخدم للمتابعات القادمة وفتح ملف مريض بعينه

  const granKey = "patientFilterGran" + ns, valKey = "patientFilterVal" + ns;
  ensurePeriodFilter(granKey, valKey);
  const granularity = state[granKey], filterValue = state[valKey];
  if (!state[K("patientStatusFilter")]) state[K("patientStatusFilter")] = "all";
  const statusFilter = state[K("patientStatusFilter")];

  const filteredVisits = allVisits.filter(v =>
    periodMatches(v.date, granularity, filterValue) &&
    (statusFilter === "all" || v.status === statusFilter)
  );
  const groups = groupPatients(filteredVisits);

  const search = state[K("patientSearch")] || "";
  const q = search.trim().toLowerCase();
  const filtered = q ? groups.filter(g =>
    (g.name || "").toLowerCase().includes(q) ||
    (g.phone || "").toLowerCase().includes(q) ||
    g.fileNos.some(f => f.toLowerCase().includes(q))
  ) : groups;
  // إصلاح ترتيب: كان الترتيب بتاريخ آخر زيارة فقط، فمريض أُدخلت زيارته القديمة
  // اليوم (تسجيل متأخّر) ما كان يظهر أعلى القائمة رغم إنه فعليًا "آخر إدخال" -
  // الآن يعتمد على sortByEntryOrderDesc نفسها المستخدمة فى كل الصفحات الأخرى.
  const filteredSorted = sortByEntryOrderDesc(filtered.map(g => ({ ...g, createdAt: g.lastVisit?.createdAt, date: g.lastVisit?.date })));

  const upcoming = allGroups.filter(g => g.nextFollowUp)
    .sort((a, b) => (a.nextFollowUp.nextVisitDate || "").localeCompare(b.nextFollowUp.nextVisitDate || ""))
    .slice(0, 20);
  // تذكيرات صالحة للإرسال الجماعي: فقط المواعيد القادمة فعليًا (مش المتأخرة/الفائتة
  // أصلًا) واللي عندها رقم هاتف صالح - إرسال تذكير لموعد فات معناه ليس له داعٍ.
  const remindableCount = upcoming.filter(g => g.nextFollowUp.nextVisitDate >= todayISO() && sanitizePhoneForWhatsApp(g.phone)).length;

  const selectedKey = state[K("selectedPatientKey")];
  const selected = selectedKey ? allGroups.find(g => g.key === selectedKey) : null;
  const hasQuery = !!q; // فيه بحث فعلى شغال دلوقتي؟

  const upcomingPanelHTML = upcoming.length ? `
    <div class="card" style="margin-bottom:16px; border:1px solid #C79A3E;">
      <div class="section-title" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <span>🔔 مواعيد متابعة قادمة <span class="hint">${upcoming.length}</span></span>
        ${remindableCount ? `<button class="btn sm" id="sendAllRemindersBtn" style="background:#25D366; color:#fff;">📤 إرسال تذكير للكل (${remindableCount})</button>` : ""}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>الموعد</th><th>المريض</th><th>الهاتف</th><th>القسم</th><th></th></tr></thead>
        <tbody>
          ${upcoming.map(g => `
            <tr>
              <td style="font-weight:700; color:${g.nextFollowUp.nextVisitDate < todayISO() ? "var(--expense)" : "var(--ink)"};">${g.nextFollowUp.nextVisitDate}</td>
              <td>${esc(g.name || "-")}</td>
              <td>${esc(g.phone || "-")} ${waIconButtonHTML(g.phone, "wa-reminder", g.key)}</td>
              <td>${g.nextFollowUp.kind}</td>
              <td><button class="btn sm ghost" data-openpatient="${esc(g.key)}">عرض الملف</button></td>
            </tr>`).join("")}
        </tbody>
      </table></div>
    </div>` : "";

  const filtersHTML = `
    <div class="card" style="margin-bottom:16px; display:flex; align-items:end; justify-content:space-between; flex-wrap:wrap; gap:14px;">
      ${periodFilterHTML("patient" + ns, granularity, filterValue, allVisits.map(v => v.date))}
      <div>
        <div class="section-title" style="margin:0 0 6px;">💳 حالة الدفع</div>
        <select id="patientStatusSelect" style="padding:9px 10px; border-radius:8px; border:1px solid var(--border,#ccc); font-size:13.5px;">
          <option value="all" ${statusFilter === "all" ? "selected" : ""}>الكل</option>
          ${LISTS.payStatus.map(s => `<option value="${s}" ${statusFilter === s ? "selected" : ""}>${s}</option>`).join("")}
        </select>
      </div>
    </div>`;

  c.innerHTML = `
    <div style="position:relative; margin-bottom:16px;">
      <span style="position:absolute; top:50%; right:14px; transform:translateY(-50%); font-size:15px; pointer-events:none; opacity:.65;">🔍</span>
      <input type="text" id="patientSearchInput" placeholder="ابحث باسم المريض أو رقم الهاتف أو رقم الملف..." value="${esc(search)}"
        style="width:100%; padding:11px 42px 11px 14px; border-radius:10px; border:1px solid var(--border,#ccc); font-size:14px; background:#fff;">
    </div>

    ${selected ? renderPatientCard(selected) : (
      hasQuery
        // فيه بحث فعّال: النتيجة (القائمة المفلترة) تظهر فورًا أعلى الصفحة مباشرة
        // تحت شريط البحث، وتحتها مواعيد المتابعة والفلاتر - عشان اللي بيدور عن
        // مريض بعينه يلاقي النتيجة على طول من غير ما ينزل لتحت.
        ? `${renderPatientList(filteredSorted)}
           ${upcomingPanelHTML}
           ${filtersHTML}`
        // مفيش بحث شغال (تصفح عادى): الترتيب الافتراضى زي ما هو - المواعيد
        // القادمة أولًا، بعدين الفلاتر، بعدين القائمة الكاملة.
        : `${upcomingPanelHTML}
           ${filtersHTML}
           ${renderPatientList(filteredSorted)}`
    )}
  `;

  bindPeriodFilterEvents("patient" + ns, granKey, valKey);
  const statusSelect = document.getElementById("patientStatusSelect");
  if (statusSelect) statusSelect.addEventListener("change", () => { state[K("patientStatusFilter")] = statusSelect.value; state[K("selectedPatientKey")] = null; route(); });

  const searchInput = document.getElementById("patientSearchInput");
  if (searchInput) searchInput.addEventListener("input", () => {
    // نحافظ على التركيز وموضع المؤشر بعد إعادة الرسم حتى لا تتوقف الكتابة عند أول حرف
    const caret = searchInput.selectionStart;
    state[K("patientSearch")] = searchInput.value; state[K("selectedPatientKey")] = null;
    route();
    const newInput = document.getElementById("patientSearchInput");
    if (newInput) { newInput.focus(); newInput.setSelectionRange(caret, caret); }
  });
  c.querySelectorAll("[data-openpatient]").forEach(b => b.addEventListener("click", () => { state[K("selectedPatientKey")] = b.dataset.openpatient; route(); }));
  const backBtn = document.getElementById("backToPatientList");
  if (backBtn) backBtn.addEventListener("click", () => { state[K("selectedPatientKey")] = null; route(); });
  c.querySelectorAll("[data-gotovisit]").forEach(b => b.addEventListener("click", () => {
    state.page = b.dataset.kind; state.editId = b.dataset.gotovisit; route();
  }));
  // تحصيل دفعة سريعة على مستحق قديم: بدل ما يُضطر المستخدم يفتح الزيارة القديمة
  // كاملة للتعديل، أو (الأخطر) يسجّل زيارة جديدة منفصلة ظنًا منه أن هذا يُسقِط
  // الدين القديم (وهو لا يفعل - كل زيارة رصيدها مستقل تمامًا).
  // طريقة العمل (بعد التعديل بناءً على طلب صريح): بدل ما نزوّد "المدفوع" على
  // الزيارة القديمة نفسها (وهو ما كان يُخفي مبلغ التحصيل داخل تاريخ الزيارة
  // القديمة، فلا يظهر إيراد اليوم فعليًا فى يومية العيادات/الأسنان ولا فى تقرير
  // اليوم) - دلوقتي بننقص "الإجمالي" على الزيارة القديمة بمقدار المبلغ المحصَّل
  // (فينخفض "الباقي" عليها بنفس القدر، بالظبط زي الأول)، ثم نُنشئ زيارة "متابعة"
  // جديدة حقيقية بتاريخ اليوم، إجماليها ومدفوعها = المبلغ المحصَّل بالظبط (فباقيها
  // صفر دايمًا، مفيش دَين جديد) - فتظهر فى يومية القسم كزيارة اليوم، ويُحتسب
  // إيرادها ونصيب الطبيب/المجمع منها ليومها الصحيح، من غير أي ازدواج فى الحساب:
  // (إجمالى الزيارة القديمة بعد الخصم) + (إجمالى زيارة التحصيل الجديدة) = نفس
  // الإجمالى الأصلى تمامًا كما كان قبل التحصيل.
  c.querySelectorAll("[data-collect]").forEach(b => b.addEventListener("click", async () => {
    const kindKey = b.dataset.kind;
    const list = kindKey === "dental" ? DB.visitsDental : DB.visitsClinic;
    const rec = list.find(v => v.id === b.dataset.collect);
    if (!rec) return;
    const remaining = visitRemaining(rec);
    const input = prompt(`تحصيل دفعة من "${rec.patient || "المريض"}"\nالمبلغ المتبقي على هذه الزيارة: ${fmt(remaining)} ج.م\nادخل المبلغ المُحصَّل الآن:`, fmt(remaining));
    if (input === null) return;
    let amount = Number(String(input).replace(/[^\d.]/g, ""));
    if (!amount || amount <= 0) { showToast("⚠️ ادخل مبلغًا صحيحًا أكبر من صفر"); return; }
    if (amount > remaining + 0.009) amount = remaining; // لا يمكن تحصيل أكثر من الباقي الفعلي على هذه الزيارة
    const oldRec = { ...rec };
    rec.total = (Number(rec.total) || 0) - amount;
    rec.status = visitRemaining(rec) <= 0.009 ? "تم" : "جزئي";
    logActivity(kindKey === "dental" ? "تحصيل دفعة أسنان" : "تحصيل دفعة عيادات", kindKey, oldRec, rec);
    const collectionVisit = {
      id: uid(), date: todayISO(), fileNo: rec.fileNo || "", patient: rec.patient, phone: rec.phone,
      doctorId: rec.doctorId, examType: "متابعة", total: amount, paid: amount, status: "تم",
      notes: `تحصيل دفعة من مستحق زيارة ${rec.date || ""}`, nextVisitDate: null, createdAt: nowISO(),
    };
    list.push(collectionVisit);
    syncVisitIncomeLink(collectionVisit, kindKey);
    let pushFailedOnline = false;
    try {
      await persist(kindKey === "dental" ? "visitsDental" : "visitsClinic");
    } catch (err) {
      console.error("Collect payment sync push failed (saved locally, will retry):", err);
      pushFailedOnline = true;
    }
    if (pushFailedOnline) {
      showToast(`💾 تم تسجيل التحصيل محليًا — تعذّر رفعه للسحابة الآن وسيُعاد رفعه تلقائيًا عند توفر الاتصال`, 3800);
    } else {
      saveToast(`تم تحصيل ${fmt(amount)} ج.م بنجاح — وسُجِّلت زيارة متابعة بتاريخ اليوم`);
    }
    route();
  }));
  // تحصيل دفعة من "إجمالي المتبقي" على مستوى المريض ككل (مش زيارة بعينها): بيوزّع
  // المبلغ المُدخَل على زياراته الأقدم فالأحدث (FIFO) - نفس منطق سداد الديون
  // فى الواقع: تتقفل أقدم زيارة غير مسددة أولًا، ولو زاد المبلغ ينتقل للتالية،
  // وهكذا حتى ينفد المبلغ أو تُسدَّد كل الزيارات. مفيد جدًا لو المريض عليه أكتر
  // من زيارة قديمة غير مسددة ومش عايز تدوّر عليهم واحدة واحدة.
  // نفس منطق التحصيل الفردى: بننقص "الإجمالي" على كل زيارة قديمة اتحصّل منها
  // جزء (مش نزوّد "المدفوع" عليها)، ثم نُنشئ زيارة "متابعة" واحدة بتاريخ اليوم
  // بكامل المبلغ المحصَّل دفعة واحدة (إجمالي = مدفوع = المبلغ، فباقيها صفر) -
  // فيظهر التحصيل كإيراد حقيقى فى يومية اليوم، من غير أي ازدواج فى الحساب.
  c.querySelectorAll("[data-collect-total]").forEach(b => b.addEventListener("click", async () => {
    const g2 = allGroups.find(x => x.key === b.dataset.collectTotal);
    if (!g2) return;
    const totalDue = g2.totalDue;
    const input = prompt(`تحصيل دفعة من "${g2.name || "المريض"}"\nإجمالي المتبقي على كل زياراته: ${fmt(totalDue)} ج.م\nادخل المبلغ المُحصَّل الآن (سيُسدَّد به أقدم الزيارات غير المسددة أولًا):`, fmt(totalDue));
    if (input === null) return;
    let amount = Number(String(input).replace(/[^\d.]/g, ""));
    if (!amount || amount <= 0) { showToast("⚠️ ادخل مبلغًا صحيحًا أكبر من صفر"); return; }
    if (amount > totalDue + 0.009) amount = totalDue; // لا يمكن تحصيل أكثر من إجمالي المتبقي الفعلي
    // ترتيب الزيارات غير المسددة من الأقدم للأحدث (بعكس ترتيب العرض المعتاد بالأحدث أولًا)
    const unpaidOldestFirst = g2.visits.filter(v => visitRemaining(v) > 0.009)
      .slice().sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.createdAt || "").localeCompare(b.createdAt || ""));
    let remainingToApply = amount;
    let visitsSettled = 0;
    let firstTouchedDoctorId = null, firstTouchedDate = null, firstTouchedKindKey = null;
    const touchedTables = new Set();
    for (const v of unpaidOldestFirst) {
      if (remainingToApply <= 0.009) break;
      const kindKey = v.kindKey;
      const list = kindKey === "dental" ? DB.visitsDental : DB.visitsClinic;
      const rec = list.find(x => x.id === v.id);
      if (!rec) continue;
      const remaining = visitRemaining(rec);
      const applyNow = Math.min(remaining, remainingToApply);
      const oldRec = { ...rec };
      rec.total = (Number(rec.total) || 0) - applyNow;
      rec.status = visitRemaining(rec) <= 0.009 ? "تم" : "جزئي";
      logActivity(kindKey === "dental" ? "تحصيل دفعة أسنان" : "تحصيل دفعة عيادات", kindKey, oldRec, rec);
      touchedTables.add(kindKey === "dental" ? "visitsDental" : "visitsClinic");
      if (firstTouchedDoctorId === null) { firstTouchedDoctorId = rec.doctorId; firstTouchedDate = rec.date; firstTouchedKindKey = kindKey; }
      remainingToApply -= applyNow;
      if (rec.status === "تم") visitsSettled++;
    }
    // زيارة "متابعة" واحدة بتاريخ اليوم تمثّل كامل المبلغ المحصَّل فى هذه العملية
    if (firstTouchedKindKey) {
      const collectionList = firstTouchedKindKey === "dental" ? DB.visitsDental : DB.visitsClinic;
      const collectionVisit = {
        id: uid(), date: todayISO(), fileNo: g2.fileNos[0] || "", patient: g2.name, phone: g2.phone,
        doctorId: firstTouchedDoctorId, examType: "متابعة", total: amount, paid: amount, status: "تم",
        notes: `تحصيل دفعة من مستحقات قديمة (بدءًا من زيارة ${firstTouchedDate || ""})`, nextVisitDate: null, createdAt: nowISO(),
      };
      collectionList.push(collectionVisit);
      syncVisitIncomeLink(collectionVisit, firstTouchedKindKey);
      touchedTables.add(firstTouchedKindKey === "dental" ? "visitsDental" : "visitsClinic");
    }
    let pushFailedOnline = false;
    try {
      for (const table of touchedTables) await persist(table);
    } catch (err) {
      console.error("Collect total payment sync push failed (saved locally, will retry):", err);
      pushFailedOnline = true;
    }
    if (pushFailedOnline) {
      showToast(`💾 تم تسجيل التحصيل محليًا — تعذّر رفعه للسحابة الآن وسيُعاد رفعه تلقائيًا عند توفر الاتصال`, 3800);
    } else {
      saveToast(`تم تحصيل ${fmt(amount)} ج.م بنجاح${visitsSettled ? ` — تم سداد ${visitsSettled} ${visitsSettled === 1 ? "زيارة" : "زيارات"} بالكامل` : ""} — وسُجِّلت زيارة متابعة بتاريخ اليوم`);
    }
    route();
  }));
  c.querySelectorAll("[data-wa-patient]").forEach(b => b.addEventListener("click", () => {
    const g2 = allGroups.find(x => x.key === b.dataset.waPatient);
    if (!g2) return;
    openWhatsAppChat(g2.phone, {
      patientName: g2.name, orderNo: g2.fileNos[0] || "",
      paid: g2.totalPaid, remaining: g2.totalDue,
    });
  }));
  // إرسال واتساب من مستوى زيارة بعينها (تفاصيل الحساب الكاملة لهذه الزيارة تحديدًا)
  c.querySelectorAll("[data-wa-visit]").forEach(b => b.addEventListener("click", () => {
    const v2 = allPatientVisits().find(x => x.id === b.dataset.waVisit);
    if (!v2) return;
    openWhatsAppChat(v2.phone, {
      patientName: v2.patient, clinicName: v2.kind === "أسنان" ? "قسم الأسنان" : "قسم العيادات",
      doctorName: dName(v2.doctorId), orderNo: v2.fileNo || v2.id,
      paid: v2.paid, remaining: visitRemaining(v2),
    });
  }));
  // تذكير واتساب بموعد متابعة قادم لمريض بعينه (من جدول "مواعيد متابعة قادمة")
  c.querySelectorAll("[data-wa-reminder]").forEach(b => b.addEventListener("click", () => {
    const g2 = upcoming.find(x => x.key === b.dataset.waReminder);
    if (!g2 || !g2.nextFollowUp) return;
    openWhatsAppReminder(g2.phone, {
      patientName: g2.name,
      clinicName: g2.nextFollowUp.kind === "أسنان" ? "قسم الأسنان" : "قسم العيادات",
      doctorName: dName(g2.nextFollowUp.doctorId),
      date: g2.nextFollowUp.nextVisitDate,
    });
  }));
  // إرسال تذكيرات جماعية: يفتح محادثة واتساب منفصلة لكل مريض له موعد قادم فعليًا
  // (مش متأخر) وله رقم هاتف صالح - بفاصل زمنى بسيط بين كل فتح والتالى لتقليل
  // احتمال حجب المتصفح للنوافذ المنبثقة المتعددة دفعة واحدة.
  const sendAllRemindersBtn = document.getElementById("sendAllRemindersBtn");
  if (sendAllRemindersBtn) sendAllRemindersBtn.addEventListener("click", () => {
    const targets = upcoming.filter(g => g.nextFollowUp.nextVisitDate >= todayISO() && sanitizePhoneForWhatsApp(g.phone));
    if (!targets.length) return;
    if (!confirm(`سيتم فتح ${targets.length} محادثة واتساب منفصلة (نافذة لكل مريض) - قد يطلب المتصفح إذنك للسماح بالنوافذ المنبثقة. هل تريد المتابعة؟`)) return;
    targets.forEach((g, i) => setTimeout(() => {
      openWhatsAppReminder(g.phone, {
        patientName: g.name,
        clinicName: g.nextFollowUp.kind === "أسنان" ? "قسم الأسنان" : "قسم العيادات",
        doctorName: dName(g.nextFollowUp.doctorId),
        date: g.nextFollowUp.nextVisitDate,
      });
    }, i * 500));
    showToast(`جارٍ فتح ${targets.length} محادثة واتساب...`);
  });
}

function renderOutstandingBalances(kind) {
  const c = document.getElementById("content");
  // إصلاح: الشاشة كانت موحّدة (عيادات + أسنان معًا) بلا فصل - الآن تُفلتَر
  // الزيارات على القسم المطلوب فقط قبل التجميع، فالمبلغ المتبقي المعروض يعكس
  // مستحقات هذا القسم تحديدًا لكل مريض (وليس إجمالى مستحقاته فى القسمين معًا).
  const kindVisits = allPatientVisits().filter(v => v.kind === kind);
  const debtors = groupPatients(kindVisits)
    .filter(g => g.totalDue > 0.01)
    .sort((a, b) => b.totalDue - a.totalDue);
  const totalDebt = debtors.reduce((s, g) => s + g.totalDue, 0);
  const pageLabel = kind === "أسنان" ? "مرضى الأسنان عليهم مستحقات" : "مرضى العيادات عليهم مستحقات";
  const csvName = kind === "أسنان" ? "مرضى_الأسنان_عليهم_مستحقات.csv" : "مرضى_العيادات_عليهم_مستحقات.csv";

  c.innerHTML = `
    <div class="grid grid-2" style="margin-bottom:16px;">
      <div class="card kpi"><div class="label">إجمالي المستحقات غير المحصَّلة</div><div class="value" style="color:var(--expense);">${fmt(totalDebt)} ج.م</div></div>
      <div class="card kpi"><div class="label">عدد المرضى المدينين</div><div class="value">${fmtInt(debtors.length)}</div></div>
    </div>
    <div class="card">
      <div class="section-title" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <span>${pageLabel} <span class="hint">${debtors.length}</span></span>
        <button class="btn ghost sm no-print" id="exportDebtorsCsv">⬇️ تصدير Excel</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>المريض</th><th>الهاتف</th><th>آخر زيارة</th><th>عدد الزيارات</th><th>المبلغ المتبقي</th><th></th></tr></thead>
        <tbody>
          ${debtors.length === 0 ? `<tr class="empty-row"><td colspan="6">لا يوجد مرضى عليهم مستحقات حاليًا 🎉</td></tr>` : debtors.map(g => `
            <tr>
              <td style="font-weight:700;">${esc(g.name || "-")}</td>
              <td>${esc(g.phone || "-")} ${waIconButtonHTML(g.phone, "wa-debtor", g.key)}</td>
              <td>${g.lastVisit?.date || "-"}</td>
              <td>${g.visits.length}</td>
              <td style="font-weight:700; color:var(--expense);">${fmt(g.totalDue)}</td>
              <td><button class="btn sm ghost" data-openpatient="${esc(g.key)}">عرض الملف</button></td>
            </tr>`).join("")}
        </tbody>
      </table></div>
    </div>
  `;
  c.querySelectorAll("[data-openpatient]").forEach(b => b.addEventListener("click", () => {
    const targetPage = kind === "أسنان" ? "patientFilesDental" : "patientFilesClinic";
    const nsKey = kind === "أسنان" ? "selectedPatientKeyDental" : "selectedPatientKeyClinic";
    state.page = targetPage; state[nsKey] = b.dataset.openpatient; route();
  }));
  c.querySelectorAll("[data-wa-debtor]").forEach(b => b.addEventListener("click", () => {
    const g2 = debtors.find(x => x.key === b.dataset.waDebtor);
    if (!g2) return;
    openWhatsAppChat(g2.phone, {
      patientName: g2.name, orderNo: "",
      paid: g2.totalPaid, remaining: g2.totalDue,
    });
  }));
  const exportDebtorsBtn = document.getElementById("exportDebtorsCsv");
  if (exportDebtorsBtn) exportDebtorsBtn.addEventListener("click", () => {
    exportTableToCSV(csvName,
      ["المريض","الهاتف","آخر زيارة","عدد الزيارات","المبلغ المتبقي"],
      debtors.map(g => [g.name, g.phone, g.lastVisit?.date || "", g.visits.length, g.totalDue]));
  });
}
// ======================================================================
// صفحة الوارد / المنصرف
// ======================================================================
function renderMoneyPage(kind) {
  const isIncome = kind === "income";
  const list = isIncome ? DB.income : DB.expense;
  const cats = catNames(isIncome ? "income" : "expense");
  const numField = isIncome ? "receiptNo" : "voucherNo";
  const partyLabel = isIncome ? "اسم المريض أو الجهة" : "الجهة المصروف إليها";
  const personLabel = isIncome ? "اسم المستلم" : "اسم المسؤول";
  const c = document.getElementById("content");
  const editing = state.editId ? list.find(v => v.id === state.editId) : null;
  const canAdd = can(kind, "add"), canEdit = can(kind, "edit"), canDelete = can(kind, "delete");

  const monthStateKey = isIncome ? "incomeMonth" : "expenseMonth";
  if (!state[monthStateKey]) state[monthStateKey] = todayISO().slice(0, 7);
  const monthOptions = buildMonthOptions(list.map(x => x.date));
  const selectedMonth = state[monthStateKey];
  const filteredList = selectedMonth === "all" ? list : list.filter(x => (x.date || "").startsWith(selectedMonth));
  const totalAmt = filteredList.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const sortedMoney = sortByEntryOrderDesc(filteredList);
  const moneyPg = paginateList(sortedMoney, `money_${kind}`);

  c.innerHTML = `
    <div class="card no-print" style="margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div class="section-title" style="margin:0;">📅 عرض شهر: ${selectedMonth === "all" ? "كل الشهور" : monthLabel(selectedMonth)}</div>
      <select id="monthFilterSelect" style="padding:6px 10px; border-radius:8px; border:1px solid var(--border,#ccc); font-size:13px;">
        ${monthOptions.map(m => `<option value="${m}" ${selectedMonth === m ? "selected" : ""}>${monthLabel(m)}</option>`).join("")}
        <option value="all" ${selectedMonth === "all" ? "selected" : ""}>كل الشهور</option>
      </select>
    </div>

    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="card kpi"><div class="label">إجمالي ${isIncome ? "الوارد" : "المنصرف"} (${selectedMonth === "all" ? "كل الشهور" : monthLabel(selectedMonth)})</div><div class="value ${isIncome ? "income" : "expense"}">${fmt(totalAmt)} ج.م</div></div>
      <div class="card kpi"><div class="label">عدد العمليات</div><div class="value">${fmtInt(filteredList.length)}</div></div>
      <div class="card kpi"><div class="label">متوسط قيمة العملية</div><div class="value">${fmt(filteredList.length ? totalAmt / filteredList.length : 0)} ج.م</div></div>
    </div>

    ${(editing ? canEdit : canAdd) ? `
    <div class="card" style="margin-bottom:18px;">
      <div class="section-title">${editing ? "تعديل عملية" : `تسجيل عملية ${isIncome ? "تحصيل" : "صرف"} جديدة`}</div>
      <form id="moneyForm" class="form-grid">
        <div class="field"><label>التاريخ</label><input type="date" name="date" required value="${editing?.date || todayISO()}"></div>
        <div class="field"><label>${partyLabel}</label><input type="text" name="party" value="${esc(editing?.party)}"></div>
        <div class="field"><label>التصنيف</label><select name="category">${option(cats, editing?.category)}</select></div>
        <div class="field" style="grid-column:span 2;"><label>البيان</label><input type="text" name="desc" value="${esc(editing?.desc)}"></div>
        <div class="field"><label>طريقة الدفع</label><select name="paymentMethod">${option(LISTS.payMethods, editing?.paymentMethod)}</select></div>
        <div class="field"><label>المبلغ</label><input type="text" inputmode="decimal" step="0.01" min="0" name="amount" required value="${editing?.amount ?? ""}"></div>
        <div class="field"><label>${personLabel}</label><input type="text" name="person" value="${esc(editing?.[isIncome ? "receiver" : "responsible"])}"></div>
        ${(() => {
          if (!isIncome) return "";
          // إصلاح أمان بيانات: القيود اللى تُنشأ تلقائيًا من سجل زيارة (receiptNo
          // يبدأ بـ V-) يجب ألا يُسمح بربطها يدويًا بطبيب عبر هذا الحقل - لأن
          // مبلغها بالفعل محتسَب ضمن إيراد الطبيب من الزيارة نفسها، وربطها بطبيب
          // هنا كذلك كان سيؤدى لاحتساب نفس المبلغ مرتين فى كل تقارير الأطباء
          // ولوحة القيادة وتسوية حساب الأطباء.
          const isAutoLinkedVisit = editing && editing.receiptNo && String(editing.receiptNo).startsWith("V-");
          if (isAutoLinkedVisit) {
            return `<div class="field" style="grid-column:span 2;"><label>طبيب</label><div class="hint" style="padding:9px 11px; border:1.5px dashed var(--border,#ccc); border-radius:9px;">هذا القيد أُنشئ تلقائيًا من سجل زيارة مريض - لتغيير الطبيب المرتبط به عدّل الزيارة نفسها من صفحة يومية العيادات/الأسنان.</div></div>`;
          }
          return `
        <div class="field" style="grid-column:span 2;">
          <label>طبيب <span class="hint">(اختياري — لتسجيل إجمالي إيراده اليومي دفعة واحدة بدل تسجيل كل مريض على حدة فى يومية العيادات/الأسنان)</span></label>
          <select name="doctorId" id="incomeDoctorSelect">
            <option value="">بدون طبيب (تحصيل عادي)</option>
            ${DB.doctors.filter(d => d.status !== "موقوف").map(d => {
              const mode = d.type === "أسنان" ? "percent" : (d.feeMode || "fixed_visit");
              const label = mode === "percent" ? `طبيب ${pctDisplay(d.docPct)}% / مجمع ${pctDisplay(d.clinicPct)}%` : (mode === "fixed_daily" ? "أجر يومي ثابت" : "مبلغ ثابت لكل زيارة");
              return `<option value="${d.id}" ${editing?.doctorId === d.id ? "selected" : ""} data-fee-mode="${mode}" data-doc-pct="${d.docPct || 0}" data-clinic-pct="${d.clinicPct || 0}">${esc(d.name)} — ${esc(d.specialty)} (${label})</option>`;
            }).join("")}
          </select>
        </div>
        <div class="field" id="incomeShareTip" style="grid-column:1/-1; display:none; font-size:12.5px; color:var(--muted); background:var(--income-soft); padding:8px 12px; border-radius:8px;"></div>
        <div class="field" id="manualShareFields" style="grid-column:1/-1; display:none; gap:10px;">
          <div style="flex:1;"><label>حصة الطبيب من هذا المبلغ (ج.م)</label><input type="text" inputmode="decimal" step="0.01" min="0" name="docShare" id="incomeDocShareInput" value="${editing?.docShare ?? ""}"></div>
          <div style="flex:1;"><label>حصة المجمع من هذا المبلغ (ج.م)</label><input type="text" inputmode="decimal" step="0.01" min="0" name="clinicShare" id="incomeClinicShareInput" value="${editing?.clinicShare ?? ""}"></div>
        </div>
        <div class="hint" id="incomeShareSumHint" style="grid-column:1/-1; display:none;"></div>`;
        })()}
        <div class="field" style="grid-column:span 2;"><label>ملاحظات</label><input type="text" name="notes" value="${esc(editing?.notes)}"></div>
        <div class="field" style="align-self:end; display:flex; gap:8px;">
          <button type="submit" class="btn ${isIncome ? "" : "danger"}">${editing ? "حفظ التعديل" : "تسجيل العملية"}</button>
          ${editing ? `<button type="button" class="btn ghost" id="cancelEdit">إلغاء</button>` : ""}
        </div>
      </form>
    </div>` : ""}

    <div class="card">
      <div class="section-title">سجل ${isIncome ? "الوارد" : "المنصرف"} <span class="hint">${filteredList.length} عملية</span></div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>التاريخ</th><th>${partyLabel}</th><th>التصنيف</th><th>البيان</th>
          <th>طريقة الدفع</th><th>المبلغ</th><th>${personLabel}</th><th></th>
        </tr></thead>
        <tbody>
          ${filteredList.length === 0 ? `<tr class="empty-row"><td colspan="8">لا توجد عمليات مسجّلة فى ${selectedMonth === "all" ? "أي شهر" : "هذا الشهر"} بعد</td></tr>` : ""}
          ${moneyPg.pageItems.map(x => `
            <tr>
              <td>${x.date || "-"}${entryTimeDisplay(x.createdAt) ? `<div class="hint" style="font-size:11px;">${entryTimeDisplay(x.createdAt)}</div>` : ""}</td>
              <td>${esc(x.party)}</td>
              <td><span class="pill ${isIncome ? "income" : "expense"}">${esc(x.category)}</span></td>
              <td>${esc(x.desc)}${x.doctorId ? ` <span class="hint" title="إجمالي إيراد طبيب">🩺 ${esc(dName(x.doctorId))}</span>` : ""}</td>
              <td>${esc(x.paymentMethod)}</td>
              <td style="font-weight:700;">${fmt(x.amount)}</td>
              <td>${esc(x[isIncome ? "receiver" : "responsible"])}</td>
              <td>
                ${canEdit ? `<button class="btn sm ghost" data-edit="${x.id}">تعديل</button>` : ""}
                ${canDelete ? `<button class="btn sm danger" data-del="${x.id}">حذف</button>` : ""}
              </td>
            </tr>`).join("")}
        </tbody>
      </table></div>
      ${paginationControlsHTML(`money_${kind}`, moneyPg)}
    </div>
  `;

  bindPaginationEvents(c);
  const monthFilterSelect = document.getElementById("monthFilterSelect");
  if (monthFilterSelect) monthFilterSelect.addEventListener("change", () => { state[monthStateKey] = monthFilterSelect.value; state.tablePage[`money_${kind}`] = 1; route(); });

  const moneyForm = document.getElementById("moneyForm");
  const incomeDoctorSelect = document.getElementById("incomeDoctorSelect");
  const incomeShareTip = document.getElementById("incomeShareTip");
  const manualShareFields = document.getElementById("manualShareFields");
  const incomeDocShareInput = document.getElementById("incomeDocShareInput");
  const incomeClinicShareInput = document.getElementById("incomeClinicShareInput");
  const incomeShareSumHint = document.getElementById("incomeShareSumHint");
  if (incomeDoctorSelect && incomeShareTip) {
    // إصلاح محاسبي: بدل ما يُفرَض تقسيم تلقائي (قد يكون غلطًا) لأطباء "مبلغ ثابت
    // لكل زيارة"، أضفنا خانتين قابلتين للتعديل يدويًا يملأهما المستخدم بنفسه بناءً
    // على علمه الفعلى بعدد الكشوفات والمتابعات المكوِّنة لهذا التحصيل اليومي
    // المجمَّع - وهما اللي تُحفَظان فعليًا وتُستخدَمان فى كل التقارير (بدل التخمين
    // التلقائي)، مع تحقق يمنع الحفظ لو مجموعهما لا يساوي المبلغ الإجمالي بالضبط.
    const updateShareTip = () => {
      const opt = incomeDoctorSelect.selectedOptions[0];
      const amountInput = moneyForm.querySelector('[name="amount"]');
      const amount = Number(amountInput?.value) || 0;
      if (!opt || !opt.value) {
        incomeShareTip.style.display = "none";
        if (manualShareFields) manualShareFields.style.display = "none";
        if (incomeShareSumHint) incomeShareSumHint.style.display = "none";
        return;
      }
      const mode = opt.dataset.feeMode || "percent";
      incomeShareTip.style.display = "block";
      if (manualShareFields) manualShareFields.style.display = "flex";
      const docPct = Number(opt.dataset.docPct) || 0, clinicPct = Number(opt.dataset.clinicPct) || 0;
      // تعبئة مبدئية (اقتراح فقط) - يمكن للمستخدم تعديلها يدويًا قبل الحفظ
      if (incomeDocShareInput && incomeDocShareInput.value === "") incomeDocShareInput.value = mode === "percent" ? (amount * docPct).toFixed(2) : "";
      if (incomeClinicShareInput && incomeClinicShareInput.value === "") incomeClinicShareInput.value = mode === "percent" ? (amount * clinicPct).toFixed(2) : amount.toFixed(2);
      if (mode === "fixed_visit") {
        incomeShareTip.innerHTML = `⚠️ هذا الطبيب على نظام "مبلغ ثابت لكل زيارة" (كشف/متابعة) - النظام لا يقدر يقسّم إجمالى مبلغ مجمّع تلقائيًا بدقة. <strong>الأفضل تسجيل زيارات هذا الطبيب فرديًا</strong> من يومية العيادات. أو لو عارف بنفسك تفصيل الكشوفات/المتابعات المكوِّنة لهذا المبلغ، ادخل حصة الطبيب وحصة المجمع يدويًا تحت.`;
      } else if (mode === "fixed_daily") {
        incomeShareTip.innerHTML = `ℹ️ هذا الطبيب على نظام "أجر يومي ثابت" - افتراضيًا كل المبلغ للمجمع (وأجر الطبيب يُسجَّل منفصلًا من صفحة المرتبات)، لكن يمكنك تعديل الخانتين تحت لو أردت توزيعًا مختلفًا لهذا القيد تحديدًا.`;
      } else {
        incomeShareTip.innerHTML = `📊 القيمة المقترحة تلقائيًا حسب نسبة الطبيب (${pctDisplay(docPct * 100)}% / ${pctDisplay(clinicPct * 100)}%) - يمكنك تعديلها يدويًا تحت لو أردت. <strong>تنبيه:</strong> لا تسجّل هذا القيد لو سجّلت بالفعل زيارات المرضى فرديًا لنفس اليوم لهذا الطبيب، تفاديًا لازدواج الاحتساب.`;
      }
      updateShareSumHint();
    };
    function updateShareSumHint() {
      if (!incomeShareSumHint || !incomeDoctorSelect.value) { if (incomeShareSumHint) incomeShareSumHint.style.display = "none"; return; }
      const amount = Number(moneyForm.querySelector('[name="amount"]')?.value) || 0;
      const docShare = Number(incomeDocShareInput?.value) || 0, clinicShare = Number(incomeClinicShareInput?.value) || 0;
      const ok = Math.abs(docShare + clinicShare - amount) <= 0.01;
      incomeShareSumHint.style.display = "block";
      incomeShareSumHint.textContent = `مجموع الحصتين: ${fmt(docShare + clinicShare)} ج.م من إجمالى ${fmt(amount)} ج.م${ok ? " ✅" : " — يجب أن يساوي المبلغ الإجمالى بالضبط"}`;
      incomeShareSumHint.style.color = ok ? "var(--income, #1a7f37)" : "var(--expense, #c0392b)";
    }
    incomeDoctorSelect.addEventListener("change", updateShareTip);
    moneyForm.querySelector('[name="amount"]')?.addEventListener("input", updateShareTip);
    incomeDocShareInput?.addEventListener("input", updateShareSumHint);
    incomeClinicShareInput?.addEventListener("input", updateShareSumHint);
    updateShareTip();
  }
  if (moneyForm) moneyForm.addEventListener("submit", async e => {
    e.preventDefault();
    if (editing ? !canEdit : !canAdd) { showToast("⚠️ ليس لديك صلاحية كافية لهذا الإجراء"); return; }
    const fd = new FormData(e.target);
    const rec = {
      id: editing ? editing.id : uid(),
      date: fd.get("date"), [numField]: editing ? editing[numField] : null, party: fd.get("party"), category: fd.get("category"),
      desc: fd.get("desc"), paymentMethod: fd.get("paymentMethod"), amount: Number(fd.get("amount")) || 0,
      notes: fd.get("notes"),
      createdAt: editing ? (editing.createdAt || null) : nowISO(),
    };
    if (isIncome) {
      const isAutoLinkedVisit = editing && editing.receiptNo && String(editing.receiptNo).startsWith("V-");
      rec.doctorId = isAutoLinkedVisit ? null : (fd.get("doctorId") || null);
      if (rec.doctorId) {
        // إصلاح محاسبي: نحفظ حصة الطبيب/المجمع كما أدخلها المستخدم يدويًا لهذا
        // القيد تحديدًا (بدل تخمين تلقائي)، بعد التحقق من أن مجموعهما يساوي
        // المبلغ الإجمالى بالضبط - وإلا يضيع جزء من المبلغ أو يتكرر حسابه.
        const docShare = Number(fd.get("docShare")) || 0, clinicShare = Number(fd.get("clinicShare")) || 0;
        if (Math.abs(docShare + clinicShare - rec.amount) > 0.01) {
          showToast(`⚠️ مجموع حصة الطبيب وحصة المجمع (${fmt(docShare + clinicShare)}) لا يساوي المبلغ الإجمالى (${fmt(rec.amount)}) - صحّح الرقمين قبل الحفظ`);
          return;
        }
        rec.docShare = docShare; rec.clinicShare = clinicShare;
      } else {
        rec.docShare = null; rec.clinicShare = null;
      }
    }
    rec[isIncome ? "receiver" : "responsible"] = fd.get("person");
    if (editing) {
      const idx = list.findIndex(v => v.id === editing.id);
      list[idx] = rec;
      logActivity(isIncome ? "تعديل عملية وارد" : "تعديل عملية منصرف", kind, editing, rec);
    } else {
      list.push(rec);
      logActivity(isIncome ? "إضافة عملية وارد" : "إضافة عملية منصرف", kind, null, rec);
    }
    // إصلاح جوهري (نفس سبب اختفاء الزيارة الجديدة مؤقتًا فى العيادات): ننتظر
    // persist() فعليًا هنا قبل route()، بدل إطلاقها بدون انتظار كما كان سابقًا،
    // حتى لا يبدأ أى تحديث خلفى (backgroundRefreshAll) ويقرأ نسخة سحابية لم تصل
    // إليها هذه العملية بعد فتختفى مؤقتًا حتى إعادة رسم تالية. PENDING_WRITES
    // (المُحدَّث داخل persist نفسها) يحمى من هذا التضارب طوال مدة هذا الانتظار.
    let pushFailedOnline = false;
    try {
      await persist(isIncome ? "income" : "expense");
    } catch (err) {
      // فشل الرفع الفورى للسحابة رغم الاتصال (خطأ شبكة عابر...) - البيانات محفوظة
      // محليًا بالفعل وأُضيفت لطابور إعادة المحاولة التلقائية، فلا نعتبره فشلًا كاملًا.
      console.error("Money entry sync push failed (saved locally, will retry):", err);
      pushFailedOnline = true;
    }
    state.editId = null;
    if (rec.date) state[monthStateKey] = rec.date.slice(0, 7); // اعرض الشهر اللى اتسجّلت فيه العملية تلقائيًا
    if (pushFailedOnline) {
      showToast(`💾 ${editing ? "تم حفظ التعديل" : "تم التسجيل"} محليًا — تعذّر رفعه للسحابة الآن وسيُعاد رفعه تلقائيًا عند توفر الاتصال`, 3800);
    } else {
      saveToast(editing ? "تم حفظ التعديل" : "تم التسجيل بنجاح");
    }
    route();
  });

  const cancelBtn = document.getElementById("cancelEdit");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { state.editId = null; route(); });
  c.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => { state.editId = b.dataset.edit; route(); }));
  c.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    if (!canDelete) { showToast("⚠️ ليس لديك صلاحية حذف العمليات"); return; }
    if (!confirm("هل تريد حذف هذه العملية؟")) return;
    const idx = list.findIndex(v => v.id === b.dataset.del);
    const removed = idx > -1 ? list[idx] : null;
    if (idx > -1) list.splice(idx, 1);
    // إصلاح: حذف قيد وارد/منصرف من هذه الصفحة مباشرة (بدل حذف الزيارة أو المرتب
    // أو مصروف المعمل المصدر) كان يترك السجل المصدر بمرجع "linkedIncomeId" أو
    // "linkedExpenseId" معلّقًا يشير لقيد محذوف - فيختفي المبلغ من الخزينة بصمت
    // حتى تُعدَّل الزيارة/المرتب مرة أخرى (وقتها فقط يُعاد إنشاء القيد تلقائيًا).
    // الآن يُمسَح المرجع فورًا فى المصدر عند الحذف المباشر، فتبقى حالة الربط متسقة.
    if (removed) {
      if (isIncome) {
        DB.visitsClinic.forEach(v => { if (v.linkedIncomeId === removed.id) v.linkedIncomeId = null; });
        DB.visitsDental.forEach(v => { if (v.linkedIncomeId === removed.id) v.linkedIncomeId = null; });
      } else {
        DB.payroll.forEach(p => { if (p.linkedExpenseId === removed.id) p.linkedExpenseId = null; });
        DB.labExpenses.forEach(l => { if (l.linkedExpenseId === removed.id) l.linkedExpenseId = null; });
      }
    }
    logActivity(isIncome ? "حذف عملية وارد" : "حذف عملية منصرف", kind, removed, null);
    persist(isIncome ? "income" : "expense");
    if (removed) { persist("visitsClinic"); persist("visitsDental"); persist("payroll"); persist("labExpenses"); }
    showToast("تم الحذف");
    route();
  }));
}

        <tbody>

          ${ledgerPg.pageItems.map(r => `
            <tr style="background:${r.type === "وارد" ? "var(--income-soft)" : "var(--expense-soft)"};">

function renderPayroll() {
  const c = document.getElementById("content");
  const list = DB.payroll;
  const beneficiaries = [...DB.employees.map(e => e.name), ...DB.doctors.map(d => d.name)];
  const editing = state.editId ? list.find(v => v.id === state.editId) : null;
  // إصلاح صلاحيات: هذه الصفحة كانت الوحيدة بلا أي تحقق can() فعرض/إضافة/تعديل/
  // حذف كانت متاحة لأى مستخدم مسجّل دخول بصرف النظر عن صلاحياته الفعلية.
  const canAdd = can("payroll","add"), canEdit = can("payroll","edit"), canDelete = can("payroll","delete");
  const canWrite = editing ? canEdit : canAdd;

  if (!state.payrollMonth) state.payrollMonth = todayISO().slice(0, 7);
  const monthOptions = buildMonthOptions(list.map(x => x.month));
  const selectedMonth = state.payrollMonth;
  const filteredList = selectedMonth === "all" ? list : list.filter(x => x.month === selectedMonth);
  // إصلاح محاسبي: كان "المصروف الفعلى" يحسب فقط سجلات "تم" بكامل مبلغها،
  // و"المستحقات" تحسب كل ما هو غير "تم" بكامل مبلغه أيضًا - فسجل "جزئي" كان يُفقَد
  // من الحسابين معًا (لا يُحتسب مدفوعًا ولا يُحتسب مستحقًا بالقدر الصحيح). الآن كل
  // سجل يُقسَّم فعليًا بين "ما خرج من الخزينة بالفعل" (payrollPaidAmount) و"الباقى".
  const totalPaid = filteredList.reduce((s, x) => s + payrollPaidAmount(x), 0);
  const totalDue = filteredList.reduce((s, x) => s + Math.max(0, (Number(x.amount) || 0) - payrollPaidAmount(x)), 0);
  const sortedPayroll = sortByEntryOrderDesc(filteredList, x => `${x.month || ""}-${String(x.day || 0).padStart(2, "0")}`);
  const payrollPg = paginateList(sortedPayroll, "payroll");

  c.innerHTML = `
    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="card kpi"><div class="label">إجمالي المصروف (تم الدفع)</div><div class="value income">${fmt(totalPaid)} ج.م</div></div>
      <div class="card kpi"><div class="label">مستحقات غير مسددة</div><div class="value" style="color:#8A6300;">${fmt(totalDue)} ج.م</div></div>
      <div class="card kpi"><div class="label">عدد السجلات</div><div class="value">${fmtInt(filteredList.length)}</div></div>
    </div>

    ${canWrite ? `
    <div class="card" style="margin-bottom:18px;">
      <div class="section-title">${editing ? "تعديل سجل" : "تسجيل راتب / مستحق جديد"}</div>
      <form id="payForm" class="form-grid">
        <div class="field"><label>الشهر</label><input type="month" name="month" required value="${editing?.month || todayISO().slice(0,7)}"></div>
        <div class="field"><label>اليوم</label><input type="text" inputmode="decimal" name="day" min="1" max="31" placeholder="اليوم (اختياري)" value="${editing?.day ?? new Date().getDate()}"></div>
        <div class="field"><label>الاسم</label>
          <select name="name" required><option value="">اختر</option>${option(beneficiaries, editing?.name)}</select>
        </div>
        <div class="field"><label>نوع الاستحقاق</label><select name="type">${option(["راتب","أجر يومي ثابت","عيدية","سلفة","مستحقات مؤجلة"], editing?.type)}</select></div>
        <div class="field"><label>المبلغ</label><input type="text" inputmode="decimal" step="0.01" min="0" name="amount" required value="${editing?.amount ?? ""}"></div>
        <div class="field"><label>حالة الدفع</label><select name="status" id="payStatusSelect">${option(LISTS.payStatus, editing?.status)}</select></div>
        <div class="field" id="paidAmountField" style="${editing?.status === "جزئي" ? "" : "display:none;"}">
          <label>المبلغ المدفوع فعليًا (فى حالة "جزئي" فقط)</label>
          <input type="text" inputmode="decimal" step="0.01" min="0" name="paidAmount" id="paidAmountInput" value="${editing?.paidAmount ?? ""}" placeholder="كم خرج فعليًا من الخزينة حتى الآن؟">
        </div>
        <div class="field"><label>ملاحظات</label><input type="text" name="notes" value="${esc(editing?.notes)}"></div>
        <div class="field" style="align-self:end; display:flex; gap:8px;">
          <button type="submit" class="btn">${editing ? "حفظ التعديل" : "تسجيل"}</button>
          ${editing ? `<button type="button" class="btn ghost" id="cancelEdit">إلغاء</button>` : ""}
        </div>
      </form>
    </div>` : ""}

    ${can("doctors","view") ? doctorSettlementSectionHTML() : ""}

    <div class="card">
      <div class="section-title" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <span>سجل المرتبات والمستحقات <span class="hint">${filteredList.length} سجل</span></span>
        <select id="payrollMonthSelect" style="padding:6px 10px; border-radius:8px; border:1px solid var(--border,#ccc); font-size:13px;">
          ${monthOptions.map(m => `<option value="${m}" ${selectedMonth === m ? "selected" : ""}>${monthLabel(m)}</option>`).join("")}
          <option value="all" ${selectedMonth === "all" ? "selected" : ""}>كل الشهور</option>
        </select>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>الشهر</th><th>الاسم</th><th>نوع الاستحقاق</th><th>المبلغ</th><th>المدفوع فعليًا</th><th>الباقي</th><th>الحالة</th><th></th></tr></thead>
        <tbody>
          ${filteredList.length === 0 ? `<tr class="empty-row"><td colspan="8">لا توجد سجلات فى ${selectedMonth === "all" ? "أي شهر" : "هذا الشهر"} بعد</td></tr>` : ""}
          ${payrollPg.pageItems.map(x => {
            const paidNow = payrollPaidAmount(x);
            const dueNow = Math.max(0, (Number(x.amount) || 0) - paidNow);
            return `<tr>
              <td>${x.day ? `${x.day} / ` : ""}${x.month}${entryTimeDisplay(x.createdAt) ? `<div class="hint" style="font-size:11px;">${entryTimeDisplay(x.createdAt)}</div>` : ""}</td><td>${esc(x.name)}</td><td>${esc(x.type)}</td>
              <td style="font-weight:700;">${fmt(x.amount)}</td>
              <td class="income">${fmt(paidNow)}</td>
              <td style="color:${dueNow > 0 ? "var(--expense)" : "var(--ink)"};">${fmt(dueNow)}</td>
              <td><span class="pill ${x.status === "تم" ? "paid" : x.status === "جزئي" ? "partial" : "unpaid"}">${x.status}</span>${x.linkedExpenseId ? ` <span class="hint" title="سُجِّل تلقائيًا فى دفتر الخزينة">🔗</span>` : ""}</td>
              <td>${canEdit ? `<button class="btn sm ghost" data-edit="${x.id}">تعديل</button>` : ""} ${canDelete ? `<button class="btn sm danger" data-del="${x.id}">حذف</button>` : ""}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>
      ${paginationControlsHTML("payroll", payrollPg)}
    </div>
  `;

  bindPaginationEvents(c);
  if (can("doctors","view")) bindDoctorSettlementEvents(c);
  const payrollMonthSelect = document.getElementById("payrollMonthSelect");
  if (payrollMonthSelect) payrollMonthSelect.addEventListener("change", () => { state.payrollMonth = payrollMonthSelect.value; state.tablePage.payroll = 1; route(); });

  const payForm = document.getElementById("payForm");
  if (payForm) payForm.addEventListener("submit", async e => {
    e.preventDefault();
    if (editing ? !can("payroll","edit") : !can("payroll","add")) { showToast("⚠️ ليس لديك صلاحية كافية"); return; }
    const fd = new FormData(e.target);
    const amount = Number(fd.get("amount")) || 0;
    const status = fd.get("status");
    const paidAmount = Number(fd.get("paidAmount")) || 0;
    // تحقق محاسبي: حالة "جزئي" بلا مبلغ مدفوع مُدخَل تعنى عمليًا "لم يُدفع شيء"
    // - وهو ما يجعل استخدام "جزئي" بلا فائدة ويُربك من يراجع "المستحقات" لاحقًا.
    if (status === "جزئي" && paidAmount <= 0) { showToast("⚠️ من فضلك أدخل المبلغ المدفوع فعليًا لحالة \"جزئي\""); return; }
    if (status === "جزئي" && paidAmount >= amount) { showToast("⚠️ المبلغ المدفوع فعليًا يجب أن يكون أقل من إجمالى المبلغ - استخدم حالة \"تم\" لو دُفع بالكامل"); return; }
    const rec = { id: editing ? editing.id : uid(), month: fd.get("month"), day: fd.get("day") ? Number(fd.get("day")) : null, name: fd.get("name"), type: fd.get("type"), amount, status, paidAmount: status === "جزئي" ? paidAmount : null, notes: fd.get("notes"), linkedExpenseId: editing ? (editing.linkedExpenseId || null) : null, createdAt: editing ? (editing.createdAt || null) : nowISO() };
    if (editing) { list[list.findIndex(v => v.id === editing.id)] = rec; } else { list.push(rec); }
    syncPayrollExpenseLink(rec);
    // إصلاح جوهري (نفس إصلاح الوارد/المنصرف والعيادات): ننتظر persist() فعليًا
    // قبل route() بدل إطلاقها بدون انتظار، حتى لا يقرأ أى تحديث خلفى نسخة سحابية
    // قديمة لم يصلها هذا القيد بعد فيختفى مؤقتًا.
    let pushFailedOnline = false;
    try {
      await persist("payroll");
    } catch (err) {
      console.error("Payroll entry sync push failed (saved locally, will retry):", err);
      pushFailedOnline = true;
    }
    state.editId = null; state.payrollMonth = rec.month || state.payrollMonth;
    if (pushFailedOnline) {
      showToast("💾 تم الحفظ محليًا — تعذّر رفعه للسحابة الآن وسيُعاد رفعه تلقائيًا عند توفر الاتصال", 3800);
    } else {
      saveToast("تم الحفظ بنجاح");
    }
    route();
  });
  const payStatusSelect = document.getElementById("payStatusSelect");
  const paidAmountField = document.getElementById("paidAmountField");
  if (payStatusSelect && paidAmountField) payStatusSelect.addEventListener("change", () => {
    paidAmountField.style.display = payStatusSelect.value === "جزئي" ? "" : "none";
  });
  const cancelBtn = document.getElementById("cancelEdit");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { state.editId = null; route(); });
  c.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => {
    if (!can("payroll","edit")) { showToast("⚠️ ليس لديك صلاحية تعديل"); return; }
    state.editId = b.dataset.edit; route();
  }));
  c.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    if (!can("payroll","delete")) { showToast("⚠️ ليس لديك صلاحية حذف"); return; }
    const rec = list.find(v => v.id === b.dataset.del);
    const hasLinked = rec && rec.linkedExpenseId;
    if (!confirm(hasLinked ? "حذف هذا السجل؟ سيتم أيضًا حذف حركة الصرف المرتبطة به فى دفتر الخزينة." : "حذف هذا السجل؟")) return;
    if (hasLinked) {
      const idx = DB.expense.findIndex(x => x.id === rec.linkedExpenseId);
      if (idx > -1) DB.expense.splice(idx, 1);
      persist("expense");
    }
    list.splice(list.findIndex(v => v.id === b.dataset.del), 1);
    persist("payroll"); showToast("تم الحذف"); route();
  }));
}
