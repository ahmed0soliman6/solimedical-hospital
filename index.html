// تسوية حساب الأطباء الشهرية: بعض الأطباء (غالبًا أطباء الأسنان) عليهم مصروف
// معمل شهري ثابت يُخصَم من إجمالي إيرادهم أولًا، وبعدها يُقسَّم الصافي المتبقي
// بين الطبيب والمجمع حسب نسبة كل منهما - بخلاف حساب الحصة اليومي العادي لكل
// زيارة على حدة (الذى يبقى كما هو لأغراض المتابعة اليومية دون تعديل).
function doctorSettlementSectionHTML() {
  const canEditLab = can("doctors", "edit");
  if (!state.settlementMonth) state.settlementMonth = todayISO().slice(0, 7);
  const ym = state.settlementMonth;
  const allMonthVisits = allVisits().filter(v => (v.date || "").startsWith(ym));
  const lumpIncome = DB.income.filter(r => r.doctorId && (r.date || "").startsWith(ym));

  // إصلاح محاسبي جوهري: هذه الشاشة كانت مبنية بالكامل على معادلة نسبة مئوية
  // (netRevenue * docPct)، بصرف النظر عن نظام احتساب الطبيب الفعلى - فكانت تُظهر
  // صفرًا لحصة أى طبيب "مبلغ ثابت لكل زيارة" (لأن docPct لا معنى له لديه أصلًا).
  // الآن: أطباء النسبة (الأسنان عادة) على نفس المعادلة القديمة تمامًا بلا أى تغيير،
  // وأطباء "مبلغ ثابت"/"أجر يومي ثابت" تُجمع حصتهم الحقيقية من computeShare لكل
  // زيارة (تراعى تلقائيًا أى خصم أو لقطة سعر تاريخية)، ويُخصَم مصروف المعمل (إن
  // وُجد) من نصيب المجمع تحديدًا فى هذه الحالة - باعتباره تكلفة يتحمّلها المجمع لا
  // جزءًا من الاتفاق المُسعَّر مع الطبيب لكل زيارة.
  const rows = DB.doctors.filter(d => d.status !== "موقوف").map(d => {
    const mode = d.type === "أسنان" ? "percent" : (d.feeMode || "fixed_visit");
    const docVisits = allMonthVisits.filter(v => v.doctorId === d.id);
    const docLumpIncome = lumpIncome.filter(r => r.doctorId === d.id);
    const grossRevenue = docVisits.reduce((s, v) => s + (Number(v.paid) || 0), 0) + docLumpIncome.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const labRec = DB.labExpenses.find(x => x.doctorId === d.id && x.month === ym);
    const labExpense = Number(labRec?.amount) || 0;
    let netRevenue, docShare, clinicShare;
    if (mode === "percent") {
      netRevenue = Math.max(0, grossRevenue - labExpense);
      docShare = netRevenue * (d.docPct || 0);
      clinicShare = netRevenue * (d.clinicPct || 0) + Math.min(labExpense, grossRevenue); // يسترد المجمع مصروف المعمل من إجمالى الإيراد قبل القسمة
    } else {
      const perVisit = docVisits.reduce((s, v) => { const sh = computeShare(v); return { doc: s.doc + sh.doc, clinic: s.clinic + sh.clinic }; }, { doc: 0, clinic: 0 });
      const perLump = docLumpIncome.reduce((s, r) => { const sh = incomeDoctorShare(r); return { doc: s.doc + sh.doc, clinic: s.clinic + sh.clinic }; }, { doc: 0, clinic: 0 });
      docShare = perVisit.doc + perLump.doc;
      clinicShare = Math.max(0, perVisit.clinic + perLump.clinic - labExpense);
      netRevenue = grossRevenue - labExpense;
    }
    return { doctor: d, grossRevenue, labExpense, netRevenue, docShare, clinicShare, visitCount: docVisits.length + docLumpIncome.length };
  }).filter(r => r.visitCount > 0 || r.labExpense > 0);

  const totals = rows.reduce((s, r) => ({ gross: s.gross + r.grossRevenue, lab: s.lab + r.labExpense, net: s.net + r.netRevenue, doc: s.doc + r.docShare, clinic: s.clinic + r.clinicShare }), { gross: 0, lab: 0, net: 0, doc: 0, clinic: 0 });

  return `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <div class="section-title" style="margin:0;">🧾 تسوية حساب الأطباء (بعد خصم مصروف المعمل) — ${monthLabel(ym)}</div>
        <input type="month" id="settlementMonthInput" value="${ym}" style="padding:6px 10px; border-radius:8px; border:1px solid var(--border,#ccc);">
      </div>
      <p class="hint" style="margin-top:8px;">يُخصَم مصروف المعمل (إن وُجد) من إجمالى إيراد الطبيب أولًا لأطباء النسبة (الأسنان)، أو من نصيب المجمع مباشرة لأطباء المبلغ الثابت. مصروف المعمل المحفوظ هنا يُسجَّل تلقائيًا كحركة منصرف حقيقية فى دفتر الخزينة (فئة "معمل") — لا داعٍ لإدخاله يدويًا مرة أخرى هناك. <strong>ملاحظة:</strong> كل الزيارات (كشف ومتابعة) تدخل الآن ضمن حساب النسبة والحصص لكل أنواع الأطباء.</p>
    </div>

    <div class="grid grid-4" style="margin-bottom:16px;">
      <div class="card kpi"><div class="label">إجمالى الإيراد</div><div class="value">${fmt(totals.gross)} ج.م</div></div>
      <div class="card kpi"><div class="label">إجمالى مصروف المعمل</div><div class="value" style="color:var(--expense);">${fmt(totals.lab)} ج.م</div></div>
      <div class="card kpi"><div class="label">صافى حصص الأطباء</div><div class="value income">${fmt(totals.doc)} ج.م</div></div>
      <div class="card kpi"><div class="label">صافى حصة المجمع</div><div class="value income">${fmt(totals.clinic)} ج.م</div></div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="table-wrap"><table>
        <thead><tr>
          <th>الطبيب</th><th>عدد الزيارات</th><th>إجمالى الإيراد</th><th>مصروف المعمل</th><th>صافى الإيراد</th><th>حصة الطبيب</th><th>حصة المجمع</th>${canEditLab ? "<th></th>" : ""}
        </tr></thead>
        <tbody>
          ${rows.length === 0 ? `<tr class="empty-row"><td colspan="8">لا توجد بيانات لهذا الشهر بعد</td></tr>` : ""}
          ${rows.map(r => `
            <tr>
              <td>${esc(r.doctor.name)} <span class="hint">(${esc(r.doctor.specialty)})</span></td>
              <td>${fmtInt(r.visitCount)}</td>
              <td>${fmt(r.grossRevenue)}</td>
              <td>
                ${canEditLab ? `<input type="text" inputmode="decimal" step="0.01" min="0" class="lab-expense-input" data-doctor="${r.doctor.id}" value="${r.labExpense || ""}" placeholder="0" style="width:110px; padding:6px 8px; border-radius:8px; border:1px solid var(--border,#ccc);">` : fmt(r.labExpense)}
              </td>
              <td style="font-weight:700;">${fmt(r.netRevenue)}</td>
              <td class="income">${fmt(r.docShare)}</td>
              <td class="income">${fmt(r.clinicShare)}</td>
              ${canEditLab ? `<td><button class="btn sm" data-save-lab="${r.doctor.id}">حفظ</button></td>` : ""}
            </tr>`).join("")}
        </tbody>
      </table></div>
    </div>
  `;
}

function renderReports() {
  const c = document.getElementById("content");
  if (state.showAnnualReport) { renderAnnualReportPrint(); return; }
  const visits = allVisits();
  const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const year = new Date().getFullYear();

  // مدى التقرير الشهري قابل للاختيار (6 افتراضيًا بدل 12 ثابتة) عبر قائمة منسدلة؛
  // "الكل" يحسب عدد الأشهر الفعلي من أقدم سجل موجود (زيارة/وارد/منصرف) وصولًا
  // للشهر الحالى، بدل رقم ثابت افتراضى قد يكون أطول أو أقصر من عمر البيانات فعليًا.
  const reportMonthsChoice = state.reportMonthsRange || 6;
  const now2 = new Date();
  let monthsCount;
  if (reportMonthsChoice === "all") {
    const allDates = [
      ...visits.map(v => v.date), ...DB.income.map(x => x.date), ...DB.expense.map(x => x.date),
    ].filter(Boolean).sort();
    if (allDates.length) {
      const first = new Date(allDates[0].slice(0, 4), Number(allDates[0].slice(5, 7)) - 1, 1);
      monthsCount = Math.max(1, (now2.getFullYear() - first.getFullYear()) * 12 + (now2.getMonth() - first.getMonth()) + 1);
    } else {
      monthsCount = 6;
    }
  } else {
    monthsCount = Number(reportMonthsChoice) || 6;
  }
  // آخر N شهرًا بالترتيب الزمنى وصولًا للشهر الحالى (بدلًا من شهور السنة
  // التقويمية الحالية فقط 01-12، والتى كانت تُخفى بيانات أى شهر من سنة سابقة
  // عند عبور حد السنة، مثلًا بيانات ديسمبر من العام الماضى).
  const monthKeys = [...Array(monthsCount)].map((_, i) => {
    const d = new Date(now2.getFullYear(), now2.getMonth() - (monthsCount - 1 - i), 1);
    return { ym: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`, y: d.getFullYear(), mIdx: d.getMonth() };
  });

  const monthlyRows = monthKeys.map(({ ym, y, mIdx }) => {
    const rev = visits.filter(v => (v.date || "").startsWith(ym)).reduce((s, v) => s + (Number(v.paid) || 0), 0);
    const inc = DB.income.filter(x => (x.date || "").startsWith(ym)).reduce((s, x) => s + (Number(x.amount) || 0), 0);
    const exp = DB.expense.filter(x => (x.date || "").startsWith(ym)).reduce((s, x) => s + (Number(x.amount) || 0), 0);
    const count = visits.filter(v => (v.date || "").startsWith(ym)).length;
    const label = y === now2.getFullYear() ? monthNames[mIdx] : `${monthNames[mIdx]} ${y}`;
    return { name: label, rev, inc, exp, net: inc - exp, count };
  });

  const byDoctor = DB.doctors.map(d => {
    const dv = visits.filter(v => v.doctorId === d.id);
    const rev = dv.reduce((s, v) => s + (Number(v.paid) || 0), 0);
    const shares = dv.reduce((s, v) => { const sh = computeShare(v); return { doc: s.doc + sh.doc, clinic: s.clinic + sh.clinic }; }, { doc: 0, clinic: 0 });
    return { name: d.name, type: d.type, count: dv.length, rev, ...shares };
  }).filter(r => r.count > 0).sort((a, b) => b.rev - a.rev);

  const bySpecialty = {};
  DB.visitsClinic.forEach(v => {
    const d = dInfo(v.doctorId);
    const spec = d ? d.specialty : "غير محدد";
    bySpecialty[spec] = (bySpecialty[spec] || 0) + (Number(v.paid) || 0);
  });

  state.closingMonth = state.closingMonth || todayISO().slice(0, 7);
  const closing = monthlyClosingData(state.closingMonth);
  const closingMonthName = monthNames[Number(closing.ym.slice(5, 7)) - 1] || "";
  const closingYear = closing.ym.slice(0, 4);

  c.innerHTML = `
    <div class="card no-print" style="margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div class="section-title" style="margin:0;">📑 التقارير</div>
      <button class="btn" id="openAnnualReportBtn" style="background:var(--navy); color:#fff;">📋 تقرير سنوي جاهز للعرض/الطباعة</button>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div class="section-title" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <span>📑 تقرير الإقفال الشهري</span>

    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { showToast("⚠️ الملف غير صالح — تأكد أنه ملف نسخة احتياطية صحيح"); restoreBackupInput.value = ""; return; }
      const data = parsed && parsed.data ? parsed.data : parsed; // دعم الملف بصيغته أو مباشرة ككائن بيانات
      const foundKeys = BACKUP_KEYS.filter(k => data && Object.prototype.hasOwnProperty.call(data, k));
      if (!foundKeys.length) { showToast("⚠️ لم يتم التعرف على هذا الملف كنسخة احتياطية للنظام"); restoreBackupInput.value = ""; return; }
      const when = parsed?.exportedAt ? new Date(parsed.exportedAt).toLocaleString("ar-EG") : "غير معروف";
      if (!confirm(`سيتم استبدال كل بيانات النظام الحالية بنسخة بتاريخ: ${when}\nهذا الإجراء لا يمكن التراجع عنه. متأكد من المتابعة؟`)) { restoreBackupInput.value = ""; return; }
      showToast("جارٍ الاستعادة...", 60000);
      // إصلاح جوهري: الاستعادة كانت تمرّ بمسار الدمج الذكى العادى (المقارنة
      // بـ updatedAt)، فإذا كانت السحابة تحمل تعديلات أحدث زمنيًا من تاريخ
      // النسخة الاحتياطية (الحالة الطبيعية دائمًا عند استعادة نسخة قديمة عمدًا
      // للتراجع عن خطأ)، كان الدمج يُفضّل بيانات السحابة "الأحدث" ويتجاهل بيانات
      // النسخة الاحتياطية بصمت - فتفشل الاستعادة فعليًا فى تحقيق الغرض منها
      // (التراجع لحالة سابقة). الآن يُختم كل سجل بطابع زمنى جديد (الآن) عند
      // الاستعادة، لضمان اعتباره الأحدث دائمًا والفوز بالدمج، تمامًا كما يفعل أى
      // تعديل يدوى حقيقى يقوم به المدير.
      const stamp = nowISO();
      foundKeys.forEach(key => {
        DB[key] = data[key];
        if (Array.isArray(DB[key])) DB[key].forEach(rec => { if (rec && typeof rec === "object") rec.updatedAt = stamp; });
      });
      if (!DB.settings) DB.settings = { openingBalance: 0 };
      if (DB.settings.manualConflictReview === undefined) DB.settings.manualConflictReview = false;
      (async () => {
        const failed = [];
        let totalDeleted = 0, deletionApplied = false;
        for (const key of foundKeys) {
          try {
            const result = Array.isArray(DB[key]) ? await restoreTableFully(key, DB[key].map(r => r.id)) : { applied: false, deleted: 0 };
            if (result.applied) { totalDeleted += result.deleted; deletionApplied = true; }
            await persist(key);
          } catch (e) { console.error("Restore failed for", key, e); failed.push(key); }
        }
        logActivity("استعادة نسخة احتياطية (تاريخ النسخة: " + when + ")", "settings");
        if (failed.length) {
          showToast(`⚠️ تمت الاستعادة محليًا، لكن تعذّر رفع: ${failed.join("، ")} — سيُعاد المحاولة تلقائيًا عند توفر الاتصال`, 5000);
        } else if (deletionApplied && totalDeleted > 0) {
          saveToast(`تمت الاستعادة الكاملة بنجاح — وحُذفت ${totalDeleted} سجل لم تكن موجودة فى النسخة الاحتياطية`);
        } else if (!deletionApplied) {
          saveToast("تمت استعادة التعديلات محليًا. لن يتم حذف أى إضافات لاحقة من السحابة تلقائيًا - أعد الاستعادة وأنت متصل بالإنترنت لو أردت حذفها", 5000);
        } else {
          saveToast("تمت الاستعادة بنجاح");
        }
        restoreBackupInput.value = "";
        route();
      })();
    };
    reader.onerror = () => { showToast("⚠️ تعذّر قراءة الملف"); restoreBackupInput.value = ""; };
    reader.readAsText(file);
  });

    const rec = { name: fd.get("name"), job: fd.get("job"), salary: Number(fd.get("salary")) || 0, status: fd.get("status") };
    if (editId) {
      const emp = DB.employees.find(x => x.id === editId);
      const before = emp ? { ...emp } : null;
      if (emp) Object.assign(emp, rec);
      logActivity("تعديل موظف", "settings", before, emp);
      state.editEmpId = null;
      saveToast("تم حفظ تعديل الموظف");
    } else {
      const newEmp = { id: uid(), ...rec };
      DB.employees.push(newEmp);
      logActivity("إضافة موظف", "settings", null, newEmp);
      saveToast("تمت إضافة الموظف");
    }
    persist("employees"); route();
  });
  c.querySelectorAll("[data-editemp]").forEach(b => b.addEventListener("click", () => { state.editEmpId = b.dataset.editemp; route(); }));
  const cancelEmpEditBtn = document.getElementById("cancelEmpEdit");
  if (cancelEmpEditBtn) cancelEmpEditBtn.addEventListener("click", () => { state.editEmpId = null; route(); });
  c.querySelectorAll("[data-toggleemp]").forEach(b => b.addEventListener("click", () => {
    if (!can("employees","edit")) { showToast("⚠️ ليس لديك صلاحية"); return; }
    const emp = DB.employees.find(x => x.id === b.dataset.toggleemp);
    const before = emp.status;
    emp.status = emp.status === "موقوف" ? "نشط" : "موقوف";
    logActivity("تغيير حالة موظف", "settings", before, emp.status);
    persist("employees"); route();
  }));
  c.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => {
    if (!can("doctors","edit")) { showToast("⚠️ ليس لديك صلاحية"); return; }
    const d = DB.doctors.find(x => x.id === b.dataset.toggle);
    const before = d.status;
    d.status = d.status === "نشط" ? "موقوف" : "نشط";
    logActivity("تغيير حالة طبيب", "settings", before, d.status);
    persist("doctors"); route();
  }));
  c.querySelectorAll("[data-deldoc]").forEach(b => b.addEventListener("click", () => {
    if (!can("doctors","delete")) { showToast("⚠️ ليس لديك صلاحية"); return; }
    const docId = b.dataset.deldoc;
    // إصلاح سلامة محاسبية: حذف الطبيب نهائيًا لا يمسّ سجلات الزيارات القديمة
    // فعليًا (كما تذكر رسالة التأكيد)، لكن كل تقارير الحصص (لوحة القيادة، الإقفال
    // الشهري، تسوية حساب الأطباء) تحسب نسبة الطبيب حيًا وقت العرض - فبمجرد حذف
    // الطبيب تُصفَّر حصته فى كل التقارير التاريخية القديمة بصمت رغم بقاء مبلغ
    // التحصيل نفسه فى الخزينة. لتفادى فقد هذا التاريخ المالي، يُمنع الحذف النهائي
    // لأي طبيب له سجل تعاملات سابق، ويُقترح "إيقاف" بدلًا منه (يحافظ على كل شىء
    // ويخفيه فقط من قوائم الاختيار عند التسجيل الجديد).
    const hasHistory = allVisits().some(v => v.doctorId === docId)
      || DB.income.some(x => x.doctorId === docId)
      || DB.labExpenses.some(x => x.doctorId === docId);
    if (hasHistory) {
      showToast("⚠️ لا يمكن حذف هذا الطبيب نهائيًا لوجود سجل تعاملات سابق له (يؤثر على دقة التقارير المالية القديمة). استخدم زر 'إيقاف' بدلًا من ذلك.", 5000);
      return;
    }
    if (!confirm("حذف هذا الطبيب نهائيًا؟")) return;
    const idx = DB.doctors.findIndex(x => x.id === docId);
    const removed = idx > -1 ? DB.doctors[idx] : null;
    if (idx > -1) DB.doctors.splice(idx, 1);
    logActivity("حذف طبيب", "settings", removed, null);
    persist("doctors"); showToast("تم الحذف"); route();
  }));
  c.querySelectorAll("[data-editdoc]").forEach(b => b.addEventListener("click", () => {
    if (!can("doctors","edit")) { showToast("⚠️ ليس لديك صلاحية"); return; }
    state.editDocId = b.dataset.editdoc; route();
  }));
  const cancelDocBtn = document.getElementById("cancelDocEdit");
  if (cancelDocBtn) cancelDocBtn.addEventListener("click", () => { state.editDocId = null; route(); });
  const docSearchInp = document.getElementById("docSearch");
  if (docSearchInp) docSearchInp.addEventListener("input", () => {
    const term = docSearchInp.value.trim().toLowerCase();
    document.querySelectorAll("[data-docrow]").forEach(row => {
      row.style.display = row.dataset.docsearch.includes(term) ? "" : "none";
    });
  });
  function moveDoc(id, dir) {
    if (!can("doctors","edit")) { showToast("⚠️ ليس لديك صلاحية"); return; }
    const list = sortedDoctors();
    const idx = list.findIndex(x => x.id === id);
    const swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= list.length) return;
    const a = list[idx], b = list[swapIdx];
    const tmp = a.order ?? idx; a.order = b.order ?? swapIdx; b.order = tmp;
    persist("doctors"); route();
  }
  c.querySelectorAll("[data-docup]").forEach(b => b.addEventListener("click", () => moveDoc(b.dataset.docup, -1)));
  c.querySelectorAll("[data-docdown]").forEach(b => b.addEventListener("click", () => moveDoc(b.dataset.docdown, 1)));
  c.querySelectorAll("[data-delemp]").forEach(b => b.addEventListener("click", () => {
    if (!can("employees","delete")) { showToast("⚠️ ليس لديك صلاحية"); return; }
    if (!confirm("حذف هذا الموظف؟")) return;
    const idx = DB.employees.findIndex(x => x.id === b.dataset.delemp);
    const removed = idx > -1 ? DB.employees[idx] : null;
    if (idx > -1) DB.employees.splice(idx, 1);
    logActivity("حذف موظف", "settings", removed, null);
    persist("employees"); showToast("تم الحذف"); route();
  }));
}

// صفحة مراجعة تعارضات البيانات (مرحلة ج)

const CONFLICT_TABLE_LABELS = {
  doctors: "الأطباء", employees: "الموظفون", visitsClinic: "زيارات العيادات", visitsDental: "حالات الأسنان",
  visitsOperations: "زيارات العمليات", visitsLabs: "زيارات التحاليل", visitsRadiology: "زيارات الأشعة",
  income: "الوارد", expense: "المنصرف", payroll: "المرتبات", staffAccounts: "حسابات المستخدمين",
};
function conflictRecordLabel(table, rec) {
  if (!rec) return "-";
  if (table === "doctors" || table === "employees" || table === "staffAccounts") return rec.name || rec.displayName || rec.id;
  if (table === "visitsClinic" || table === "visitsDental" || table === "visitsOperations" || table === "visitsLabs" || table === "visitsRadiology") return `${rec.patient || "-"} — ${rec.date || "-"}`;
  if (table === "income" || table === "expense") return `${rec.party || "-"} — ${fmt(rec.amount)} ج.م`;
  if (table === "payroll") return `${rec.name || "-"} — ${rec.month || "-"}`;
  return rec.id;
}
function conflictDiffFields(local, remote) {
  const keys = Array.from(new Set([...Object.keys(local || {}), ...Object.keys(remote || {})])).filter(k => k !== "updatedAt");
  return keys.filter(k => JSON.stringify(local?.[k]) !== JSON.stringify(remote?.[k]));
}
function renderDataConflicts() {
  const c = document.getElementById("content");
  c.innerHTML = `<div class="card"><div class="section-title">⚖️ جارٍ تحميل التعارضات...</div></div>`;
  getAllConflicts().then(list => {
    if (!list.length) {
      c.innerHTML = `
        <div class="card" style="text-align:center; padding:50px 20px;">
          <div style="font-size:38px; margin-bottom:10px;">✅</div>
          <div style="font-weight:800; font-size:16px; color:var(--navy);">لا توجد تعارضات بيانات حاليًا</div>
          <div class="hint" style="margin-top:6px;">كل السجلات متطابقة بين هذا الجهاز والقاعدة السحابية.</div>
        </div>`;
      return;
    }
    c.innerHTML = `
      <div class="card" style="margin-bottom:16px;">
        <div class="section-title">⚖️ تعارضات بيانات بانتظار المراجعة <span class="hint">${list.length} تعارض</span></div>
        <p class="hint">تم تعديل هذه السجلات من جهازين مختلفين قبل اكتمال المزامنة بينهما. اختر النسخة الصحيحة لكل سجل.</p>
      </div>
      ${list.map((cft, i) => {
        const diffFields = conflictDiffFields(cft.local, cft.remote);
        return `
        <div class="card" style="margin-bottom:16px;">
          <div class="section-title">${CONFLICT_TABLE_LABELS[cft.table] || cft.table} — ${esc(conflictRecordLabel(cft.table, cft.local))}</div>
          <div class="grid grid-2" style="gap:12px;">
            <div style="border:2px solid var(--income); border-radius:10px; padding:10px;">
              <div style="font-weight:800; margin-bottom:6px;">💻 النسخة المحلية (هذا الجهاز)</div>
              <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">آخر تعديل: ${esc(cft.local?.updatedAt || "-")}</div>
              ${diffFields.map(f => `<div style="font-size:12.5px; margin-bottom:3px;"><b>${esc(f)}:</b> ${esc(cft.local?.[f])}</div>`).join("")}
              <button class="btn sm" style="margin-top:8px; width:100%; justify-content:center;" data-resolve="local" data-table="${cft.table}" data-id="${cft.id}">اعتماد هذه النسخة</button>
            </div>
            <div style="border:2px solid var(--navy); border-radius:10px; padding:10px;">
              <div style="font-weight:800; margin-bottom:6px;">☁️ النسخة السحابية (جهاز آخر)</div>
              <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">آخر تعديل: ${esc(cft.remote?.updatedAt || "-")}</div>
              ${diffFields.map(f => `<div style="font-size:12.5px; margin-bottom:3px;"><b>${esc(f)}:</b> ${esc(cft.remote?.[f])}</div>`).join("")}
              <button class="btn sm ghost" style="margin-top:8px; width:100%; justify-content:center;" data-resolve="remote" data-table="${cft.table}" data-id="${cft.id}">اعتماد هذه النسخة</button>
            </div>
          </div>
        </div>`;
      }).join("")}
    `;
    c.querySelectorAll("[data-resolve]").forEach(btn => btn.addEventListener("click", async () => {
      const { resolve, table, id } = btn.dataset;
      btn.disabled = true; btn.textContent = "جارٍ الحفظ...";
      await resolveConflict(table, id, resolve);
      showToast("تم حفظ القرار — سيُرفَع عند توفر الاتصال");
      renderDataConflicts();
      renderStorageIndicator();
    }));
  });
}

function countActiveAdmins(excludeId) {
  return (DB.staffAccounts || []).filter(a => a.role === "مدير" && a.status !== "موقوف" && a.id !== excludeId).length;
}
function renderUsersPage() {
  const c = document.getElementById("content");
  const editing = state.editUserId ? DB.staffAccounts.find(a => a.id === state.editUserId) : null;
  const canAdd = can("users", "add");
  const canEdit = can("users", "edit");
  const canDelete = can("users", "delete");
  c.innerHTML = `
    ${(canAdd || editing) ? `
    <div class="card" style="margin-bottom:18px;">
      <div class="section-title">${editing ? "تعديل مستخدم" : "إضافة مستخدم جديد"}</div>
      <form id="userForm" class="form-grid" style="grid-template-columns:1fr 1fr;">
        <input type="hidden" name="editId" value="${editing?.id || ""}">

        <div class="field"><label>الدور</label><select name="role">
          <option value="موظف" ${editing && editing.role !== "مدير" ? "selected" : ""}>موظف</option>

        </select></div>
        <div class="field" style="grid-column:span 2; display:flex; gap:8px;">
          <button type="submit" class="btn">${editing ? "حفظ التعديل" : "إضافة مستخدم"}</button>
          ${editing ? `<button type="button" class="btn ghost" id="cancelUserEdit">إلغاء</button>` : ""}
        </div>
      </form>
    </div>` : ""}

    <div class="card">
      <div class="section-title">قائمة المستخدمين <span class="hint">${(DB.staffAccounts || []).length}</span></div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>الاسم</th><th>اسم المستخدم</th><th>كلمة المرور</th><th>الدور</th><th>الحالة</th><th>آخر تسجيل دخول</th><th>تاريخ إنشاء الحساب</th><th></th>
        </tr></thead>
        <tbody>
          ${(DB.staffAccounts || []).length === 0 ? `<tr class="empty-row"><td colspan="8">لا يوجد مستخدمون</td></tr>` : ""}
          ${(DB.staffAccounts || []).map(a => `
            <tr>
              <td>${esc(a.displayName)}</td>
              <td>${esc(a.username)}</td>
              <td>${esc(a.password)}</td>
              <td>${esc(a.role)}</td>
              <td><span class="pill ${a.status === "موقوف" ? "unpaid" : "paid"}">${esc(a.status || "نشط")}</span></td>
              <td>${a.lastLogin ? new Date(a.lastLogin).toLocaleString("ar-EG") : "لم يسجّل الدخول بعد"}</td>
              <td>${esc(a.createdAt || "-")}</td>
              <td style="white-space:nowrap; display:flex; gap:4px; flex-wrap:wrap;">
                ${canEdit ? `<button class="btn sm ghost" data-edituser="${a.id}">تعديل</button>` : ""}
                ${canEdit ? `<button class="btn sm ghost" data-resetpass="${a.id}">إعادة تعيين كلمة المرور</button>` : ""}
                ${canEdit ? `<button class="btn sm ghost" data-toggleuser="${a.id}">${a.status === "موقوف" ? "تفعيل" : "إيقاف"}</button>` : ""}
                ${canDelete ? `<button class="btn sm danger" data-deluser="${a.id}">حذف</button>` : ""}
              </td>
            </tr>`).join("")}
        </tbody>
      </table></div>
    </div>
  `;

  const form = document.getElementById("userForm");
  if (form) form.addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const editId = fd.get("editId");
    if (editId && !canEdit) { showToast("⚠️ ليس لديك صلاحية تعديل المستخدمين"); return; }
    if (!editId && !canAdd) { showToast("⚠️ ليس لديك صلاحية إضافة مستخدمين"); return; }
    const username = fd.get("username").trim();
    const dup = (DB.staffAccounts || []).some(a => a.username === username && a.id !== editId);
    if (dup) { showToast("⚠️ اسم المستخدم مستخدم بالفعل"); return; }
    const password = fd.get("password");
    const role = fd.get("role");
    let msg;
    if (editId) {
      const a = DB.staffAccounts.find(x => x.id === editId);
      if (!a) return;
      if (a.role === "مدير" && role !== "مدير" && countActiveAdmins(a.id) === 0) {
        showToast("⚠️ لا يمكن تغيير دور آخر مدير نشط فى النظام"); return;
      }
      // إصلاح تتبّع: كان تعديل مستخدم يُسجَّل فى سجل النشاط بلا "قبل التعديل" إطلاقًا
      // (بخلاف كل شاشات التعديل الأخرى فى النظام)، فلا يمكن معرفة ماذا تغيّر فعليًا

      // نص حساس فى سجل النشاط بلا داعٍ - فقط إشارة إلى ما إذا تغيّرت أم لا.
      const before = { displayName: a.displayName, username: a.username, role: a.role, passwordChanged: false };

      if (password) a.password = password;
      // إصلاح جوهري: بدون تحديث updatedAt هنا، كان الدمج الذكى (pushTableSmart)

      // الحساب، فيرجّح الجهاز المحلى افتراضيًا عند تساوى الطابع الزمنى القديم -
      // وهو ما كان يعيد كتابة كلمة مرور قديمة فوق التعديل الصحيح بصمت.
      a.updatedAt = nowISO();

    } else {

      msg = "تمت إضافة المستخدم — لا تنسَ ضبط صلاحياته من صفحة إدارة الصلاحيات";
    }
    // ننتظر اكتمال الحفظ فعليًا قبل الإعلان عن النجاح. هذا مهم بشكل خاص هنا:
    // كان تغيير اسم المستخدم/كلمة المرور يظهر "تم الحفظ" فورًا حتى لو فشل الرفع
    // الفعلى للسحابة، فتبقى بيانات الدخول القديمة سارية على أى جهاز آخر لأن

      showToast(STORAGE_MODE === "supabase" && !navigator.onLine

        : msg);
    } catch (err) {
      console.error(err);
      showToast("⚠️ تم الحفظ محليًا فقط - تعذّر رفع التعديل الآن، سيُعاد المحاولة تلقائيًا. لن يظهر التعديل على الأجهزة الأخرى حتى تكتمل المزامنة");
    }
    route();
  });
  const cancelBtn = document.getElementById("cancelUserEdit");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { state.editUserId = null; route(); });

  c.querySelectorAll("[data-edituser]").forEach(b => b.addEventListener("click", () => { state.editUserId = b.dataset.edituser; route(); }));
  c.querySelectorAll("[data-resetpass]").forEach(b => b.addEventListener("click", async () => {

    a.password = newPass.trim();
    a.updatedAt = nowISO(); // نفس إصلاح تحديث المستخدم أعلاه - ضرورى لصحة الدمج الذكي بين الأجهزة
    logActivity("إعادة تعيين كلمة مرور", "users", null, a.displayName);
    try {
      await persist("staffAccounts");
      showToast(STORAGE_MODE === "supabase" && !navigator.onLine ? "تم الحفظ محليًا - سيُرفع عند توفر الاتصال" : "تم تعيين كلمة مرور جديدة");
    } catch (err) {
      console.error(err);
      showToast("⚠️ تم الحفظ محليًا فقط - تعذّر رفع كلمة المرور الجديدة الآن");

    route();

  c.querySelectorAll("[data-toggleuser]").forEach(b => b.addEventListener("click", async () => {

    if (a.status !== "موقوف" && a.role === "مدير" && countActiveAdmins(a.id) === 0) {

      showToast(a.status === "موقوف" ? "تم إيقاف المستخدم" : "تم تفعيل المستخدم");
    } catch (err) {
      console.error(err);
      showToast("⚠️ تم الحفظ محليًا فقط - تعذّر رفع التعديل الآن");
    }
    route();
  }));
  c.querySelectorAll("[data-deluser]").forEach(b => b.addEventListener("click", async () => {
    if (!canDelete) { showToast("⚠️ ليس لديك صلاحية"); return; }
    const a = DB.staffAccounts.find(x => x.id === b.dataset.deluser);
    if (!a) return;
    if (currentUser && currentUser.id === a.id) { showToast("⚠️ لا يمكنك حذف حسابك الحالي أثناء تسجيل الدخول به"); return; }
    if (a.role === "مدير" && countActiveAdmins(a.id) === 0) { showToast("⚠️ لا يمكن حذف آخر مدير نشط فى النظام"); return; }
    if (!confirm(`حذف المستخدم "${a.displayName}"؟ لن يتمكن من تسجيل الدخول بعد الآن.`)) return;
    DB.staffAccounts.splice(DB.staffAccounts.findIndex(x => x.id === a.id), 1);
    logActivity("حذف مستخدم", "users", a.displayName, null);
    try {
      await persist("staffAccounts");
      showToast("تم الحذف");
    } catch (err) {
      console.error(err);
      showToast("⚠️ تم الحذف محليًا فقط - تعذّر رفعه الآن، سيُعاد المحاولة تلقائيًا");
    }
    route();
  }));
}

const SESSION_KEY = APP_PREFIX + "session_user";
let currentUser = null;

// إصلاح جوهري: كانت الجلسة تُحفظ فى sessionStorage، وهو نوع تخزين يُمسَح تلقائيًا
// كلما أعاد المتصفح تحميل التبويب (حالة شائعة جدًا على الموبايل - خصوصًا أجهزة
// MIUI/Xiaomi التى تُغلق التبويبات فى الخلفية بقوة لتوفير البطارية، وهو بالضبط ما
// يحدث عند ترك المتصفح للذهاب لإعدادات النظام لتبديل الواى فاى/وضع الطيران). كل
// مرة يحدث هذا كانت الجلسة تُمسَح فورًا فيظهر الأمر وكأن النظام "سجّل خروج" تلقائيًا
// عند عودة الاتصال - رغم أنه لم يكن تسجيل خروج حقيقى بل فقدان جلسة بسبب نوع
// التخزين. localStorage يبقى محفوظًا عبر إعادة تحميل التبويب وحتى إغلاق المتصفح
// بالكامل، ولا يُمسَح إلا بتسجيل خروج فعلى (logout) أو مسح بيانات المتصفح يدويًا.
function getSession() {
  try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function setSession(user) {
  currentUser = user;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch (e) { /* ignore */ }
}
function clearSession() {
  currentUser = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
}

  const togglePassBtn = document.getElementById("togglePass");
  const passInput = document.getElementById("loginPass");

    togglePassBtn.textContent = shown ? "إظهار" : "إخفاء";
  });

    e.preventDefault();
    const username = document.getElementById("loginUser").value.trim();
    const password = document.getElementById("loginPass").value;
    const submitBtn = e.target.querySelector("button[type=submit]");
    // تأكد أولًا من أحدث نسخة من حسابات المستخدمين قبل أى تحقق من كلمة المرور.
    // شاشة الدخول قد تكون ظلت مفتوحة لفترة (بعد تسجيل خروج، أو بعد إغلاق تلقائى
    // بسبب عدم الاستخدام) بينما غيّر مدير النظام اسم المستخدم/كلمة المرور لهذا
    // الحساب من جهاز آخر فى هذه الأثناء. بدون هذا التحديث كان التحقق يتم مقابل
    // نسخة الحسابات المحمّلة فى ذاكرة المتصفح منذ آخر تحميل للصفحة، فيظل التعديل
    // الجديد غير معروف على هذا الجهاز حتى تُعاد الصفحة فعليًا (F5) لا مجرد
    // تسجيل خروج ثم دخول داخل نفس الجلسة - وهو ما كان يبدو "تعارضًا" فى البيانات.
    // تأكد أولًا من رفع أى تعديلات معلّقة من مستخدم سابق على هذا الجهاز (مثلًا لو
    // أضاف مستخدم بيانات وهو أوفلاين ثم سجّل خروج قبل أن يعود الاتصال) قبل سحب
    // أحدث نسخة من حسابات المستخدمين - وإلا قد تبقى تلك البيانات معلّقة محليًا
    // فقط دون رفع فورى لحين مرور مؤقّت المزامنة الدورى (45 ثانية).
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "جارٍ التحقق..."; }
    try {
      if (STORAGE_MODE === "supabase" && navigator.onLine && !SYNC_PAUSED) {
        await flushPendingSync();
        // إصلاح باق خطير: كان هذا السطر يستبدل DB.staffAccounts بأي نتيجة تأتي من
        // Supabase دون تحقق - فلو رجع الجدول السحابي فارغًا لأي سبب (لم يُرفَع
        // الحساب الافتراضي بعد، أو مشكلة شبكة مؤقتة أعادت مصفوفة فارغة بدل خطأ
        // فعلي)، كان يُمسَح حساب admin المحلي بالكامل قبل حتى التحقق من كلمة
        // المرور، فتفشل كل محاولات الدخول برسالة "بيانات غير صحيحة" رغم صحتها.
        // الآن: تجاهل النتيجة السحابية تمامًا إن كانت فارغة، واعتمد على النسخة
        // المحلية الموجودة (التي تحتوي حساب admin الافتراضي دائمًا على الأقل).
        const freshAccounts = await storeGet("staffAccounts", DB.staffAccounts);
        if (freshAccounts && freshAccounts.length) DB.staffAccounts = freshAccounts;
      }
    } catch (err) { /* تعذّر التحديث الآن - نكمل بالتحقق من أحدث نسخة متاحة محليًا */ }
    const account = (DB.staffAccounts || []).find(a => a.username === username && a.password === password);
    if (!account) { renderLogin("اسم المستخدم أو كلمة المرور غير صحيحة."); return; }
    if (account.status === "موقوف") { renderLogin("هذا الحساب موقوف حاليًا. تواصل مع مدير النظام."); return; }
    account.lastLogin = new Date().toISOString();
    persist("staffAccounts");
    setSession({ id: account.id, username: account.username, displayName: account.displayName, role: account.role });
    logActivity("تسجيل دخول", "login");
    state.page = firstAccessiblePage(); state.editId = null;
    resetIdleTimer();
    route();
  });
}

async function logout() {
  logActivity("تسجيل خروج", "login");
  stopIdleTimer();
  clearSession();
  // أعد تحميل كل البيانات من السحابة عند الخروج (وليس الحسابات فقط) حتى تكون
  // شاشة الدخول - وأى دخول يليها - مبنية على أحدث نسخة متاحة دائمًا، بدل الاعتماد
  // على نسخة الذاكرة القديمة التى حُمِّلت منذ فتح الصفحة لأول مرة. هذا يجعل كل
  // جهاز يتصرف كأنه أعاد تحميل الصفحة فعليًا عند كل تسجيل خروج.
  try { await loadAll(); } catch (e) { /* تعذّر التحديث الآن - نكمل بالبيانات المتاحة محليًا */ }
  renderLogin();
}
// ======================================================================
// الإغلاق التلقائى بعد عدم الاستخدام (Idle Auto-Logout)
// حماية إضافية لبيانات المرضى والخزينة: لو تُرك الجهاز بدون أى حركة (ماوس/لوحة
// مفاتيح/لمس) للمدة المحددة فى الإعدادات (5 دقائق افتراضيًا)، يسجَّل الخروج تلقائيًا.
// المدة قابلة للتحكم من صفحة الإعدادات (متاحة فقط لمن يملك صلاحية "تعديل الإعدادات").
// ======================================================================
let idleTimer = null;
function idleTimeoutMs() {
  const mins = Number(DB.settings && DB.settings.idleTimeoutMinutes);
  return (mins > 0 ? mins : 5) * 60 * 1000;
}
function isIdleTimeoutEnabled() {
  return !DB.settings || DB.settings.idleTimeoutMinutes !== 0; // 0 يعنى مُعطَّل صراحةً
}
function resetIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  if (!currentUser || !isIdleTimeoutEnabled()) return;
  idleTimer = setTimeout(() => {
    if (!currentUser) return;
    logActivity("تسجيل خروج تلقائى (عدم استخدام)", "login");
    clearSession();
    renderLogin("تم تسجيل خروجك تلقائيًا بعد فترة من عدم الاستخدام حفاظًا على أمان البيانات. سجّل الدخول مرة أخرى للمتابعة.");
  }, idleTimeoutMs());
}
function stopIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}
["mousemove", "mousedown", "keydown", "touchstart", "scroll", "click", "wheel"].forEach(evt => {
  document.addEventListener(evt, () => { if (currentUser) resetIdleTimer(); }, { passive: true });
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && currentUser) resetIdleTimer(); });

// ======================================================================
// التشغيل
// ======================================================================
// اشتراك Realtime عام لكل الجداول المهمة بدل مراقبة staff_accounts فقط.
// Realtime تحسين فوري وليس مصدر الحقيقة الوحيد؛ يبقى backgroundRefreshAll كخط دفاع
// احتياطى لأن بعض جداول Supabase قد لا تكون مضافة إلى publication أو قد ينقطع الاتصال.
const REALTIME_TABLES = [
  ...Object.entries(SB_TABLES).filter(([key]) => key !== "auditLog"),
  ["settings", "settings"], ["categories", "settings"], ["specialties", "settings"],
];
let realtimeChannel = null;
let realtimeReconnectTimer = null;
let realtimeSubscriptionGeneration = 0;
const realtimeRefreshInProgress = new Set();

function cleanupRealtimeChannels(reason) {
  realtimeSubscriptionGeneration++;
  if (realtimeReconnectTimer) { clearTimeout(realtimeReconnectTimer); realtimeReconnectTimer = null; }
  const old = realtimeChannel;
  realtimeChannel = null;
  if (old && sbClient) {
    try { sbClient.removeChannel(old); } catch (e) { console.warn("Realtime channel cleanup failed:", reason, e); }
  }
}

async function refreshTableFromRealtime(key) {
  if (realtimeRefreshInProgress.has(key) || !sbClient || STORAGE_MODE !== "supabase" || SYNC_PAUSED || !navigator.onLine) return;
  if (PENDING_WRITES > 0 || isMidEdit() || isUserActivelyTyping()) return;
  const pendingBefore = await getPendingQueueKeys();
  if (pendingBefore.includes(key)) return;
  const generationBefore = TABLE_MUTATION_GENERATION[key] || 0;
  realtimeRefreshInProgress.add(key);
  try {
    const fresh = await storeGet(key, DB[key]);
    // لا نستبدل الذاكرة بنتيجة قديمة إذا بدأ حفظ محلى أثناء طلب الشبكة.
    if (PENDING_WRITES > 0 || isMidEdit() || isUserActivelyTyping()) return;
    if ((TABLE_MUTATION_GENERATION[key] || 0) !== generationBefore) return;
    const pendingAfter = await getPendingQueueKeys();
    if (pendingAfter.includes(key)) return;
    if (fresh !== undefined && JSON.stringify(fresh) !== JSON.stringify(DB[key])) {
      DB[key] = fresh;
      DATA_VERSION++;
      if (key === "staffAccounts" && currentUser) {
        const me = DB.staffAccounts.find(a => a.id === currentUser.id);
        if (!me || me.status === "موقوف") {
          clearSession();
          renderLogin("تم إيقاف هذا الحساب أو حذفه.");
          return;
        }
      }
      if (currentUser && !isMidEdit() && !isUserActivelyTyping()) route();
    }
  } catch (e) {
    console.error("Realtime refresh failed for", key, e);
  } finally {
    realtimeRefreshInProgress.delete(key);
  }
}

function scheduleRealtimeReconnect(generation) {
  if (realtimeReconnectTimer || generation !== realtimeSubscriptionGeneration) return;
  realtimeReconnectTimer = setTimeout(() => {
    realtimeReconnectTimer = null;
    if (generation === realtimeSubscriptionGeneration && STORAGE_MODE === "supabase" && !SYNC_PAUSED && navigator.onLine) {
      subscribeStaffAccountsRealtime();
    }
  }, 5000);
}

function subscribeStaffAccountsRealtime() {
  if (!sbClient || STORAGE_MODE !== "supabase" || SYNC_PAUSED || !navigator.onLine) return;
  if (realtimeChannel) return;
  const generation = ++realtimeSubscriptionGeneration;
  try {
    let channel = sbClient.channel("hospital_data_live");
    for (const [key, table] of REALTIME_TABLES) {
      channel = channel.on("postgres_changes", { event: "*", schema: "public", table }, () => {
        refreshTableFromRealtime(key);
      });
    }
    realtimeChannel = channel;
    channel.subscribe(status => {
      if (generation !== realtimeSubscriptionGeneration) return;
      if (status === "SUBSCRIBED") {
        console.log("Supabase Realtime subscribed:", REALTIME_TABLES.map(([, table]) => table).join(", "));
        return;
      }
      if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        console.warn("Supabase Realtime status:", status);
        if (realtimeChannel === channel) {
          realtimeChannel = null;
          try { sbClient.removeChannel(channel); } catch (e) { /* ignore */ }
        }
        scheduleRealtimeReconnect(generation);
      }
    });
  } catch (e) {
    console.error("Realtime subscribe failed:", e);
    realtimeChannel = null;
    scheduleRealtimeReconnect(generation);
  }
}
async function boot() {
  document.getElementById("content").innerHTML = `<div style="text-align:center; padding:80px; color:var(--muted);">جارٍ تحميل النظام...</div>`;
  try {
    await loadAll();
  } catch (e) {
    console.error("Load error, using defaults:", e);
    DB.doctors = seedDoctors(); DB.employees = seedEmployees(); DB.settings = { openingBalance: 10000 };
    DB.staffAccounts = seedStaffAccounts();
  }
  currentUser = getSession();
  if (!currentUser) { renderLogin(); return; }
  // تأكد أن المستخدم لا يزال حسابًا صالحًا (لم يُحذف)
  const sessionAccount = (DB.staffAccounts || []).find(a => a.id === currentUser.id);
  if (!sessionAccount || sessionAccount.status === "موقوف") { clearSession(); renderLogin(); return; }
  // نفس إصلاح firstAccessiblePage عند تسجيل الدخول: state.page يبدأ دائمًا بقيمة
  // "dashboard" الافتراضية عند كل تحميل جديد للصفحة (JS متغيّر فى الذاكرة، لا يُحفَظ
  // بين إعادة التحميل) - فحتى مستخدم مسجّل دخوله بالفعل من قبل كان يقابل شاشة رفض
  // الوصول بمجرد تحديث الصفحة (F5) لو لم يملك صلاحية "الرئيسية".
  state.page = firstAccessiblePage();
  resetIdleTimer();
  route();
  // إن كانت هناك عمليات معلّقة من جلسة سابقة لم تُرفَع بعد (مثلًا بعد إغلاق
  // المتصفح أثناء انقطاع الاتصال)، حاول رفعها الآن فى الخلفية دون تعطيل الواجهة.
  if (STORAGE_MODE === "supabase" && !SYNC_PAUSED) flushPendingSync();
  if (STORAGE_MODE === "supabase" && navigator.onLine) subscribeStaffAccountsRealtime();
}
boot();

</script>
