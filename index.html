<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("solimedical-theme-v1");
        if (t === "dark" || t === "amoled") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="SoliMedical Hospital — نسخة تجريبية محلية لإدارة المستشفى">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>SoliMedical Hospital | تجربة محلية</title>

  <style id="solimedical-styles">
:root {
  --teal-950: #073c3b;
  --teal-900: #0b5550;
  --teal-700: #0f766e;
  --teal-500: #20a39e;
  --teal-100: #d9f2ef;
  --mint: #edf9f6;
  --ink: #163232;
  --muted: #6c8180;
  --line: #dcebea;
  --surface: #ffffff;
  --page: #f4f8f7;
  --gold: #e5aa43;
  --danger: #c5534d;
  font-family: "Cairo", "Tahoma", sans-serif;
  color: var(--ink);
  background: var(--page);
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; background: var(--page); }
button, input { font: inherit; }
button { cursor: pointer; }

#app { min-height: 100vh; }

.login-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(360px, .9fr);
  background: linear-gradient(135deg, #ecf8f5 0%, #f8fbfa 55%, #e2f2ef 100%);
}
.login-visual {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  padding: clamp(32px, 7vw, 96px);
  color: #fff;
  background:
    radial-gradient(circle at 18% 15%, rgba(76, 213, 193, .35), transparent 28%),
    radial-gradient(circle at 88% 86%, rgba(10, 61, 59, .75), transparent 37%),
    linear-gradient(155deg, var(--teal-700), var(--teal-950));
}
.login-visual::before, .login-visual::after {
  content: ""; position: absolute; border: 1px solid rgba(255,255,255,.15); border-radius: 50%;
}
.login-visual::before { width: 520px; height: 520px; left: -260px; bottom: -180px; }
.login-visual::after { width: 390px; height: 390px; right: -180px; top: -150px; }
.visual-content { position: relative; max-width: 610px; z-index: 1; }
.brand-lockup { display: flex; align-items: center; gap: 14px; margin-bottom: 58px; }
.brand-mark { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 17px; background: #fff; color: var(--teal-700); font-size: 31px; font-weight: 900; box-shadow: 0 12px 32px rgba(0,0,0,.16); }
.brand-name { font-size: 27px; font-weight: 900; letter-spacing: -.8px; }
.brand-sub { display: block; margin-top: 1px; color: rgba(255,255,255,.68); font-size: 12px; font-weight: 600; }
.visual-content h1 { margin: 0 0 20px; font-size: clamp(36px, 5vw, 68px); line-height: 1.12; letter-spacing: -2px; }
.visual-content > p { max-width: 490px; margin: 0; color: rgba(255,255,255,.78); font-size: 17px; line-height: 2; }
.feature-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; margin-top: 42px; max-width: 570px; }
.feature-chip { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.9); font-size: 12px; }
.feature-chip b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 9px; background: rgba(94, 225, 199, .22); color: #77e5cc; }
.login-panel { display: grid; place-items: center; padding: 32px; background: rgba(255,255,255,.76); }
.login-card { width: min(100%, 430px); padding: 42px; border: 1px solid rgba(220,234,235,.9); border-radius: 26px; background: rgba(255,255,255,.93); box-shadow: 0 26px 70px rgba(18, 71, 68, .12); }
.mobile-brand { display: none; }
.login-card h2 { margin: 0 0 8px; color: var(--teal-950); font-size: 27px; }
.login-card .intro { margin: 0 0 28px; color: var(--muted); font-size: 13px; line-height: 1.8; }
.field { margin-bottom: 17px; }
.field label { display: block; margin-bottom: 8px; color: #355452; font-size: 12px; font-weight: 800; }
.input-wrap { position: relative; }
.field input { width: 100%; height: 52px; padding: 0 16px; border: 1px solid var(--line); border-radius: 13px; outline: none; background: #fbfdfc; color: var(--ink); transition: .2s border, .2s box-shadow; }
.field input:focus { border-color: var(--teal-500); box-shadow: 0 0 0 4px rgba(32,163,158,.12); }
.password-toggle { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--teal-700); font-size: 11px; font-weight: 800; }
.login-btn { width: 100%; height: 53px; margin-top: 8px; border: 0; border-radius: 14px; background: linear-gradient(135deg, var(--teal-700), var(--teal-500)); color: #fff; font-weight: 900; box-shadow: 0 10px 22px rgba(15,118,110,.22); transition: .2s transform, .2s box-shadow; }
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(15,118,110,.3); }
.login-btn:disabled { cursor: wait; opacity: .65; transform: none; }
.error-box { display: none; margin: 0 0 14px; padding: 11px 13px; border: 1px solid #f2d1cf; border-radius: 11px; background: #fff4f3; color: var(--danger); font-size: 12px; font-weight: 700; line-height: 1.7; }
.local-note { display: flex; gap: 9px; margin-top: 25px; padding: 12px 13px; border-radius: 12px; background: var(--mint); color: #31706b; font-size: 11px; line-height: 1.7; }
.local-note strong { display: block; margin-bottom: 2px; color: var(--teal-900); }
.login-footer { margin-top: 24px; text-align: center; color: #99aaa9; font-size: 10px; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 258px minmax(0, 1fr); }
.sidebar { display: flex; flex-direction: column; min-height: 100vh; padding: 22px 15px; background: linear-gradient(180deg, var(--teal-950), #0b4b49); color: #eaf8f6; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 5px 11px 28px; border-bottom: 1px solid rgba(255,255,255,.1); }
.side-brand .brand-mark { width: 39px; height: 39px; border-radius: 12px; font-size: 23px; }
.side-brand .brand-name { font-size: 18px; }
.side-brand .brand-sub { font-size: 9px; }
.side-label { margin: 25px 12px 10px; color: rgba(255,255,255,.45); font-size: 10px; font-weight: 800; }
.nav-list { display: grid; gap: 5px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px 13px; border: 0; border-radius: 11px; background: transparent; color: rgba(255,255,255,.68); text-align: right; font-size: 12px; transition: .2s background, .2s color; }
.nav-item:hover, .nav-item.active { background: rgba(108,228,204,.14); color: #fff; }
.nav-icon { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 8px; background: rgba(255,255,255,.09); font-size: 13px; }
.sidebar-bottom { margin-top: auto; padding: 16px 10px 0; border-top: 1px solid rgba(255,255,255,.1); }
.user-mini { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.avatar { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 11px; background: #bce9df; color: var(--teal-950); font-size: 13px; font-weight: 900; }
.user-mini strong { display: block; font-size: 12px; }
.user-mini span { color: rgba(255,255,255,.5); font-size: 10px; }
.logout-btn { width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,.16); border-radius: 10px; background: transparent; color: rgba(255,255,255,.72); font-size: 11px; }
.logout-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.main { min-width: 0; padding: 25px clamp(20px, 4vw, 47px) 44px; }
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 27px; }
.eyebrow { margin-bottom: 5px; color: var(--teal-700); font-size: 11px; font-weight: 900; }
.topbar h2 { margin: 0; color: var(--teal-950); font-size: clamp(23px, 3vw, 31px); }
.topbar p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.status-pill { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border: 1px solid #cde7e2; border-radius: 999px; background: #f0fbf8; color: #2e776e; font-size: 10px; font-weight: 800; white-space: nowrap; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #38b985; box-shadow: 0 0 0 4px rgba(56,185,133,.13); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 25px; }
.stat-card { padding: 18px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); box-shadow: 0 7px 20px rgba(21, 68, 67, .04); }
.stat-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.stat-icon { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; background: var(--mint); color: var(--teal-700); }
.stat-card strong { display: block; margin: 14px 0 3px; color: var(--teal-950); font-size: 24px; }
.stat-card small { color: #7ca19e; font-size: 10px; }
.content-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr); gap: 18px; }
.section-card { padding: 22px; border: 1px solid var(--line); border-radius: 19px; background: var(--surface); }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 19px; }
.section-heading h3 { margin: 0; color: var(--teal-950); font-size: 16px; }
.section-heading span { color: var(--muted); font-size: 10px; }
.module-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.module { min-height: 115px; padding: 15px; border: 1px solid #e3efed; border-radius: 14px; background: linear-gradient(145deg, #fff, #f8fcfb); transition: .2s transform, .2s border; }
.module:hover { transform: translateY(-2px); border-color: #a9d8d1; }
.module-icon { display: grid; place-items: center; width: 32px; height: 32px; margin-bottom: 12px; border-radius: 10px; background: var(--teal-100); color: var(--teal-700); font-size: 15px; }
.module strong { display: block; color: var(--ink); font-size: 12px; }
.module span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.6; }
.appointment-list { display: grid; gap: 11px; }
.appointment { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid #eef4f3; }
.appointment:last-child { border-bottom: 0; }
.time { min-width: 49px; color: var(--teal-700); font-size: 11px; font-weight: 900; }
.person { flex: 1; min-width: 0; }
.person strong { display: block; overflow: hidden; color: var(--ink); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.person span { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
.tag { padding: 4px 7px; border-radius: 7px; background: #fff5df; color: #a56e19; font-size: 9px; font-weight: 800; }
.notice { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: linear-gradient(90deg, #e1f6f1, #f1fbf8); color: #3b706b; font-size: 11px; line-height: 1.8; }
.notice b { color: var(--teal-900); }

.toast { position: fixed; right: 22px; bottom: 22px; z-index: 10; padding: 12px 16px; border-radius: 12px; background: var(--teal-950); color: #fff; font-size: 11px; box-shadow: 0 12px 30px rgba(0,0,0,.2); animation: appear .2s ease; }
@keyframes appear { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@media (max-width: 1000px) {
  .login-shell { grid-template-columns: 1fr; }
  .login-visual { display: none; }
  .login-panel { min-height: 100vh; padding: 22px; }
  .mobile-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .mobile-brand .brand-mark { width: 43px; height: 43px; border-radius: 13px; font-size: 25px; }
  .mobile-brand .brand-name { font-size: 22px; }
}
@media (max-width: 860px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: relative; min-height: auto; padding: 12px 15px; }
  .side-brand { padding: 5px 6px 12px; border-bottom: 0; }
  .side-label, .sidebar-bottom { display: none; }
  .nav-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .nav-item { justify-content: center; padding: 9px 5px; font-size: 10px; }
  .nav-icon { width: 22px; height: 22px; }
  .main { padding: 20px 15px 30px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .content-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .login-card { padding: 28px 21px; border-radius: 21px; }
  .nav-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .nav-item { flex-direction: column; gap: 4px; }
  .module-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .topbar { display: block; }
  .status-pill { display: inline-flex; margin-top: 15px; }
}

/* Multi-department clinic views */
.department-label { margin-top: 23px; }
.department-nav { display: grid; gap: 3px; }
.department-nav-item { display: grid; grid-template-columns: 25px 1fr auto; align-items: center; gap: 9px; width: 100%; padding: 9px 11px; border: 0; border-radius: 10px; background: transparent; color: rgba(255,255,255,.62); text-align: right; font-size: 11px; }
.department-nav-item:hover, .department-nav-item.active { background: rgba(108,228,204,.13); color: #fff; }
.department-nav-item em { min-width: 19px; padding: 2px 4px; border-radius: 5px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.55); font-size: 9px; font-style: normal; text-align: center; }
.department-nav-item.active em { background: rgba(119,229,204,.25); color: #a4f0df; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.section-heading > div p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
.section-count, .week-label { padding: 6px 9px; border-radius: 8px; background: var(--mint); color: var(--teal-700); font-size: 10px; font-weight: 800; white-space: nowrap; }
.department-overview { margin-bottom: 18px; }
.department-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
.department-card { position: relative; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; min-width: 0; padding: 15px 16px; border: 1px solid #e2efed; border-radius: 15px; background: linear-gradient(135deg, #fff, #f7fcfb); color: var(--ink); text-align: right; transition: .2s transform, .2s box-shadow, .2s border; }
.department-card:hover { transform: translateY(-2px); border-color: #9cd3ca; box-shadow: 0 10px 22px rgba(24,91,86,.08); }
.department-icon, .department-hero-icon { display: grid; place-items: center; flex: 0 0 auto; border-radius: 13px; background: var(--teal-100); color: var(--teal-700); font-size: 20px; }
.department-icon { width: 44px; height: 44px; }
.department-main { min-width: 0; }
.department-main strong { display: block; color: var(--teal-950); font-size: 13px; }
.department-main span { display: block; overflow: hidden; margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.5; text-overflow: ellipsis; white-space: nowrap; }
.department-meta { display: grid; grid-template-columns: repeat(2, auto); gap: 2px 8px; margin-left: 14px; color: var(--teal-700); text-align: center; }
.department-meta b { font-size: 13px; }
.department-meta small { color: var(--muted); font-size: 8px; }
.card-arrow { color: #9bb7b4; font-size: 15px; }
.home-lower { margin-top: 18px; }
.text-button, .outline-button { border: 0; background: transparent; color: var(--teal-700); font-size: 10px; font-weight: 800; }
.text-button:hover { color: var(--teal-950); }
.outline-button { padding: 9px 12px; border: 1px solid #abd8d1; border-radius: 9px; }
.department-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; padding: 22px; border: 1px solid #cde9e4; border-radius: 19px; background: linear-gradient(105deg, #e5f8f3, #f8fcfb); }
.department-hero-icon { width: 62px; height: 62px; font-size: 28px; }
.department-hero > div:nth-child(2) { flex: 1; }
.department-hero > div:nth-child(2) > span { color: var(--teal-700); font-size: 10px; font-weight: 800; }
.department-hero h3 { margin: 4px 0; color: var(--teal-950); font-size: 22px; }
.department-hero p { margin: 0; color: var(--muted); font-size: 11px; }
.hero-facts { display: flex; gap: 20px; padding-right: 18px; border-right: 1px solid #cde4df; }
.hero-facts div { min-width: 50px; text-align: center; }
.hero-facts b, .hero-facts span { display: block; }
.hero-facts b { color: var(--teal-950); font-size: 21px; }
.hero-facts span { margin-top: 3px; color: var(--muted); font-size: 9px; }
.doctor-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.doctor-card { min-width: 0; padding: 16px; border: 1px solid #e0eeec; border-radius: 15px; background: #fff; }
.doctor-card-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.doctor-avatar { display: grid; place-items: center; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; background: var(--teal-100); color: var(--teal-700); font-size: 14px; font-weight: 900; }
.doctor-card-top > div:nth-child(2) { min-width: 0; flex: 1; }
.doctor-card-top strong, .doctor-card-top span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doctor-card-top strong { color: var(--teal-950); font-size: 12px; }
.doctor-card-top span { margin-top: 3px; color: var(--muted); font-size: 9px; }
.status-badge { display: inline-block; padding: 4px 7px; border-radius: 6px; font-size: 8px; font-weight: 800; white-space: nowrap; }
.status-badge.success { background: #e3f7ec; color: #25805b; }
.status-badge.warning { background: #fff3db; color: #a87522; }
.status-badge.muted { background: #eef2f2; color: #738281; }
.doctor-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin: 17px 0 13px; padding-top: 13px; border-top: 1px solid #edf4f3; }
.doctor-details > div { min-width: 0; }
.doctor-details .doctor-days { grid-column: 1 / -1; }
.doctor-details small, .doctor-details b { display: block; }
.doctor-details small { margin-bottom: 4px; color: var(--muted); font-size: 8px; }
.doctor-details b { overflow: hidden; color: var(--ink); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.doctor-footer { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid #edf4f3; color: var(--muted); font-size: 9px; }
.doctor-footer b { color: var(--teal-700); }
.schedule-section { margin: 18px 0; }
.table-scroll { width: 100%; overflow-x: auto; }
.schedule-table, .appointment-table { width: 100%; min-width: 610px; border-collapse: collapse; font-size: 10px; }
.schedule-table th, .schedule-table td, .appointment-table th, .appointment-table td { padding: 12px 10px; border-bottom: 1px solid #edf3f2; text-align: right; white-space: nowrap; }
.schedule-table th, .appointment-table th { color: var(--muted); background: #f8fbfa; font-size: 9px; font-weight: 800; }
.schedule-table tr:hover td, .appointment-table tr:hover td { background: #fbfefd; }
.schedule-table .day-cell { color: var(--teal-700); font-weight: 900; }
.appointment-table strong { color: var(--ink); font-size: 10px; }
.appointment-table .time-cell { color: var(--teal-700); font-size: 11px; font-weight: 900; }
.inline-dept { padding: 4px 6px; border-radius: 6px; background: var(--mint); color: var(--teal-700); font-size: 8px; }
.empty-state { padding: 35px; color: var(--muted); text-align: center; font-size: 11px; }
.filter-strip { display: flex; align-items: center; gap: 25px; margin-bottom: 18px; padding: 15px 18px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
.filter-strip > div { display: flex; flex-direction: column; gap: 4px; }
.filter-strip span { color: var(--muted); font-size: 9px; }
.filter-strip b { color: var(--teal-950); font-size: 16px; }
.filter-strip .outline-button { margin-right: auto; }
.report-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.report-card { padding: 16px; border: 1px solid #e4efed; border-radius: 14px; }
.report-card-top { display: flex; align-items: center; gap: 9px; color: var(--ink); font-size: 10px; font-weight: 800; }
.distribution-icon { display: grid; place-items: center; flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; background: var(--teal-100); color: var(--teal-700); }
.distribution-icon.blue { background: #e5f0fb; color: #377db5; }
.distribution-icon.purple { background: #f0eafb; color: #7757aa; }
.distribution-icon.orange { background: #fff0dd; color: #b87929; }
.distribution-icon.cyan { background: #e4f4f7; color: #378a98; }
.report-card > strong { display: block; margin-top: 15px; color: var(--teal-950); font-size: 24px; }
.report-card > small { color: var(--muted); font-size: 9px; }
.report-line { height: 5px; margin: 14px 0 10px; overflow: hidden; border-radius: 99px; background: #edf3f2; }
.report-line i { display: block; height: 100%; border-radius: inherit; background: var(--teal-500); }
.report-card footer { display: flex; justify-content: space-between; color: var(--muted); font-size: 8px; }
.operation-note { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid #edf3f2; }
.operation-note > span { color: var(--teal-500); font-size: 11px; font-weight: 900; }
.operation-note b { color: var(--ink); font-size: 11px; }

@media (max-width: 1100px) { .department-grid, .doctor-grid { grid-template-columns: 1fr; } .report-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

@media (max-width: 560px) { .department-nav { grid-template-columns: repeat(5, minmax(0, 1fr)); } .department-card { grid-template-columns: 38px 1fr; padding: 12px; } .department-icon { width: 38px; height: 38px; } .department-meta, .card-arrow { display: none; } .report-grid { grid-template-columns: 1fr; } .filter-strip { gap: 12px; flex-wrap: wrap; } .filter-strip .outline-button { width: 100%; margin-right: 0; } .department-hero h3 { font-size: 18px; } .schedule-table, .appointment-table { min-width: 560px; } }

/* Users and Permissions */
.users-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
.user-card { padding: 20px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); box-shadow: 0 7px 20px rgba(21,68,67,.04); transition: .2s transform, .2s box-shadow; }
.user-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(21,68,67,.08); }

.user-card-top > div { flex: 1; }

.user-card-top span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
.user-perm-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.perm-chip { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 10px; border: 1px solid #e3efed; border-radius: 10px; background: #fbfefd; color: var(--muted); font-size: 10px; font-weight: 800; cursor: pointer; transition: .15s background, .15s color, .15s border; }
.perm-chip.active { background: var(--teal-100); color: var(--teal-700); border-color: #a9d8d1; }
.perm-chip:hover { border-color: #a9d8d1; }
.perm-dept-label { margin-top: 14px; padding-bottom: 10px; border-bottom: 1px solid #edf4f3; }
.perm-dept-label span { color: var(--teal-900); font-size: 11px; font-weight: 900; }
.user-card-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #edf4f3; }

.user-add-card { display: grid; place-items: center; min-height: 220px; border: 2px dashed #cde4df; border-radius: 17px; background: #f8fcfb; cursor: pointer; transition: .2s border, .2s background; }
.user-add-card:hover { border-color: var(--teal-500); background: #edf9f6; }
.user-add-inner { text-align: center; }
.user-add-icon { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 16px; background: var(--teal-100); color: var(--teal-700); font-size: 26px; }
.user-add-inner b { display: block; color: var(--teal-950); font-size: 13px; }
.user-add-inner span { display: block; margin-top: 6px; color: var(--muted); font-size: 10px; }
@media (max-width: 1100px) { .users-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .users-grid { grid-template-columns: 1fr; } .user-perm-grid { grid-template-columns: 1fr 1fr 1fr; } }

/* Local accounting and doctor settings */
.quick-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: -7px 0 20px; }
.primary-action, .secondary-action { display: flex; align-items: center; gap: 11px; min-width: 0; padding: 14px 16px; border-radius: 14px; text-align: right; }
.primary-action { border: 1px solid #15958c; background: linear-gradient(135deg, var(--teal-700), var(--teal-500)); color: #fff; box-shadow: 0 10px 20px rgba(15,118,110,.14); }
.secondary-action { border: 1px solid var(--line); background: #fff; color: var(--ink); }
.primary-action:hover, .secondary-action:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(21,90,84,.1); }
.primary-action > span, .secondary-action > span { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; font-size: 17px; }
.primary-action > span { background: rgba(255,255,255,.18); }
.secondary-action > span { background: var(--mint); color: var(--teal-700); }
.primary-action b, .secondary-action b, .primary-action small, .secondary-action small { display: block; }
.primary-action b, .secondary-action b { font-size: 11px; }
.primary-action small, .secondary-action small { margin-top: 4px; color: var(--muted); font-size: 9px; }
.primary-action small { color: rgba(255,255,255,.72); }
.primary-mini { padding: 8px 11px; border: 0; border-radius: 9px; background: var(--teal-700); color: #fff; font-size: 10px; font-weight: 800; }
.primary-mini:hover { background: var(--teal-900); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
.form-grid .field { min-width: 0; }
.form-grid select, .form-grid input { width: 100%; height: 45px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: #fbfdfc; color: var(--ink); font-size: 11px; }
.form-grid select:focus, .form-grid input:focus { border-color: var(--teal-500); box-shadow: 0 0 0 4px rgba(32,163,158,.1); }
.field-wide { grid-column: 1 / -1; }
.earning-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; padding: 14px; border: 1px dashed #abd8d1; border-radius: 12px; background: #fbfefd; }
.earning-fields .field { margin-bottom: 0; }
.earning-help { align-self: center; color: var(--muted); font-size: 10px; line-height: 1.8; }
.form-actions { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.form-actions .form-submit { width: auto; min-width: 190px; padding: 0 22px; }
.settings-doctor-list { display: grid; gap: 9px; }
.settings-dept-grid { display: grid; gap: 12px; }
.settings-dept-block .department-card { width: 100%; cursor: pointer; }
.settings-dept-block.open .department-card { border-color: #9cd3ca; box-shadow: 0 8px 18px rgba(24,91,86,.08); }
.settings-dept-doctor-list { margin-top: 10px; padding-right: 4px; }
.settings-doctor-row { display: grid; grid-template-columns: 38px 1fr auto auto; align-items: center; gap: 11px; padding: 12px 13px; border: 1px solid #e4efed; border-radius: 13px; background: #fff; }
.settings-doctor-main { min-width: 0; }
.settings-doctor-main strong, .settings-doctor-main span, .settings-doctor-main small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-doctor-main strong { color: var(--teal-950); font-size: 11px; }
.settings-doctor-main span { margin-top: 3px; color: var(--ink); font-size: 9px; }
.settings-doctor-main small { margin-top: 4px; color: var(--muted); font-size: 8px; }
.settings-doctor-fee { min-width: 170px; text-align: right; }
.settings-doctor-fee b, .settings-doctor-fee span { display: block; }
.settings-doctor-fee b { color: var(--teal-700); font-size: 10px; }
.settings-doctor-fee span { margin-top: 3px; color: var(--muted); font-size: 8px; }
.settings-doctor-row .outline-button { padding: 7px 10px; background: #fff; }
.doctor-footer .small-link { padding: 0; border: 0; background: transparent; color: var(--teal-700); font-size: 9px; font-weight: 800; }
.visit-calculation { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 1px 0 15px; padding: 14px 16px; border-radius: 12px; background: linear-gradient(90deg, #e2f7f2, #f5fbfa); color: var(--teal-700); font-size: 10px; }
.visit-calculation b { color: var(--teal-950); font-size: 12px; }
.rule-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rule-grid > div { padding: 14px; border-radius: 12px; background: var(--mint); }
.rule-grid b, .rule-grid span { display: block; }
.rule-grid b { color: var(--teal-900); font-size: 11px; }
.rule-grid span { margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.6; }
.income-table { width: 100%; min-width: 730px; border-collapse: collapse; font-size: 10px; }
.income-table th, .income-table td { padding: 12px 9px; border-bottom: 1px solid #edf3f2; text-align: right; white-space: nowrap; }
.income-table th { color: var(--muted); background: #f8fbfa; font-size: 9px; }
.income-table td strong { color: var(--teal-950); }
.amount-cell { color: var(--teal-700); font-weight: 900; }
.simple-list { display: grid; gap: 9px; margin-top: 14px; }
.simple-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.simple-row b { color: var(--ink); font-size: 11px; }
.simple-row span { color: var(--muted); font-size: 9px; }
.simple-row-actions { display: flex; align-items: center; gap: 8px; }
.danger-mini { padding: 7px 10px; border: 1px solid #f2d1cf; border-radius: 8px; background: transparent; color: var(--danger); font-size: 10px; font-weight: 800; }
.danger-mini:hover { background: rgba(197,83,77,.12); }
.quick-fee-form { display: flex; align-items: center; gap: 8px; }
.quick-fee-form input { width: 90px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--input-bg); color: var(--ink); font-size: 10px; }

@media (max-width: 1000px) { .quick-actions { grid-template-columns: 1fr; } .settings-doctor-row { grid-template-columns: 38px 1fr auto; } .settings-doctor-fee { grid-column: 2 / 3; min-width: 0; } .settings-doctor-row .outline-button { grid-column: 3 / 4; grid-row: 1 / 3; } }

@media (max-width: 560px) { .settings-doctor-row { grid-template-columns: 34px 1fr; } .settings-doctor-row .outline-button { grid-column: 2; grid-row: auto; width: fit-content; } .settings-doctor-fee { grid-column: 2; } }

/* Patient records */
.section-heading-actions { display: flex; align-items: center; gap: 12px; }
.patient-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) 210px auto; align-items: center; gap: 10px; margin-bottom: 18px; }
.patient-search { display: flex; align-items: center; gap: 9px; height: 45px; padding: 0 13px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
.patient-search > span { color: var(--teal-700); font-size: 17px; }
.patient-search input, .patient-toolbar select { width: 100%; height: 45px; border: 1px solid var(--line); border-radius: 11px; outline: none; background: #fff; color: var(--ink); font: inherit; font-size: 10px; }
.patient-search input { height: 42px; padding: 0 4px; border: 0; }
.patient-search input:focus { box-shadow: none; }
.patient-toolbar select { padding: 0 12px; }
.patient-toolbar select:focus { border-color: var(--teal-500); box-shadow: 0 0 0 4px rgba(32,163,158,.1); }
.patient-workspace { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, .75fr); gap: 18px; align-items: start; }
.patient-list-card { min-width: 0; }
.patient-detail-card { position: sticky; top: 18px; min-height: 360px; }

.patient-table th, .patient-table td { padding: 11px 9px; border-bottom: 1px solid #edf3f2; text-align: right; white-space: nowrap; }

.patient-row { cursor: pointer; transition: background .15s; }

.patient-cell strong { color: var(--teal-950); }
.patient-mini-avatar { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 8px; background: var(--teal-100); color: var(--teal-700); font-size: 11px; font-weight: 900; }
.patient-detail-head { display: flex; align-items: center; gap: 11px; padding-bottom: 16px; border-bottom: 1px solid #eaf2f1; }

.patient-note { margin-top: 14px; padding: 12px; border-radius: 11px; background: var(--mint); }

.patient-detail-actions { display: flex; gap: 8px; margin-top: 15px; }
.patient-detail-actions .primary-mini, .patient-detail-actions .outline-button { flex: 1; }

.patient-detail-empty span { display: grid; place-items: center; width: 58px; height: 58px; margin-bottom: 14px; border-radius: 18px; background: var(--mint); color: var(--teal-700); font-size: 27px; }
.patient-detail-empty b { color: var(--teal-950); font-size: 13px; }

@media (max-width: 1100px) { .patient-workspace { grid-template-columns: 1fr; } .patient-detail-card { position: static; } }
@media (max-width: 700px) { .patient-toolbar { grid-template-columns: 1fr; } .patient-toolbar .primary-mini { width: 100%; } .section-heading-actions { flex-wrap: wrap; gap: 6px; } }

/* ============ Theme system: Light / Dark / AMOLED ============ */
:root {
  --surface-2: #f6faf9;
  --input-bg: #fbfdfc;
  --hover-bg: #eef9f6;
  --pill-bg: #f0fbf8;
  --pill-line: #cde7e2;
  --pill-ink: #2e776e;
}
html { transition: background .2s ease; }
body, .stat-card, .section-card, #app { transition: background .2s ease, color .2s ease, border-color .2s ease; }

[data-theme="dark"] {
  --page: #0c201f; --surface: #11302d; --surface-2: #163935; --input-bg: #0f2926;
  --hover-bg: #1a423c; --line: #244945; --ink: #f2fbf9; --muted: #a9c4c0;
  --mint: #12332f; --teal-100: #163d38; --danger: #ff958b; --gold: #f3c977;
  --pill-bg: #16332f; --pill-line: #2a5b54; --pill-ink: #7fe4d2;
}
[data-theme="amoled"] {
  --page: #000000; --surface: #000000; --surface-2: #0a0f0e; --input-bg: #060a09;
  --hover-bg: #0e1a18; --line: #1c2624; --ink: #ffffff; --muted: #a3b8b5;
  --mint: #060d0c; --teal-100: #0c1e1b; --danger: #ff958b; --gold: #f3c977;
  --pill-bg: #0a1615; --pill-line: #1f3d38; --pill-ink: #7fe4d2;
}

/* theme toggle button */
.theme-toggle { display: flex; align-items: center; gap: 7px; padding: 9px 13px; border: 1px solid var(--pill-line); border-radius: 999px; background: var(--pill-bg); color: var(--pill-ink); font-size: 10px; font-weight: 800; white-space: nowrap; }
.theme-toggle:hover { filter: brightness(1.08); }

/* headings/strong values that relied on a dark brand shade for contrast on white */
:is([data-theme="dark"], [data-theme="amoled"]) .topbar h2,
:is([data-theme="dark"], [data-theme="amoled"]) .stat-card strong,
:is([data-theme="dark"], [data-theme="amoled"]) .section-heading h3,
:is([data-theme="dark"], [data-theme="amoled"]) .department-main strong,
:is([data-theme="dark"], [data-theme="amoled"]) .text-button:hover,
:is([data-theme="dark"], [data-theme="amoled"]) .department-hero h3,
:is([data-theme="dark"], [data-theme="amoled"]) .hero-facts b,
:is([data-theme="dark"], [data-theme="amoled"]) .doctor-card-top strong,
:is([data-theme="dark"], [data-theme="amoled"]) .filter-strip b,
:is([data-theme="dark"], [data-theme="amoled"]) .report-card > strong,
:is([data-theme="dark"], [data-theme="amoled"]) .big-summary strong,
:is([data-theme="dark"], [data-theme="amoled"]) .settings-doctor-main strong,
:is([data-theme="dark"], [data-theme="amoled"]) .visit-calculation b,
:is([data-theme="dark"], [data-theme="amoled"]) .income-table td strong,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-cell strong,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-detail-head h3,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-detail-empty b,
:is([data-theme="dark"], [data-theme="amoled"]) .amount-cell {
  color: var(--ink);
}

/* white / off-white card & control surfaces */
:is([data-theme="dark"], [data-theme="amoled"]) .doctor-card,
:is([data-theme="dark"], [data-theme="amoled"]) .report-card,
:is([data-theme="dark"], [data-theme="amoled"]) .secondary-action,
:is([data-theme="dark"], [data-theme="amoled"]) .filter-strip,
:is([data-theme="dark"], [data-theme="amoled"]) .settings-doctor-row,
:is([data-theme="dark"], [data-theme="amoled"]) .settings-doctor-row .outline-button,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-search,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-search input,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-toolbar select {
  background: var(--surface);
  border-color: var(--line);
}
:is([data-theme="dark"], [data-theme="amoled"]) .field input,
:is([data-theme="dark"], [data-theme="amoled"]) .form-grid select,
:is([data-theme="dark"], [data-theme="amoled"]) .form-grid input,
:is([data-theme="dark"], [data-theme="amoled"]) .earning-fields {
  background: var(--input-bg);
  border-color: var(--line);
  color: var(--ink);
}
:is([data-theme="dark"], [data-theme="amoled"]) .schedule-table th,
:is([data-theme="dark"], [data-theme="amoled"]) .appointment-table th,
:is([data-theme="dark"], [data-theme="amoled"]) .income-table th,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-table th {
  background: var(--surface-2);
  color: var(--muted);
}
:is([data-theme="dark"], [data-theme="amoled"]) .schedule-table th,
:is([data-theme="dark"], [data-theme="amoled"]) .schedule-table td,
:is([data-theme="dark"], [data-theme="amoled"]) .appointment-table th,
:is([data-theme="dark"], [data-theme="amoled"]) .appointment-table td,
:is([data-theme="dark"], [data-theme="amoled"]) .income-table th,
:is([data-theme="dark"], [data-theme="amoled"]) .income-table td,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-table th,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-table td,
:is([data-theme="dark"], [data-theme="amoled"]) .operation-note,
:is([data-theme="dark"], [data-theme="amoled"]) .appointment,
:is([data-theme="dark"], [data-theme="amoled"]) .doctor-footer,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-detail-head,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-info-grid {
  border-color: var(--line);
}
:is([data-theme="dark"], [data-theme="amoled"]) .schedule-table tr:hover td,
:is([data-theme="dark"], [data-theme="amoled"]) .appointment-table tr:hover td,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-row:hover td,
:is([data-theme="dark"], [data-theme="amoled"]) .patient-row.selected td {
  background: var(--hover-bg);
}
:is([data-theme="dark"], [data-theme="amoled"]) .department-card,
:is([data-theme="dark"], [data-theme="amoled"]) .module {
  background: linear-gradient(135deg, var(--surface), var(--surface-2));
  border-color: var(--line);
}
:is([data-theme="dark"], [data-theme="amoled"]) .department-hero {
  background: linear-gradient(105deg, var(--mint), var(--surface-2));
  border-color: var(--line);
}
:is([data-theme="dark"], [data-theme="amoled"]) .hero-facts {
  border-color: var(--line);
}

function escapeHtml(value) { return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); }
function getSession() { try { const raw = localStorage.getItem(SESSION_KEY); const session = raw ? JSON.parse(raw) : null; if (!session || Number(session.expiresAt) <= Date.now()) { localStorage.removeItem(SESSION_KEY); return null; } return session; } catch (_) { return null; } }
function saveSession() { const session = { username: LOCAL_AUTH.username, displayName: LOCAL_AUTH.displayName, role: LOCAL_AUTH.role, issuedAt: Date.now(), expiresAt: Date.now() + 8 * 60 * 60 * 1000 }; localStorage.setItem(SESSION_KEY, JSON.stringify(session)); return session; }
function clearSession() { localStorage.removeItem(SESSION_KEY); }
function loginGuard() { try { const guard = JSON.parse(localStorage.getItem(FAILURES_KEY) || "{}"); if (Number(guard.lockedUntil) > Date.now()) return guard; return { failures: 0, lockedUntil: 0 }; } catch (_) { return { failures: 0, lockedUntil: 0 }; } }
function registerFailure() { const guard = loginGuard(); guard.failures = Number(guard.failures || 0) + 1; if (guard.failures >= MAX_FAILURES) { guard.failures = 0; guard.lockedUntil = Date.now() + LOCK_MS; } localStorage.setItem(FAILURES_KEY, JSON.stringify(guard)); }
function clearFailures() { localStorage.removeItem(FAILURES_KEY); }
function bytesToHex(bytes) { return Array.from(bytes).map((byte) => byte.toString(16).padStart(2, "0")).join(""); }
async function deriveVerifier(password, salt) { if (!window.crypto?.subtle) throw new Error("secure-context-required"); const key = await window.crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]); const bits = await window.crypto.subtle.deriveBits({ name: "PBKDF2", salt: new TextEncoder().encode(salt), iterations: 120000, hash: "SHA-256" }, key, 256); return bytesToHex(new Uint8Array(bits)); }

  document.getElementById("toggle-password").addEventListener("click", () => { const input = document.getElementById("password"); const visible = input.type === "text"; input.type = visible ? "password" : "text"; document.getElementById("toggle-password").textContent = visible ? "إظهار" : "إخفاء"; });

}

function soliLoadData() {
  try {
    const raw = localStorage.getItem(SOLI_DATA_KEY);
    const data = raw ? JSON.parse(raw) : null;
    if (data && Array.isArray(data.doctors) && Array.isArray(data.visits) && Array.isArray(data.income)) {
      let migrated = false;
      if (!Array.isArray(data.patients)) { data.patients = soliDefaultPatients(); migrated = true; }
      if (!Array.isArray(data.specialties)) { data.specialties = soliDefaultSpecialties(); migrated = true; }
      if (!Array.isArray(data.employees)) { data.employees = soliDefaultEmployees(); migrated = true; }
      if (!Array.isArray(data.labTests)) { data.labTests = soliDefaultLabTests(); migrated = true; }
      if (!Array.isArray(data.radiologyTests)) { data.radiologyTests = soliDefaultRadiologyTests(); migrated = true; }
      if (migrated) { try { localStorage.setItem(SOLI_DATA_KEY, JSON.stringify(data)); } catch (_) {} }
      return data;
    }
  } catch (_) { /* use seed */ }
  const data = { doctors: soliDefaultDoctors(), visits: [], income: [], patients: soliDefaultPatients(), specialties: soliDefaultSpecialties(), employees: soliDefaultEmployees(), labTests: soliDefaultLabTests(), radiologyTests: soliDefaultRadiologyTests() };
  try { localStorage.setItem(SOLI_DATA_KEY, JSON.stringify(data)); } catch (_) { /* private mode */ }
  return data;
}

  const data = soliData();
  const catalog = soliClone(DEPARTMENTS);
  Object.keys(catalog).forEach((id) => {
    catalog[id].doctors = data.doctors.filter((doctor) => doctor.departmentId === id).map((doctor) => ({ ...doctor, patients: data.visits.filter((visit) => visit.doctorId === doctor.id && visit.date === soliToday()).length }));
    const localAppointments = data.visits.filter((visit) => visit.departmentId === id && visit.date === soliToday()).map((visit) => [visit.time || "--:--", visit.patientName, visit.visitType, visit.doctorName, "مضاف محليًا"]);
    catalog[id].appointments = [...localAppointments, ...(catalog[id].appointments || [])];
  });
  return catalog;
}
function soliAllDoctors() { return soliData().doctors; }
function soliDepartment(id) { return soliCatalog()[id]; }
function soliAllAppointments() { return soliData().visits.map((visit) => ({ ...visit, department: DEPARTMENTS[visit.departmentId]?.name || visit.departmentId })).sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)); }
function soliFeeDescription(doctor) {
  if (doctor.paymentMode === "percentage") return `${doctor.percentage || 0}% من قيمة الزيارة`;
  if (doctor.paymentMode === "daily") return `أجر يومي ${soliMoney(doctor.dailyWage)}`;
  return `كشف ${soliMoney(doctor.consultationFee)} · متابعة ${soliMoney(doctor.followupFee)}`;
}
function soliCalculateEarning(doctor, visitType, visitAmount) {
  if (!doctor) return 0;
  if (doctor.paymentMode === "percentage") return Number(visitAmount || 0) * Number(doctor.percentage || 0) / 100;
  if (doctor.paymentMode === "daily") return Number(doctor.dailyWage || 0);
  return Number(visitType === "متابعة" ? doctor.followupFee : doctor.consultationFee) || 0;
}

  document.getElementById("soli-doctor-form")?.addEventListener("submit", (event) => { event.preventDefault(); const form = event.currentTarget; const values = Object.fromEntries(new FormData(form).entries()); const data = soliData(); const doctor = { id: values.doctorId || form.dataset.doctorId || soliId("doctor"), ...values, consultationFee: Number(values.consultationFee || 0), followupFee: Number(values.followupFee || 0), percentage: Number(values.percentage || 0), dailyWage: Number(values.dailyWage || 0) }; const index = data.doctors.findIndex((item) => item.id === doctor.id); if (index >= 0) data.doctors[index] = doctor; else data.doctors.push(doctor); soliSaveData(data); soliEditDoctorId = doctor.id; showToast("تم حفظ بطاقة الطبيب ونظام الأجر"); soliRenderPage(); });

  document.getElementById("soli-employee-form")?.addEventListener("submit", (event) => { event.preventDefault(); const values = Object.fromEntries(new FormData(event.currentTarget).entries()); if (!values.name || !values.role) return; const data = soliData(); data.employees.push({ id: soliId("employee"), name: values.name, role: values.role, departmentId: values.departmentId || "", phone: values.phone || "" }); soliSaveData(data); showToast("تم إضافة الموظف"); soliRenderPage(); });
  document.querySelectorAll("[data-soli-delete-employee]").forEach((btn) => btn.addEventListener("click", () => { const data = soliData(); data.employees = data.employees.filter((e) => e.id !== btn.dataset.soliDeleteEmployee); soliSaveData(data); showToast("تم حذف الموظف"); soliRenderPage(); }));
  document.getElementById("soli-labtest-form")?.addEventListener("submit", (event) => { event.preventDefault(); const values = Object.fromEntries(new FormData(event.currentTarget).entries()); if (!values.name) return; const data = soliData(); data.labTests.push({ id: soliId("labtest"), name: values.name, price: Number(values.price || 0) }); soliSaveData(data); showToast("تم إضافة التحليل"); soliRenderPage(); });
  document.querySelectorAll("[data-soli-delete-labtest]").forEach((btn) => btn.addEventListener("click", () => { const data = soliData(); data.labTests = data.labTests.filter((t) => t.id !== btn.dataset.soliDeleteLabtest); soliSaveData(data); showToast("تم حذف التحليل"); soliRenderPage(); }));
  document.getElementById("soli-radiology-form")?.addEventListener("submit", (event) => { event.preventDefault(); const values = Object.fromEntries(new FormData(event.currentTarget).entries()); if (!values.name) return; const data = soliData(); data.radiologyTests.push({ id: soliId("radiology"), name: values.name, price: Number(values.price || 0) }); soliSaveData(data); showToast("تم إضافة فحص الأشعة"); soliRenderPage(); });
  document.querySelectorAll("[data-soli-delete-radiology]").forEach((btn) => btn.addEventListener("click", () => { const data = soliData(); data.radiologyTests = data.radiologyTests.filter((t) => t.id !== btn.dataset.soliDeleteRadiology); soliSaveData(data); showToast("تم حذف فحص الأشعة"); soliRenderPage(); }));
}
function soliRenderPage() { const session = getSession(); if (!session) return renderLogin(); const catalog = soliCatalog(); const active = currentView.type === "department" ? currentView.id : currentView.type === "doctors" ? "settings" : currentView.type; let content = currentView.type === "dashboard" ? soliHome() : currentView.type === "department" ? soliDeptPage(currentView.id) : currentView.type === "settings" ? soliSettingsPage() : currentView.type === "doctors" ? soliSettingsPage() : currentView.type === "system" ? soliSystemPage() : currentView.type === "visits" ? soliVisitPage() : currentView.type === "patients" ? soliPatientsPage() : currentView.type === "income" ? soliIncomePage() : currentView.type === "reports" ? soliReportsPage() : currentView.type === "users" ? soliUsersPage() : soliHome(); app.innerHTML = `<main class="app-shell">${soliSidebar(active)}<section class="main">${content}</section></main>`; soliBindEvents(); }function renderDashboard() { currentView = { type: "dashboard", id: null }; soliEditDoctorId = null; soliRenderPage(); }
window.addEventListener("DOMContentLoaded", () => { if (getSession()) soliRenderPage(); else renderLogin(); });
