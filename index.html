<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#173B4A">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  
<title>نظام إدارة مستشفى لجنة زكاة ميت على التخصصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#173B4A;
    --navy-deep:#102A35;
    --teal:#0F6674;
    --teal-light:#2FA39A;
    --bg:#F6F4EE;
    --card:#FFFFFF;
    --ink:#1D2B2E;
    --muted:#6B7A7D;
    --line:#E7E2D6;
    --border:#E7E2D6;
    --income:#2E7D5B;
    --income-soft:#E4F3EC;
    --expense:#B5482F;
    --expense-soft:#FBEAE4;
    --gold:#C79A3E;
    --input-bg:#FCFBF8;
    --radius:8px;
    --shadow: 0 1px 3px rgba(16,42,53,.06), 0 6px 16px -8px rgba(16,42,53,.22);
    --row-hover: rgba(23,59,74,.045);
  }
  /* الوضع الليلي - يُفعَّل بإضافة data-theme="dark" على عنصر <html>، ويُحفَظ
     الاختيار فى localStorage ليبقى ثابتًا بين الجلسات. الألوان الوظيفية (المدير،
     الشريط الجانبي) قريبة من الأصل لأنها داكنة أصلًا وتناسب الوضعين، بينما
     الخلفيات والنصوص والألوان الفاتحة (وارد/منصرف الخفيفة) استُبدلت بمعادلات
     داكنة مريحة للعين بدل الألوان الباهتة الأصلية غير المناسبة لخلفية داكنة. */
  html[data-theme="dark"]{
    --bg:#0F1A1D;
    --card:#182528;
    --ink:#E8EEEC;
    --muted:#93A5A3;
    --line:#2A3A3D;
    --border:#2A3A3D;
    --income:#4FBF8E;
    --income-soft:#173028;
    --expense:#E2755A;
    --expense-soft:#33201B;
    --gold:#D9B15E;
    --input-bg:#111F22;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --row-hover: rgba(255,255,255,.055);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    font-size:14.5px;
  }
  h1,h2,h3,.display{font-family:'Tajawal',sans-serif;}
  ::selection{background:var(--gold); color:#fff;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:250px; min-width:250px;
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#EAF1EF;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  /* إصلاح: كان الشريط الجانبي بياخد مساحة ثابتة دايمًا حتى على الموبايل (250px من
     شاشة عرضها غالبًا أقل من 400px)، يعني يشيل تقريبًا ثلث الشاشة بشكل دائم. تحت
     880px بيتحول لدرج منزلق (Drawer): مخفي افتراضيًا، ويظهر بزرار ☰ فى الشريط
     العلوي، فوق المحتوى مباشرة، مع خلفية معتمة تقفله لو ضغطت بره. */
  #sidebarOverlay{ display:none; }
  @media (max-width:880px){
    #sidebar{
      position:fixed; right:0; top:0; height:100dvh; width:82vw; max-width:300px;
      z-index:1400; transform:translateX(100%); transition:transform .25s ease;
      box-shadow:-8px 0 30px rgba(0,0,0,.25);
    }
    body.sidebar-open #sidebar{ transform:translateX(0); }
    #sidebarOverlay{
      display:none; position:fixed; inset:0; background:rgba(16,42,53,.5); z-index:1390;
    }
    body.sidebar-open #sidebarOverlay{ display:block; }
    #hamburgerBtn{ display:inline-flex !important; }
    /* إصلاح حرج: overflow-x:hidden على body أو #main (وهما من أسلاف #topbar فى
       شجرة DOM) يكسر خاصية position:sticky الخاصة به فى كثير من المتصفحات - وهو
       بالضبط ما كان يجعل شريط القائمة العلوي (وزرار ☰) يختفي عند التمرير لأسفل
       بدل أن يبقى ثابتًا فى الأعلى. الحل: نقل القيد لـ #content فقط، وهو عنصر
       شقيق لـ #topbar (وليس أحد أسلافه)، فلا يؤثر على تثبيته إطلاقًا مع بقائه
       يمنع أي تمرير أفقي غير مقصود لمحتوى الصفحة نفسه. */
    #content{ overflow-x:hidden; max-width:100vw; }
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand .name{font-family:'Tajawal'; font-weight:900; font-size:17px; line-height:1.3;}
  .brand .sub{font-size:11px; color:#9FB6B9; margin-top:4px;}
  nav{flex:1; padding:14px 10px; overflow-y:auto;}
  .nav-group-label{font-size:10.5px; color:#7FA0A0; margin:16px 10px 6px; letter-spacing:.4px; text-transform:uppercase;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px; cursor:pointer;
    color:#D7E4E2; font-size:13.5px; font-weight:600;
    transition:background .15s, color .15s;
    margin-bottom:2px;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--teal); color:#fff; box-shadow:var(--shadow);}
  .nav-item .ic{width:18px; text-align:center; font-size:15px;}
  .nav-item .badge{
    margin-inline-start:auto; background:var(--expense); color:#fff;
    font-size:10px; font-weight:700; border-radius:20px; padding:1px 7px;
  }
  .sidebar-foot{padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:12px; color:#8FA9A8;}

  /* ---------- Main ---------- */
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #topbar{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:14px 26px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5;
  }
  #topbar .title{font-family:'Tajawal'; font-weight:700; font-size:19px;}
  #topbar .date{font-size:12.5px; color:var(--muted);}
  @media (max-width:880px){
    #topbar{ padding:10px 14px; flex-wrap:wrap; row-gap:8px; }
    #topbar .date{ display:none; }
    #topbar .title{ font-size:16px; }
    #topbar .pill{ display:none; }
    #topbar .btn.sm{ padding:6px 9px; font-size:12px; }
  }
  #content{padding:22px 26px 60px; flex:1;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid; gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
  /* إصلاح تنسيق: على شاشات الموبايل الضيقة، عمودين لبطاقات KPI كانا يخلّوا نص
     العناوين الطويلة (زي "مرتبات الشهر (مدفوع / مستحق)") يتكسّر بشكل غير مقروء -
     نخليها عمودًا واحدًا بعرض كامل بدل كده على الشاشات الضيقة جدًا. */
  @media (max-width:560px){.grid-4, .grid-3, .grid-2{grid-template-columns:1fr; gap:10px;}}

  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow);
  }
  @media (max-width:560px){
    .card{padding:14px; border-width:1.5px;}
    .kpi .value{font-size:21px;}
    .kpi.hero .value{font-size:25px;}
  }
  .kpi .label{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:8px;}
  .kpi .value{font-family:'Tajawal'; font-weight:900; font-size:24px; color:var(--navy);}
  .kpi .value.income{color:var(--income);}
  .kpi .value.expense{color:var(--expense);}
  .kpi .delta{font-size:11.5px; margin-top:6px; color:var(--muted);}
  .kpi.hero{
    background:linear-gradient(135deg,var(--navy) 0%, var(--teal) 130%);
    color:#fff; border:none; position:relative; overflow:hidden;
  }
  .kpi.hero .label{color:#CFE4E1;}
  .kpi.hero .value{color:#fff; font-size:28px;}
  .kpi.hero::after{
    content:''; position:absolute; inset-inline-end:-30px; bottom:-30px; width:140px; height:140px;
    background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%);
  }

  .section-title{font-family:'Tajawal'; font-weight:700; font-size:15.5px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
  .section-title .hint{font-size:11.5px; color:var(--muted); font-weight:500;}

  /* ---------- Forms ---------- */
  .form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr);}}
  /* نموذج تسجيل الزيارة تحديدًا: 3 أعمدة ثابتة فى كل المقاسات (حتى على الهاتف)
     لإعطاء شكل متسق فى 4 صفوف بدل تغيّر عدد الأعمدة حسب عرض الشاشة. */
  .visit-grid-3{grid-template-columns:repeat(3,1fr) !important;}
  @media (max-width:480px){.visit-grid-3{gap:8px;}}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--navy); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:9px;
    font-family:'Cairo'; font-size:13.5px; background:var(--input-bg); color:var(--ink);
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--teal); background:var(--card);
  }
  /* تمييز كل الخانات الإلزامية (required) تلقائيًا فى كل نماذج النظام بلون مميز
     (ذهبى) + علامة نجمية بجانب اسم الحقل، بدل الاعتماد على تخمين المستخدم لأي
     الحقول لازم تُملأ قبل الحفظ. لا حاجة لتعديل كل نموذج يدويًا - يعمل تلقائيًا
     على أي input/select يحمل خاصية required. */
  .field:has(> input:required) label, .field:has(> select:required) label{color:var(--gold);}
  .field:has(> input:required) label::after, .field:has(> select:required) label::after{content:" *"; color:var(--gold); font-weight:800;}
  .field input:required, .field select:required{border-color:var(--gold);}
  .btn{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    border:none; border-radius:10px; padding:9px 18px; font-family:'Cairo'; font-weight:700; font-size:13px;
    background:var(--teal); color:#fff; transition:filter .15s, transform .1s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .btn.danger{background:var(--expense);}
  .btn.gold{background:var(--gold);}
  .btn.sm{padding:5px 11px; font-size:11.5px; border-radius:7px;}

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:right; padding:10px 12px; background:#F0EEE5; color:var(--navy);
    font-weight:700; font-size:12px; white-space:nowrap; border-bottom:1.5px solid var(--line);
  }
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; color:var(--ink);}
  tbody tr:hover{background:var(--row-hover);}
  .pill{display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:700;}
  .pill.paid{background:var(--income-soft); color:var(--income);}
  .pill.partial{background:#FFF3D6; color:#8A6300;}
  .pill.unpaid{background:var(--expense-soft); color:var(--expense);}
  .pill.income{background:var(--income-soft); color:var(--income);}
  .pill.expense{background:var(--expense-soft); color:var(--expense);}
  .pill.type-dental{background:#EFE6F7; color:#6A3FA0;}
  .pill.type-clinic{background:#E3EFF7; color:#2A6DA6;}
  .empty-row td{text-align:center; color:var(--muted); padding:30px; font-size:13px;}

  /* ---------- Misc ---------- */
  .two-col{display:grid; grid-template-columns:1.3fr .9fr; gap:16px;}
  @media (max-width:1000px){.two-col{grid-template-columns:1fr;}}
  .doctor-chip{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px;}
  .doctor-chip .name{font-weight:700; font-size:13px;}
  .doctor-chip .meta{font-size:11px; color:var(--muted);}
  .status-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-inline-end:5px;}
  .status-dot.active{background:var(--income);}
  .status-dot.inactive{background:var(--muted);}
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--navy-deep); color:#fff; padding:11px 22px; border-radius:10px;
    font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .receipt-box{max-width:480px; margin:0 auto; background:#fff; color:#1D2B2E; border:1px solid var(--line); border-radius:16px; padding:26px; box-shadow:var(--shadow);}
  .receipt-box .rline{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
  .receipt-box .rline b{color:var(--navy);}
  @media print{
    #sidebar, #topbar, .no-print{display:none !important;}
    #content{padding:0;}
    body{background:#fff; color:#1D2B2E;}
    /* إصلاح: لو الوضع الليلي مفعّل، النصوص كانت بتتطبع بلون شبه أبيض غير مرئي
       على ورق أبيض - نجبر كل متغيرات الألوان النصية على قيم الوضع النهاري
       الداكنة دايمًا عند الطباعة، بغض النظر عن الوضع الظاهر على الشاشة. */
    html{--ink:#1D2B2E; --muted:#6B7A7D; --line:#E7E2D6; --border:#E7E2D6; --navy:#173B4A;}
  }
</style>
</head>
<body>

<aside id="sidebar"></aside>
<div id="sidebarOverlay"></div>
<div id="main">
  <div id="topbar"></div>
  <div id="content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ======================================================================
// نظام إدارة مستشفى لجنة زكاة ميت على التخصصي - التطبيق الرئيسي
// ======================================================================

const THEME_KEY = "mitAzzoun_theme";
// تُطبَّق فورًا هنا فى أول سطر تنفيذى (قبل أى رسم للواجهة) لتفادي "ومضة" ظهور
// الوضع النهاري لجزء من الثانية قبل التبديل للوضع الليلي المحفوظ سابقًا.
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* ignore */ }
}
(function initTheme() {
  let saved = "light";
  try { saved = localStorage.getItem(THEME_KEY) || "light"; } catch (e) { /* ignore */ }
  applyTheme(saved);
})();

const LISTS = {
  specialties: ["باطنة","جلدية","نساء وتوليد","عظام","أنف وأذن","قلب","أطفال","تخاطب","تغذية علاجية","مخ وأعصاب","جراحة عامة","علاج طبيعى","صدر","نفسية","أسنان"],
  incomeCats: ["كشف","تحاليل","أشعة","أسنان","عمليات","تبرعات","اشتراكات","أخرى"],
  expenseCats: ["مرتبات","مشتريات","صيانة","خدمات","نظافة","كهرباء","مياه","مستلزمات طبية","أخرى"],
  payMethods: ["نقدي","تحويل بنكي","فودافون كاش","إنستا باي","أخرى"],
  examTypes: ["كشف","متابعة","استشارة","جلسة"],
  payStatus: ["تم","جزئي","مؤجل"],
};

const DB = {
  doctors: [], employees: [], visitsClinic: [], visitsDental: [], visitsOperations: [], visitsLabs: [], visitsRadiology: [],
  income: [], expense: [], payroll: [], settings: { openingBalance: 0 },
  staffAccounts: [], categories: null, specialties: null, auditLog: [],
  labExpenses: [],
};

// تصنيفات الوارد والمنصرف - قابلة للإدارة بالكامل (إضافة/تعديل/حذف/ترتيب)
function seedCategories() {
  return {
    income: ["كشف","تحاليل","أشعة","أسنان","عمليات","تبرعات","أخرى"].map((name, i) => ({ id: uid(), name, order: i })),
    expense: ["مرتبات","مشتريات","صيانة","خدمات","نظافة","كهرباء","مياه","مستلزمات طبية","أخرى"].map((name, i) => ({ id: uid(), name, order: i })),
  };
}
function sortedCats(kind) {
  const list = (DB.categories && DB.categories[kind]) ? DB.categories[kind] : [];
  return [...list].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}
function catNames(kind) { return sortedCats(kind).map(c => c.name); }
function isCatUsed(kind, name) {
  const list = kind === "income" ? DB.income : DB.expense;
  return list.some(x => x.category === name);
}

// تخصصات الأطباء - قابلة للإدارة بالكامل (إضافة/حذف) وتُحدَّث فورًا فى كل النظام
function seedSpecialties() {
  return LISTS.specialties.map((name, i) => ({ id: uid(), name, order: i }));
}
function sortedSpecs() {
  const list = DB.specialties || [];
  return [...list].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}
function specNames() { return sortedSpecs().map(s => s.name); }
function isSpecUsed(name) { return DB.doctors.some(d => d.specialty === name); }

// ======================================================================
// نظام الصلاحيات التفصيلية لكل مستخدم
// ======================================================================
const PERMISSION_MODULES = [
  { key: "dashboard", label: "الرئيسية", actions: [
    { key: "view", label: "عرض" },
  ]},
  { key: "doctors", label: "إدارة الأطباء", actions: [
    { key: "view", label: "عرض" }, { key: "add", label: "إضافة" }, { key: "edit", label: "تعديل" }, { key: "delete", label: "حذف" },
  ]},
  { key: "employees", label: "إدارة الموظفين", actions: [
    { key: "view", label: "عرض" }, { key: "add", label: "إضافة" }, { key: "edit", label: "تعديل" }, { key: "delete", label: "حذف" },
  ]},
  { key: "clinic", label: "إدارة العيادات", actions: [
    { key: "view", label: "عرض" }, { key: "add", label: "إضافة زيارة" }, { key: "edit", label: "تعديل زيارة" }, { key: "delete", label: "حذف زيارة" },
  ]},
  { key: "dental", label: "إدارة الأسنان", actions: [
    { key: "view", label: "عرض" }, { key: "add", label: "إضافة حالة" }, { key: "edit", label: "تعديل حالة" }, { key: "delete", label: "حذف حالة" },
  ]},
  { key: "operations", label: "إدارة العمليات", actions: [
    { key: "view", label: "عرض" }, { key: "add", label: "إضافة عملية" }, { key: "edit", label: "تعديل عملية" }, { key: "delete", label: "حذف عملية" },
  ]},
  { key: "labs", label: "إدارة التحاليل", actions: [
    { key: "view", label: "عرض" }, { key: "add", label: "إضافة تحليل" }, { key: "edit", label: "تعديل تحليل" }, { key: "delete", label: "حذف تحليل" },

let STORAGE_OK = true;

const APP_PREFIX = "mitali_zakat_hospital_";
let STORAGE_MODE = "memory"; // "cloud" | "local" | "memory" | "supabase"
const MEMORY_STORE = {};

// ======================================================================
// طبقة العمل بدون إنترنت (Local-First) — IndexedDB + طابور مزامنة معلّق
// ======================================================================
// المبدأ: القاعدة المحلية (IndexedDB، وبديلها localStorage عند تعذّره) هى
// دائمًا المصدر الفوري لكل قراءة وكتابة. عندما يكون وضع التخزين "supabase"
// يُكتب كل تغيير محليًا أولًا (فورى، بدون انتظار الشبكة)، ثم يُرفَع للسحابة
// فى الخلفية إن توفّر الاتصال، وإلا يُسجَّل اسم الجدول فى طابور معلّق داخل
// IndexedDB (ينجو من إغلاق المتصفح) ليُرفَع لاحقًا تلقائيًا عند عودة الاتصال.
const IDB_NAME = APP_PREFIX + "idb";
const IDB_VERSION = 2;
const IDB_STORE_DATA = "tables";     // نسخة محلية كاملة من كل جدول (key = اسم الجدول)
const IDB_STORE_QUEUE = "syncQueue"; // أسماء الجداول التي تحتوي تغييرات لم تُرفَع بعد
const IDB_STORE_CONFLICTS = "conflicts"; // تعارضات بيانات بانتظار قرار المدير (مرحلة ج)
let idbDB = null;
let IDB_OK = false;

function openIDB() {
  return new Promise((resolve) => {
    if (!window.indexedDB) { resolve(null); return; }
    try {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE_DATA)) db.createObjectStore(IDB_STORE_DATA);
        if (!db.objectStoreNames.contains(IDB_STORE_QUEUE)) db.createObjectStore(IDB_STORE_QUEUE);
        if (!db.objectStoreNames.contains(IDB_STORE_CONFLICTS)) db.createObjectStore(IDB_STORE_CONFLICTS);
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
async function initIDB() {
  if (idbDB || IDB_OK) return; // لا داعى لإعادة الفتح إن كانت جاهزة بالفعل
  idbDB = await openIDB();
  IDB_OK = !!idbDB;
}
function idbRequest(storeName, mode, fn) {
  return new Promise((resolve) => {
    if (!idbDB) { resolve(undefined); return; }
    try {
      const store = idbDB.transaction(storeName, mode).objectStore(storeName);
      const req = fn(store);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(undefined);
    } catch (e) { resolve(undefined); }
  });
}
const idbGet = (store, key) => idbRequest(store, "readonly", s => s.get(key));
const idbSet = (store, key, value) => idbRequest(store, "readwrite", s => s.put(value, key));
const idbDeleteKey = (store, key) => idbRequest(store, "readwrite", s => s.delete(key));
const idbGetAllKeys = (store) => idbRequest(store, "readonly", s => s.getAllKeys());

// نسخة احتياطية محليًا (localStorage) لأي جهاز لا يدعم IndexedDB
function cacheLocallySync(key, value) {
  try { localStorage.setItem(APP_PREFIX + "cache_" + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
}
async function cacheLocally(key, value) {
  if (IDB_OK) { await idbSet(IDB_STORE_DATA, key, value); return; }
  cacheLocallySync(key, value);
}
async function readLocalCache(key, fallback) {
  if (IDB_OK) {
    const v = await idbGet(IDB_STORE_DATA, key);
    return v !== undefined ? v : fallback;
  }
  try {
    const v = localStorage.getItem(APP_PREFIX + "cache_" + key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) { return fallback; }
}
async function queueTableForSync(key) {
  if (IDB_OK) { await idbSet(IDB_STORE_QUEUE, key, { table: key, queuedAt: nowISO() }); return; }
  try {
    const raw = localStorage.getItem(APP_PREFIX + "pendingQueue");
    const list = raw ? JSON.parse(raw) : [];
    if (!list.includes(key)) list.push(key);
    localStorage.setItem(APP_PREFIX + "pendingQueue", JSON.stringify(list));
  } catch (e) { /* ignore */ }
}
async function unqueueTable(key) {
  if (IDB_OK) { await idbDeleteKey(IDB_STORE_QUEUE, key); return; }
  try {
    const raw = localStorage.getItem(APP_PREFIX + "pendingQueue");
    const list = raw ? JSON.parse(raw).filter(k => k !== key) : [];
    localStorage.setItem(APP_PREFIX + "pendingQueue", JSON.stringify(list));
  } catch (e) { /* ignore */ }
}
async function getPendingQueueKeys() {
  if (IDB_OK) return (await idbGetAllKeys(IDB_STORE_QUEUE)) || [];
  try {
    const raw = localStorage.getItem(APP_PREFIX + "pendingQueue");
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

// "خط الأساس" (Sync Baseline): آخر نسخة من كل جدول كانت معروفة أنها متطابقة
// بين المحلي والسحابي. يُستخدم فقط لمعرفة: (1) هل تغيّر سجل معيّن محليًا فعلًا
// منذ آخر مزامنة (لتفادى وسم كل السجلات بطابع زمنى جديد دون داعٍ)، و(2) هل
// حذف سجل من المصفوفة المحلية هو حذف مقصود أم مجرد سجل لم يصل بعد من جهاز آخر.
async function readSyncBaseline(key) { return await readLocalCache(key + "__base", []); }
async function writeSyncBaseline(key, value) { await cacheLocally(key + "__base", value); }

function stripUpdatedAt(o) { const c = Object.assign({}, o); delete c.updatedAt; return c; }
function recordsEqual(a, b) {
  if (!a || !b) return false;
  return JSON.stringify(stripUpdatedAt(a)) === JSON.stringify(stripUpdatedAt(b));
}

// تعارضات بانتظار مراجعة يدوية من المدير (تُستخدم فقط إذا كان خيار
// "مراجعة التعارضات يدويًا" مُفعّلًا فى الإعدادات)
async function stashConflicts(conflicts) {
  for (const cft of conflicts) {
    const ck = cft.table + ":" + cft.id;
    if (IDB_OK) { await idbSet(IDB_STORE_CONFLICTS, ck, cft); continue; }
    try {
      const raw = localStorage.getItem(APP_PREFIX + "conflicts");
      const map = raw ? JSON.parse(raw) : {};
      map[ck] = cft;
      localStorage.setItem(APP_PREFIX + "conflicts", JSON.stringify(map));
    } catch (e) { /* ignore */ }
  }
}
async function getAllConflicts() {
  if (IDB_OK) {
    const keys = await idbGetAllKeys(IDB_STORE_CONFLICTS);
    const list = [];
    for (const k of (keys || [])) { const v = await idbGet(IDB_STORE_CONFLICTS, k); if (v) list.push(v); }
    return list;
  }
  try {
    const raw = localStorage.getItem(APP_PREFIX + "conflicts");
    return raw ? Object.values(JSON.parse(raw)) : [];
  } catch (e) { return []; }
}
async function removeConflict(table, id) {
  const ck = table + ":" + id;
  if (IDB_OK) { await idbDeleteKey(IDB_STORE_CONFLICTS, ck); return; }
  try {
    const raw = localStorage.getItem(APP_PREFIX + "conflicts");
    const map = raw ? JSON.parse(raw) : {};
    delete map[ck];
    localStorage.setItem(APP_PREFIX + "conflicts", JSON.stringify(map));
  } catch (e) { /* ignore */ }
}
// المدير يختار الفائز فى تعارض بيانات: "local" (الجهاز الحالى) أو "remote" (السحابة)
async function resolveConflict(table, id, winner) {
  const conflicts = await getAllConflicts();
  const cft = conflicts.find(c => c.table === table && c.id === id);
  if (!cft) return;
  const chosen = Object.assign({}, winner === "local" ? cft.local : cft.remote);
  chosen.updatedAt = nowISO(); // طابع زمنى جديد كى يفوز فى أى مقارنة قادمة
  const arr = DB[table];
  if (Array.isArray(arr)) {
    const idx = arr.findIndex(r => r.id === id);
    if (idx > -1) arr[idx] = chosen; else arr.push(chosen);
  }
  await removeConflict(table, id);
  logActivity("حل تعارض بيانات (" + (winner === "local" ? "اعتماد النسخة المحلية" : "اعتماد النسخة السحابية") + ")", "settings");
  persist(table);
}

// "العمل محليًا فقط": يوقف المزامنة التلقائية مؤقتًا دون قطع بيانات اتصال Supabase المحفوظة
const SYNC_PAUSE_FLAG = APP_PREFIX + "sync_paused";
let SYNC_PAUSED = false;
try { SYNC_PAUSED = localStorage.getItem(SYNC_PAUSE_FLAG) === "1"; } catch (e) { /* ignore */ }
let SYNC_IN_PROGRESS = false;
// إصلاح: كان سبب فشل رفع كل جدول معلّق يُطبَع فى الـ console فقط ولا يظهر
// للمستخدم فى أى مكان بالواجهة - على الموبايل تحديدًا لا توجد وسيلة سهلة لفتح
// الـ console، فكان الفشل يبدو "صامتًا": المؤشر يستمر يقول "يعمل محليًا الآن"
// بلا أى تفسير. الآن يُحفَظ آخر خطأ حقيقى لكل جدول هنا ليُعرَض فى مؤشر التخزين
// وفى نتيجة "مزامنة الآن" بدل رسالة عامة واحدة لا تفيد فى التشخيص.
let SYNC_LAST_ERRORS = {};

// يرفع كل الجداول المعلّقة فى الطابور إلى Supabase بالترتيب، بدون تجميد الواجهة.
// يُستخدم هذا فى الخلفية عند عودة الاتصال، وأيضًا يدويًا عبر زر "مزامنة الآن".
// إصلاح: إعادة المحاولة كانت بفاصل زمني ثابت (45 ثانية) دائمًا، حتى مع فشل
// متكرر (مثلًا انقطاع كامل أو خطأ فى الخادم يستمر لدقائق) - يعني محاولات مستمرة
// بلا فائدة تستهلك طاقة الجهاز والشبكة. الآن يتصاعد وقت الانتظار مع كل فشل
// متتالٍ (45 ثانية ← 90 ← 180 ...) بحد أقصى 10 دقائق، ويعود فورًا لـ45 ثانية
// بمجرد نجاح أي محاولة.
let SYNC_FAIL_STREAK = 0;
let SYNC_NEXT_RETRY_AT = 0;
async function flushPendingSync() {
  if (SYNC_IN_PROGRESS || STORAGE_MODE !== "supabase" || !navigator.onLine || SYNC_PAUSED) return;
  if (Date.now() < SYNC_NEXT_RETRY_AT) return;
  const pending = await getPendingQueueKeys();
  if (!pending.length) { SYNC_FAIL_STREAK = 0; return; }
  SYNC_IN_PROGRESS = true;
  let anyFailure = false;
  try {
    for (const key of pending) {
      try {
        const value = await readLocalCache(key, undefined);
        if (value === undefined) { await unqueueTable(key); delete SYNC_LAST_ERRORS[key]; continue; }
        // إصلاح جوهري (سباق بين المزامنة الدورية وحفظ المستخدم الفورى): كان هذا
        // المسار ينادي pushTableSmart/sbSave* مباشرة، بمعزل تمامًا عن طابور
        // storeSet (STORE_SET_QUEUES) المستخدَم عند حفظ المستخدم مباشرة لنفس
        // الجدول. لو حصل الاثنان معًا على نفس الجدول (تعديل معلّق من قبل + حفظ
        // جديد فى نفس اللحظة تقريبًا)، كانا يتسابقان فى قراءة/كتابة نفس السجلات
        // السحابية وخط الأساس (baseline)، وقد يكتب أحدهما فوق نتيجة الآخر بصمت
        // دون أى تحذير. الحل: تمرير هذا المسار أيضًا عبر storeSet() نفسه، فيصبح
        // كل رفع لنفس الجدول (سواء فورى من المستخدم أو إعادة محاولة تلقائية هنا)
        // منضبطًا بنفس القفل التسلسلى الموحّد لكل جدول، فلا يحدث تسابق بينهما
        // أبدًا مهما تقاربت لحظة التنفيذ. storeSet نفسها تتكفّل داخليًا بالحفظ
        // المحلى وخط الأساس والرفع السحابى (بنفس المنطق الذى كان هنا سابقًا).
        await storeSet(key, value);
        delete SYNC_LAST_ERRORS[key]; // نجح الرفع هذه المرة - امسح أى خطأ سابق مسجَّل لهذا الجدول
      } catch (e) {
        console.error("Sync push failed for", key, e);
        SYNC_LAST_ERRORS[key] = (e && (e.message || e.details || e.hint)) || String(e);
        anyFailure = true;
        // اترك الجدول فى الطابور لإعادة المحاولة عند الفرصة القادمة
      }
    }
  } finally {
    SYNC_IN_PROGRESS = false;
    if (anyFailure) {
      SYNC_FAIL_STREAK++;
      const delay = Math.min(45000 * Math.pow(2, SYNC_FAIL_STREAK - 1), 600000); // سقف 10 دقائق
      SYNC_NEXT_RETRY_AT = Date.now() + delay;
    } else {
      SYNC_FAIL_STREAK = 0;
      SYNC_NEXT_RETRY_AT = 0;
    }
    renderStorageIndicator();
  }
}

async function detectStorageMode() {
  await initIDB();
  let disconnected = false;
  try { disconnected = localStorage.getItem(SB_DISCONNECT_FLAG) === "1"; } catch (e) { /* ignore */ }
  if (!disconnected) {
    // إصلاح جوهري: لو الجهاز غير متصل بالإنترنت أصلًا وقت فتح النظام (مش انقطاع
    // أثناء الاستخدام، لكن فتح فعلى بدون شبكة)، كان الكود القديم يسقط لوضع "local"
    // - وهو تخزين منفصل تمامًا فى localStorage لا علاقة له بكاش IndexedDB الذى
    // يستخدمه وضع supabase وطابور المزامنة. يعنى: أى إضافة أو تعديل يتم أثناء
    // انقطاع الاتصال كان يُكتب فى "جزيرة" تخزين معزولة؛ وبمجرد عودة الاتصال
    // (عادة فى جلسة/فتح تالٍ للصفحة) يتصل النظام فعليًا بـ Supabase من جديد
    // ويعرض بيانات IndexedDB/السحابة المحدَّثة - فتبدو تعديلات وضع عدم الاتصال
    // وكأنها اختفت تمامًا أو استُبدلت ببيانات مختلفة (هى فى الحقيقة لم تُفقَد، لكنها
    // محبوسة فى localStorage بلا أى طريق للرفع لأن وضع "local" لا يستخدم طابور
    // المزامنة إطلاقًا). نفس السبب وراء ظهور كلمة مرور قديمة جدًا (محفوظة من أول
    // مرة فُتح فيها النظام قبل أن يوجد حتى جدول staff_accounts) عند الدخول
    // بدون إنترنت. الحل: طالما توجد بيانات اتصال صالحة ولم يقطع المستخدم الاتصال
    // يدويًا، ابقَ دائمًا فى وضع supabase (وهو Local-First الصحيح فعليًا: يعمل
    // بكامل كفاءته من كاش IndexedDB ويُزامن الفروقات تلقائيًا عند عودة الاتصال)،
    // بدل اختبار الشبكة أصلًا وأنت تعلم مسبقًا أنك offline.
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      if (ensureSbClient()) { STORAGE_MODE = "supabase"; SB_LAST_CONNECT_ERROR = "offline"; return; }
    }
    const sbOk = await tryInitSupabase();
    if (sbOk) { STORAGE_MODE = "supabase"; return; }
  }
  try {
    if (window.storage && typeof window.storage.get === "function") {
      await window.storage.get("__probe__", false);
      STORAGE_MODE = "cloud";
      return;
    }
  } catch (e) { /* fall through */ }
  try {
    localStorage.setItem(APP_PREFIX + "__probe__", "1");
    localStorage.removeItem(APP_PREFIX + "__probe__");
    STORAGE_MODE = "local";
  } catch (e) {
    STORAGE_MODE = "memory";
  }
}


async function storeGet(key, fallback) {
  try {
    if (STORAGE_MODE === "supabase") {
      // إصلاح مشكلة "فقدان تعديلات وضع عدم الاتصال بعد تسجيل الدخول من جديد":
      // لو كان هذا الجدول بالذات لا يزال بداخل طابور المزامنة المعلّق (تعديل تم
      // محليًا وقت انقطاع الاتصال ولم يُرفَع للسحابة بعد)، يجب رفعه أولًا قبل أى

    } else {

    }

// الإدخال من نوع number كانت تُعرض بأرقام عربية-هندية تلقائيًا على الأجهزة التي

document.addEventListener("input", e => {

    let normalized = toEnglishDigits(el.value);
    // اسمح بالأرقام ونقطة عشرية واحدة فقط (نفس قيود type="number" الأصلية) -
    // يمنع كتابة حروف أو رموز عن طريق الخطأ الآن بعد التحويل لحقل نصي عادي.

// PRNG بذرة ثابتة (mulberry32) بدلًا من Math.random() حتى تكون نفس البيانات
// التجريبية قابلة لإعادة التوليد بشكل ثابت فى كل مرة يُفتح فيها النظام لأول مرة.
function _mulberry32(seed) {

    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

function safeStringify(v) {
  if (v === undefined || v === null) return "";
  try {
    const s = typeof v === "string" ? v : JSON.stringify(v);

}

// إصلاح محاسبي جوهري: النظام كان يفترض أن كل طبيب يُحاسَب بنسبة مئوية موحّدة من
// كل تحصيل، بينما الواقع فى قسم العيادات (بخلاف الأسنان) هو: كل طبيب له مبلغ
// ثابت بالجنيه (مش نسبة) لكل من الكشف والمتابعة، والمجمع يأخذ نصيبه الثابت أولًا
// (حتى لو حصل خصم للمريض) والباقى للطبيب. كما ظهر نوع ثالث: أطباء "أجر يومي
// ثابت" لا يرتبط دخلهم بعدد المرضى إطلاقًا (يُصرف لهم من صفحة المرتبات منفصلًا)
// - فى هذه الحالة كل تحصيل الزيارات يذهب بالكامل لصالح المجمع.
// الأسنان تبقى كما كانت تمامًا (نسبة مئوية) لأن الطلب كان تعديل حسابات العيادات
// فقط دون المساس بالأسنان.
// ملحوظة تاريخية مهمة: نصيب المجمع الثابت لكل زيارة عيادات (fixed_visit) يُقرأ
// أولًا من "لقطة" محفوظة على الزيارة نفسها وقت تسجيلها (clinicFeeSnapshot) بدل
// إعدادات الطبيب الحالية - حتى لو غُيِّر سعر الطبيب لاحقًا، تبقى تقارير الشهور
// الماضية صحيحة بالسعر الذى كان ساريًا وقتها فعلًا، ولا تُعاد حسابتها بأثر رجعى.
// إصلاح محاسبي (بناءً على طلب صريح): كانت زيارات "متابعة" تُستبعد بالكامل (صفر)
// من حساب نصيب الطبيب/المجمع لأطباء نظام "النسبة المئوية" (الأسنان عادة)، على
// اعتبار أنها مراجعة مجانية. هذا الاستبعاد أُلغي تمامًا الآن: أي زيارة "متابعة"
// تُحسب بنفس نسبة الطبيب/المجمع مثل "كشف" تمامًا (فى computeShare وفى شاشة
// تسوية حساب الأطباء)، لأنها قد تحمل مبالغ علاج حقيقية مدفوعة.
// دالة مساعدة عامة لمعرفة نوع احتساب الطبيب (نسبة أم مبلغ ثابت).
function isPercentFeeMode(doctorId) {
  const d = dInfo(doctorId);
  if (!d) return true;
  return (d.type === "أسنان" ? "percent" : (d.feeMode || "fixed_visit")) === "percent";
}
function computeShare(visit) {
  const d = dInfo(visit.doctorId);
  if (!d) return { doc: 0, clinic: 0 };
  const paid = Number(visit.paid) || 0;
  const mode = d.type === "أسنان" ? "percent" : (d.feeMode || "fixed_visit");
  if (mode === "fixed_daily") return { doc: 0, clinic: paid };
  if (mode === "fixed_visit") {
    const hasSnapshot = visit.clinicFeeSnapshot !== undefined && visit.clinicFeeSnapshot !== null;
    const clinicFee = hasSnapshot ? Number(visit.clinicFeeSnapshot)
      : (visit.examType === "متابعة" ? Number(d.followupClinicFee) || 0 : Number(d.checkupClinicFee) || 0);
    const clinicShare = Math.min(Math.max(clinicFee, 0), paid);
    return { doc: paid - clinicShare, clinic: clinicShare };
  }
  // percent (الأسنان دايمًا، أو أى طبيب عيادات مازال يستخدم النظام القديم بالنسبة)
  // ملحوظة: زيارات "متابعة" كانت تُستبعد بالكامل من حساب النسبة (تُعتبر مجانية)،
  // لكن بناءً على طلب صريح تم إلغاء هذا الاستبعاد - أى زيارة "متابعة" الآن تُحسب
  // بنفس نسبة الطبيب/المجمع تمامًا مثل "كشف"، لأنها قد تحمل مبالغ حقيقية مدفوعة.
  return { doc: paid * (Number(d.docPct) || 0), clinic: paid * (Number(d.clinicPct) || 0) };
}
// حصة الطبيب/المجمع من قيد وارد "إجمالي يومي" (بديل تسجيل كل زيارة على حدة) -
// يُستخدم لما يُختار طبيب مباشرة فى نموذج تسجيل الوارد بدل تسجيل كل مريض فرديًا.
// إصلاح محاسبي: أصبح بإمكان المستخدم إدخال حصة الطبيب وحصة المجمع يدويًا لكل
// قيد من هذا النوع (بدل التخمين التلقائي غير الدقيق لأطباء "مبلغ ثابت لكل
// زيارة") - فهذه القيم المحفوظة (rec.docShare/rec.clinicShare) هى المصدر الأول
// دومًا إن وُجدت. القيود القديمة (المسجَّلة قبل إضافة هذه الميزة) بلا هذه القيم
// تتساقط على الحساب الاحتياطى التلقائى القديم كما كان (نسبة، أو الكل للمجمع
// لأطباء المبلغ الثابت/الأجر اليومي) حفاظًا على التوافق.
function incomeDoctorShare(rec) {
  if (!rec || !rec.doctorId) return { doc: 0, clinic: 0 };
  if (rec.docShare !== undefined && rec.docShare !== null && rec.clinicShare !== undefined && rec.clinicShare !== null) {
    return { doc: Number(rec.docShare) || 0, clinic: Number(rec.clinicShare) || 0 };
  }
  const d = dInfo(rec.doctorId);
  if (!d) return { doc: 0, clinic: 0 };
  const amt = Number(rec.amount) || 0;
  const mode = d.type === "أسنان" ? "percent" : (d.feeMode || "fixed_visit");
  if (mode === "fixed_visit" || mode === "fixed_daily") return { doc: 0, clinic: amt };
  return { doc: amt * (d.docPct || 0), clinic: amt * (d.clinicPct || 0) };
}
function visitRemaining(v) { return (Number(v.total) || 0) - (Number(v.paid) || 0); }

function allVisits() {
  return [
    ...DB.visitsClinic.map(v => ({ ...v, kind: "عيادات" })),
    ...DB.visitsDental.map(v => ({ ...v, kind: "أسنان" })),

// حساب الإيرادات حسب فترة مختارة (اليوم/الأسبوع/الشهر/السنة) لقائمة لوحة القيادة المنسدلة
const PERIOD_LABELS = { today: "اليوم", week: "هذا الأسبوع", month: "هذا الشهر", year: "هذه السنة" };
function startOfWeekISO() {
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay());
  return localISO(start);
}
function periodRevenue(period) {
  const visits = allVisits();
  // قيود الوارد المرتبطة بطبيب (إجمالي يومي بديل) تُحتسَب هنا أيضًا حتى لا يقل
  // الإجمالي المعروض عن الحقيقة لو استُخدمت طريقة "التحصيل الإجمالي" بدل تسجيل
  // كل مريض على حدة.
  const lumpIncome = DB.income.filter(r => r.doctorId);
  const t = todayISO();
  let matches, lumpMatches;
  if (period === "week") {
    const start = startOfWeekISO();
    matches = visits.filter(v => v.date >= start && v.date <= t);
    lumpMatches = lumpIncome.filter(r => r.date >= start && r.date <= t);
  } else if (period === "month") {
    matches = visits.filter(v => (v.date || "").slice(0, 7) === t.slice(0, 7));
    lumpMatches = lumpIncome.filter(r => (r.date || "").slice(0, 7) === t.slice(0, 7));
  } else if (period === "year") {
    matches = visits.filter(v => (v.date || "").slice(0, 4) === t.slice(0, 4));
    lumpMatches = lumpIncome.filter(r => (r.date || "").slice(0, 4) === t.slice(0, 4));
  } else {
    matches = visits.filter(v => v.date === t);
    lumpMatches = lumpIncome.filter(r => r.date === t);
  }
  const total = matches.reduce((s, v) => s + (Number(v.paid) || 0), 0) + lumpMatches.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  return { count: matches.length + lumpMatches.length, total };
}
// إيراد طبيب مُحدَّد (إجمالي المحصَّل من زياراته الفردية + قيود الوارد الإجمالية المرتبطة به، وحصته من الاثنين معًا)
function doctorRevenue(doctorId) {
  if (!doctorId) return { count: 0, total: 0, share: 0 };
  const visits = allVisits().filter(v => v.doctorId === doctorId);
  const lumpIncome = DB.income.filter(r => r.doctorId === doctorId);
  const total = visits.reduce((s, v) => s + (Number(v.paid) || 0), 0) + lumpIncome.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const share = visits.reduce((s, v) => s + computeShare(v).doc, 0) + lumpIncome.reduce((s, r) => s + incomeDoctorShare(r).doc, 0);
  return { count: visits.length + lumpIncome.length, total, share };
}

// مفتاح تجميع المريض: رقم الملف إن وُجد، وإلا الاسم + الهاتف
// ======================================================================
// ترتيب "الأحدث إدخالًا" (وقت التسجيل الفعلى، وليس تاريخ العملية أو رقمها)
// ======================================================================
// يرتّب أي قائمة سجلات تنازليًا حسب وقت إدخالها الفعلى فى النظام (createdAt)،
// بغض النظر تمامًا عن تاريخ العملية نفسها أو رقم الملف أو المبلغ. سجل له
// createdAt يُعتبر دائمًا أحدث من سجل بلا createdAt (بيانات قديمة سابقة على
// إضافة هذه الميزة) لأن أي createdAt بالتعريف أُنشئ بعد نشر هذا الإصلاح. لو
// كلا السجلين بلا createdAt (بيانات قديمة كلها)، نستخدم أفضل تقريب متاح: تاريخ
// العملية، ثم ترتيب الإدخال الأصلى فى المصفوفة - نفس المنطق القديم قبل هذا
// الإصلاح، فلا ينكسر شيء فى البيانات القديمة.
function sortByEntryOrderDesc(list, legacyDateKeyFn) {
  const keyFn = legacyDateKeyFn || (x => x.date || "");
  return list.map((item, i) => ({ item, i })).sort((a, b) => {
    const aTs = a.item.createdAt, bTs = b.item.createdAt;
    if (aTs && bTs) return bTs.localeCompare(aTs);
    if (aTs && !bTs) return -1;
    if (!aTs && bTs) return 1;
    const byDate = keyFn(b.item).localeCompare(keyFn(a.item));
    return byDate !== 0 ? byDate : b.i - a.i;
  }).map(({ item }) => item);
}
function patientKey(v) {
  const fn = (v.fileNo || "").trim();
  if (fn) return "F:" + fn;
  return "N:" + (v.patient || "").trim().toLowerCase() + "|" + (v.phone || "").trim();
}
function groupPatients(visits) {
  const map = new Map();
  visits.forEach(v => {
    const key = patientKey(v);
    if (!map.has(key)) map.set(key, { key, name: "", phone: "", fileNos: new Set(), visits: [] });
    const g = map.get(key);
    if (v.fileNo) g.fileNos.add(v.fileNo);
    if (!g.name && v.patient) g.name = v.patient;
    if (!g.phone && v.phone) g.phone = v.phone;
    g.visits.push(v);
  });
  const today = todayISO();
  return Array.from(map.values()).map(g => {
    const sorted = sortByEntryOrderDesc(g.visits);
    const totalPaid = g.visits.reduce((s, v) => s + (Number(v.paid) || 0), 0);
    const totalDue = g.visits.reduce((s, v) => s + visitRemaining(v), 0);
    const upcoming = g.visits.filter(v => v.nextVisitDate && v.nextVisitDate >= today).sort((a, b) => (a.nextVisitDate || "").localeCompare(b.nextVisitDate || ""));
    return { ...g, fileNos: Array.from(g.fileNos), visits: sorted, totalPaid, totalDue, lastVisit: sorted[0] || null, nextFollowUp: upcoming[0] || null };
  });
}

function ledgerRows() {
  const inc = DB.income.map(x => ({
    id: x.id, date: x.date, type: "وارد", num: x.receiptNo, desc: x.desc || x.category,
    party: x.party, cat: x.category, amount: Number(x.amount) || 0, paymentMethod: x.paymentMethod, createdAt: x.createdAt,
  }));
  const exp = DB.expense.map(x => ({
    id: x.id, date: x.date, type: "منصرف", num: x.voucherNo, desc: x.desc || x.category,
    party: x.party, cat: x.category, amount: Number(x.amount) || 0, paymentMethod: x.paymentMethod, createdAt: x.createdAt,
  }));
  // ملحوظة: هذا الترتيب الزمني التصاعدى (بالتاريخ الفعلى للعملية) ضرورى وثابت
  // ولا يتغيّر - لازم لحساب الرصيد التراكمى الصحيح لحظة بلحظة. ترتيب العرض
  // "الأحدث إدخالًا" يُطبَّق بعد كده على العرض فقط (فى renderLedger) دون المساس
  // بترتيب الحساب هنا؛ لأن الرصيد يعكس تسلسل التواريخ الفعلى للعمليات، وليس
  // وقت كتابتها فى الجهاز.
  const all = [...inc, ...exp].filter(r => r.date);
  all.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    if (a.type !== b.type) return a.type === "وارد" ? -1 : 1;
    return 0;
  });
  let bal = Number(DB.settings.openingBalance) || 0;
  return all.map(r => {
    bal += r.type === "وارد" ? r.amount : -r.amount;
    return { ...r, balance: bal };
  });
}
ledgerRows = memoize(ledgerRows); // نفس منطق التخزين المؤقت الموضّح أعلى monthlyClosingData
// عدد الأيام منذ آخر تنزيل فعلى لنسخة احتياطية من هذا الجهاز - null لو لم تُنزَّل
// نسخة احتياطية من هذا الجهاز إطلاقًا بعد (يُعتبر تذكيرًا أولويًا أعلى).
function daysSinceLastBackup() {
  let last;
  try { last = localStorage.getItem("lastBackupAt"); } catch (e) { last = null; }
  if (!last) return null;
  const diffMs = Date.now() - new Date(last).getTime();
  return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}
function currentBalance() {
  const opening = Number(DB.settings.openingBalance) || 0;
  const inc = DB.income.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const exp = DB.expense.reduce((s, x) => s + (Number(x.amount) || 0), 0);

// تاريخ حركة الخزينة المقابلة لمرتب مدفوع: يستخدم يوم الصرف إن وُجد، وإلا تاريخ اليوم (يوم اعتماد الدفع فعليًا)
function payrollExpenseDate(rec) {
  if (rec.day) return `${rec.month}-${String(rec.day).padStart(2, "0")}`;
  return `${rec.month}-01`;
}
// إصلاح محاسبي جوهري: كانت حالة "جزئي" تُعامَل تمامًا كـ"مؤجل" (بلا أى حركة صرف
// فى الخزينة إطلاقًا)، رغم أن "جزئي" تعنى أن جزءًا من المبلغ خرج فعلًا نقدًا من
// المجمع - فكان رصيد الخزينة يبقى أعلى من الواقع، و"المستحقات غير المسددة" تحتسب
// كامل المبلغ رغم دفع جزء منه بالفعل. الآن لكل سجل حقل `paidAmount` منفصل عن
// `amount` (بنفس فكرة total/paid فى الزيارات): "تم" = المبلغ كاملًا مدفوع فعلًا،
// "جزئي" = `paidAmount` المُدخَل يدويًا هو ما خرج من الخزينة فقط (والباقى يبقى
// مستحقًا)، "مؤجل" = صفر مدفوع. هذه الدالة هى المصدر الوحيد لحساب "كم خرج فعلًا".
function payrollPaidAmount(rec) {
  const amount = Number(rec.amount) || 0;
  if (rec.status === "تم") return amount;
  if (rec.status === "جزئي") return Math.max(0, Math.min(Number(rec.paidAmount) || 0, amount));
  return 0;
}
// يربط مرتبًا مدفوعًا (كليًا أو جزئيًا) تلقائيًا بحركة صرف واحدة فى دفتر الخزينة
// بقيمة ما خرج فعلًا فقط (وليس بالضرورة كامل المبلغ المستحق)، ويحدّثها مع أى
// تعديل لاحق، ويحذفها تمامًا لو أصبح المدفوع فعليًا صفرًا (حالة "مؤجل") - لتفادى
// الإدخال المزدوج (مرة فى المرتبات ومرة يدويًا فى المنصرف) مع الحفاظ على دقة
// رصيد الخزينة (لا يدخلها إلا ما خرج فعلًا، لا أكثر ولا أقل).
function syncPayrollExpenseLink(rec) {
  const linked = rec.linkedExpenseId ? DB.expense.find(x => x.id === rec.linkedExpenseId) : null;
  const paidNow = payrollPaidAmount(rec);
  if (paidNow > 0) {
    const desc = `${rec.type || "مرتب"} — ${rec.name} — ${rec.month}${rec.status === "جزئي" ? " (دفعة جزئية)" : ""}`;
    if (linked) {
      linked.date = payrollExpenseDate(rec);
      linked.party = rec.name;
      linked.desc = desc;
      linked.amount = paidNow;
    } else {
      const exp = {
        id: uid(), date: payrollExpenseDate(rec), voucherNo: `PR-${rec.month}${rec.day ? "-" + rec.day : ""}`,
        party: rec.name, category: "مرتبات", desc,
        paymentMethod: "نقدي", amount: paidNow,
        responsible: currentUser ? currentUser.displayName : "", notes: "تم إنشاؤه تلقائيًا من سجل المرتبات والمستحقات",
        createdAt: nowISO(),
      };
      DB.expense.push(exp);
      rec.linkedExpenseId = exp.id;
    }
    persist("expense");
  } else if (linked) {
    const idx = DB.expense.findIndex(x => x.id === linked.id);
    if (idx > -1) DB.expense.splice(idx, 1);
    rec.linkedExpenseId = null;
    persist("expense");
  }
}
// يربط مصروف المعمل الشهري لكل طبيب بحركة منصرف حقيقية فى دفتر الخزينة، بنفس

function monthlyClosingData(ym) {
  const visits = allVisits().filter(v => (v.date || "").startsWith(ym));
  const visitRevenue = visits.reduce((s, v) => s + (Number(v.paid) || 0), 0);
  const docShare = visits.reduce((s, v) => s + computeShare(v).doc, 0);
  const clinicShare = visits.reduce((s, v) => s + computeShare(v).clinic, 0);

  const incomeThisMonth = DB.income.filter(x => (x.date || "").startsWith(ym));
  const expenseThisMonth = DB.expense.filter(x => (x.date || "").startsWith(ym));
  const incomeByCat = {};
  incomeThisMonth.forEach(x => { incomeByCat[x.category || "غير مصنّف"] = (incomeByCat[x.category || "غير مصنّف"] || 0) + (Number(x.amount) || 0); });
  const expenseByCat = {};
  expenseThisMonth.forEach(x => { expenseByCat[x.category || "غير مصنّف"] = (expenseByCat[x.category || "غير مصنّف"] || 0) + (Number(x.amount) || 0); });
  const totalIncome = incomeThisMonth.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const totalExpense = expenseThisMonth.reduce((s, x) => s + (Number(x.amount) || 0), 0);

  const rows = ledgerRows();
  const beforeMonth = rows.filter(r => (r.date || "") < ym + "-01");
  const uptoMonth = rows.filter(r => (r.date || "") <= ym + "-31");
  const openingOfMonth = beforeMonth.length ? beforeMonth[beforeMonth.length - 1].balance : (Number(DB.settings.openingBalance) || 0);
  const closingBalance = uptoMonth.length ? uptoMonth[uptoMonth.length - 1].balance : (Number(DB.settings.openingBalance) || 0);

  const payrollThisMonth = DB.payroll.filter(p => p.month === ym);
  const payrollPaid = payrollThisMonth.filter(p => p.status === "تم").reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const payrollDue = payrollThisMonth.filter(p => p.status !== "تم").reduce((s, p) => s + (Number(p.amount) || 0), 0);

  return {
    ym, visitCount: visits.length, visitRevenue, docShare, clinicShare,
    incomeByCat, expenseByCat, totalIncome, totalExpense,
    openingOfMonth, closingBalance, net: totalIncome - totalExpense,
    payrollPaid, payrollDue, payrollCount: payrollThisMonth.length,
  };
}

// دفع "ذكى" واعٍ بالتعارضات (مرحلة ج): بدلًا من استبدال الجدول السحابى بالكامل
// بنسخة الجهاز الحالى (وهو ما قد يحذف سجلات أضافها جهاز آخر لم تصل بعد لهذا
// الجهاز)، يقارن هذا الدفع كل سجل بنظيره السحابى، ويحسم أى اختلاف بالطابع
// الزمنى (الأحدث يفوز تلقائيًا)، أو يوقف القرار لمراجعة المدير يدويًا إن كان
// خيار "مراجعة التعارضات يدويًا" مفعّلًا. يُرجع النسخة المحلية المدمَجة النهائية.
async function pushTableSmart(key, localArr) {
  const table = SB_TABLES[key];
  const baseline = await readSyncBaseline(key);
  const baseMap = new Map((baseline || []).map(r => [r.id, r]));
  // بعض الجداول (سجل النشاط تحديدًا) سجلات ثابتة لا تُعدَّل أبدًا بعد إنشائها
  // ولا تملك عمود updated_at أصلًا (تستخدم created_at بدلًا منه) - المزامنة
  // بالفارق الزمني غير مجدية لها على أي حال (كل سجل جديد فقط، لا تعديلات)،
  // فنكتفي لها بالسلوك الكامل القديم (جلب كل شىء) لتفادى خطأ استعلام عمود غير موجود.
  const supportsDelta = !!(SB_FIELD_MAPS[key] && SB_FIELD_MAPS[key].updatedAt);
  let remoteArr;
  if (!supportsDelta) {
    const { data: remoteRows, error: fullErr0 } = await sbClient.from(table).select("*");
    if (fullErr0) throw fullErr0;
    remoteArr = (remoteRows || []).map(row => sbFromRow(key, row));
  } else {
  const { data: idRows, error: idErr } = await sbClient.from(table).select("id, updated_at");
  if (idErr) throw idErr;
  const remoteIdMap = new Map((idRows || []).map(r => [r.id, r.updated_at || ""]));
  const knownIds = new Set((baseline || []).map(r => r.id));
  const idsNeedingFullFetch = [];
  for (const [id, remoteUpdatedAt] of remoteIdMap) {
    const baseRec = baseMap.get(id);
    if (!knownIds.has(id) || !baseRec || (baseRec.updatedAt || "") !== remoteUpdatedAt) idsNeedingFullFetch.push(id);
  }
  remoteArr = [];
  if (idsNeedingFullFetch.length) {
    const CHUNK_FETCH = 200;
    for (let i = 0; i < idsNeedingFullFetch.length; i += CHUNK_FETCH) {
      const batch = idsNeedingFullFetch.slice(i, i + CHUNK_FETCH);
      const { data: fullRows, error: fullErr } = await sbClient.from(table).select("*").in("id", batch);
      if (fullErr) throw fullErr;
      remoteArr.push(...(fullRows || []).map(row => sbFromRow(key, row)));
    }
  }
  // السجلات التى لم تتغيّر أصلًا (نفس updated_at المعروف سابقًا) نعيد استخدام
  // نسختها المخزَّنة محليًا بدل إعادة تنزيلها، فهى مطابقة للسحابة بالتعريف.
  for (const [id] of remoteIdMap) {
    if (!idsNeedingFullFetch.includes(id)) {
      const baseRec = baseMap.get(id);
      if (baseRec) remoteArr.push(baseRec);
    }
  }
  }
  const remoteMap = new Map(remoteArr.map(r => [r.id, r]));
  const localMap = new Map(localArr.map(r => [r.id, r]));
  const manualReview = !!(DB.settings && DB.settings.manualConflictReview);

  const toUpsert = [], toDelete = [], conflicts = [], mergedLocal = [];

  for (const local of localArr) {
    const remote = remoteMap.get(local.id);
    if (!remote) { toUpsert.push(local); mergedLocal.push(local); continue; }
    if (recordsEqual(local, remote)) { mergedLocal.push(local); continue; }
    const localTime = local.updatedAt || "";
    const remoteTime = remote.updatedAt || "";
    if (!remoteTime || localTime >= remoteTime) {
      toUpsert.push(local); mergedLocal.push(local);
    } else {
      // السحابة أحدث زمنيًا ومحتواها مختلف عن المحلى = تعارض محتمل
      const base = baseMap.get(local.id);
      const localChangedSinceBase = !base || !recordsEqual(base, local);
      if (!localChangedSinceBase) {
        mergedLocal.push(remote); // المحلى لم يتغيّر أصلًا، اعتمد النسخة السحابية الأحدث دون إزعاج أحد
      } else if (manualReview) {
        conflicts.push({ table: key, id: local.id, local, remote, detectedAt: nowISO() });
        mergedLocal.push(local); // احتفظ بالمحلى مؤقتًا دون دفعه لحين قرار المدير
      } else {
        mergedLocal.push(remote); // تلقائى: الأحدث زمنيًا (وهو السحابى هنا) يفوز
      }
    }
  }
  // سجلات موجودة سحابيًا فقط (أضافها جهاز آخر ولم تصل بعد لهذا الجهاز) - أضِفها محليًا، لا تحذفها أبدًا
  for (const remote of remoteArr) {
    if (!localMap.has(remote.id)) mergedLocal.push(remote);
  }
  // حذف حقيقى فقط: كان معروفًا محليًا فى آخر مزامنة، وأصبح غائبًا محليًا الآن (حُذف فعليًا)،
  // وما زال موجودًا سحابيًا. أما السجلات "غير المعروفة" محليًا فلا تُحذف أبدًا حتى لا نفقد بيانات جهاز آخر.
  for (const base of (baseline || [])) {
    if (!localMap.has(base.id) && remoteMap.has(base.id)) toDelete.push(base.id);
  }

  // إصلاح جوهري: مكتبة Supabase لا ترمي استثناء عند فشل upsert/delete، بل
  // تُرجع { data, error } فقط. كان الكود هنا لا يتحقق من error إطلاقًا، فأي
  // فشل فعلي فى الرفع (RLS يمنع INSERT رغم سماحه بـ SELECT، عمود مفقود،
  // قيد فريد...) كان يُعامَل كنجاح تام: يُشال الجدول من طابور الانتظار،
  // وتُحدَّث القاعدة (baseline) كأن التعديل وصل فعليًا للسحابة رغم أنه لم يصل.
  // النتيجة: أول قراءة تالية من Supabase (تحديث خلفى أو فتح الصفحة من جديد)
  // كانت تجلب النسخة السحابية الناقصة وتمحو السجل المُضاف محليًا من الشاشة -
  // وهو بالضبط سبب اختفاء الإضافات الجديدة (أطباء، قيود وارد...) تلقائيًا.
  // إصلاح: إرسال آلاف السجلات فى طلب delete/upsert واحد (يحدث بسهولة بعد توليد
  // بيانات تجريبية لسنة كاملة أو مسحها دفعة واحدة) قد يتجاوز حدود حجم الطلب/الرابط
  // لدى Supabase/PostgREST فيفشل الطلب بالكامل أو جزئيًا. نقسّم أى عملية كبيرة إلى
  // دفعات صغيرة (200 سجل لكل دفعة) لضمان اكتمالها دائمًا مهما كان حجم البيانات.
  const CHUNK = 200;
  const chunkArray = (arr, size) => { const out = []; for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size)); return out; };
  if (toDelete.length) {
    for (const batch of chunkArray(toDelete, CHUNK)) {
      const { error: delErr } = await sbClient.from(table).delete().in("id", batch);
      if (delErr) throw delErr;
    }
  }
  if (toUpsert.length) {
    const rows = toUpsert.map(o => sbToRow(key, o));
    for (const batch of chunkArray(rows, CHUNK)) {
      const { error: upsertErr } = await sbClient.from(table).upsert(batch, { onConflict: "id" });
      if (upsertErr) throw upsertErr;
    }
  }
  if (conflicts.length) await stashConflicts(conflicts);
  return mergedLocal;
}
// استعادة كاملة وصريحة عند استخدام "استعادة نسخة احتياطية": بخلاف pushTableSmart
// العادية (التى تقارن بآخر ما يعرفه هذا الجهاز تحديدًا لتفادى حذف بيانات أجهزة
// أخرى لم تصل بعد)، هذه الدالة تقارن مباشرة مع الصورة الحقيقية الحالية للسحابة
// وتحذف أى سجل غير موجود فى النسخة الاحتياطية - تمامًا كما يتوقع المستخدم من
// "استعادة" حقيقية. تعمل فقط أثناء الاتصال بالإنترنت عمدًا: أوفلاين لا يمكننا
// معرفة الصورة الحقيقية للسحابة، فيبقى الحذف غير منفَّذ حتى تُعاد الاستعادة يدويًا
// وأنت متصل - سلوكان واضحان ومنفصلان بلا أى إكمال تلقائى لاحق قد يفاجئ المستخدم.
async function restoreTableFully(key, keepIds) {
  const table = SB_TABLES[key];
  if (!table || !sbClient || STORAGE_MODE !== "supabase" || !navigator.onLine) return { deleted: 0, applied: false };
  const { data: remoteRows, error } = await sbClient.from(table).select("id");
  if (error) throw error;
  const keepSet = new Set(keepIds);
  const idsToDelete = (remoteRows || []).map(r => r.id).filter(id => !keepSet.has(id));
  const CHUNK = 200;
  const chunkArray = (arr, size) => { const out = []; for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size)); return out; };
  for (const batch of chunkArray(idsToDelete, CHUNK)) {
    const { error: delErr } = await sbClient.from(table).delete().in("id", batch);
    if (delErr) throw delErr;
  }
  return { deleted: idsToDelete.length, applied: true };
}

    n.addEventListener("click", () => { state.page = n.dataset.page; state.editId = null; state.editDocId = null; state.editEmpId = null; state.showAnnualReport = false; document.body.classList.remove("sidebar-open"); route(); });
  });
  const newNav = el.querySelector("nav");
  if (newNav) newNav.scrollTop = prevScroll;
  renderStorageIndicator();
}

async function renderStorageIndicator() {
  const indicator = document.getElementById("storageIndicator");
  if (!indicator) return;
  const online = navigator.onLine;
  const pendingKeys = STORAGE_MODE === "supabase" ? await getPendingQueueKeys() : [];
  const pendingCount = pendingKeys.length;
  const conflictsList = STORAGE_MODE === "supabase" ? await getAllConflicts() : [];
  const conflictsCount = conflictsList.length;
  let dot, label;
  if (STORAGE_MODE === "supabase" && SYNC_PAUSED) {
    dot = "🟡"; label = `⏸️ العمل محليًا فقط — المزامنة التلقائية موقوفة مؤقتًا${pendingCount ? ` (${pendingCount} عملية بانتظار الرفع)` : ""}`;
  } else if (STORAGE_MODE === "supabase" && online && pendingCount === 0) {
    dot = "🟢"; label = "متصل وتمت المزامنة — يُقرأ ويُكتب مباشرة على القاعدة السحابية";
  } else if (STORAGE_MODE === "supabase" && online && pendingCount > 0) {
    // إظهار سبب فشل آخر محاولة رفع فعليًا (إن وُجد) بدل الاكتفاء بالعدد فقط،
    // حتى يعرف المستخدم - خصوصًا على الموبايل حيث لا يمكن فتح الـ console - أين
    // المشكلة الحقيقية (RLS، جدول مفقود، خطأ شبكة...).
    const firstReason = Object.values(SYNC_LAST_ERRORS)[0];
    const retryInSec = SYNC_NEXT_RETRY_AT > Date.now() ? Math.ceil((SYNC_NEXT_RETRY_AT - Date.now()) / 1000) : 0;
    dot = "🟡"; label = `يعمل محليًا الآن — ${pendingCount} عملية بانتظار الرفع${firstReason ? ` (السبب: ${firstReason})` : ""}${retryInSec > 0 ? ` — إعادة المحاولة تلقائيًا خلال ${retryInSec} ثانية` : ""}`;
  } else if (STORAGE_MODE === "supabase" && !online) {
    dot = "🔴"; label = `غير متصل بالإنترنت الآن${pendingCount ? ` — ${pendingCount} عملية محفوظة محليًا بانتظار الرفع` : ""}`;
  } else if (STORAGE_MODE === "cloud") {
    dot = "🟢"; label = "☁️ البيانات محفوظة تلقائيًا";
  } else if (STORAGE_MODE === "local") {
    dot = "🔴"; label = "💾 يعمل محليًا فى هذا المتصفح فقط";
  } else {
    dot = "🔴"; label = "⚠️ غير محفوظة — ستُفقد عند الإغلاق";
  }
  const canSync = can("settings","sync");
  indicator.innerHTML = `
    <div style="display:flex; align-items:center; gap:6px;">${dot} <span>${label}</span></div>
    ${conflictsCount > 0 && can("settings","edit") ? `<button class="btn danger sm" id="conflictsBtn" style="margin-top:6px; width:100%; justify-content:center;">⚠️ ${conflictsCount} تعارض بانتظار المراجعة</button>` : ""}
    ${STORAGE_MODE === "supabase" && canSync ? `<button class="btn ghost sm" id="syncNowBtn" style="margin-top:6px; width:100%; justify-content:center;">🔄 مزامنة الآن</button>` : ""}
    ${STORAGE_MODE === "supabase" && canSync ? (SYNC_PAUSED
      ? `<button class="btn ghost sm" id="resumeSyncBtn" style="margin-top:6px; width:100%; justify-content:center;">▶️ إعادة الاتصال بـ Supabase</button>`
      : `<button class="btn ghost sm" id="pauseSyncBtn" style="margin-top:6px; width:100%; justify-content:center;">⏸️ العمل محليًا فقط</button>`) : ""}
  `;
  const conflictsBtn = document.getElementById("conflictsBtn");
  if (conflictsBtn) conflictsBtn.addEventListener("click", () => { state.page = "dataConflicts"; route(); });
  const syncBtn = document.getElementById("syncNowBtn");
  if (syncBtn) syncBtn.addEventListener("click", async () => {
    syncBtn.textContent = "جارٍ المزامنة...";
    SYNC_NEXT_RETRY_AT = 0; // ضغطة يدوية من المستخدم تتجاوز فترة الانتظار التصاعدي التلقائي دائمًا
    try {
      await flushPendingSync(); // ارفع كل ما هو معلّق أولًا
      // إصلاح: flushPendingSync لا يرمى استثناء أبدًا (يترك الجدول الفاشل فى
      // الطابور ويكمل البقية بصمت)، فكان try/catch هنا لا يلتقط شيئًا أبدًا
      // ويعرض "تمت المزامنة بنجاح" حتى لو ظلت عمليات عالقة فعليًا فى الطابور.
      // الآن نتحقق من الطابور فعليًا بعد الرفع ونعرض السبب الحقيقى إن بقى شىء معلّقًا.
      const stillPending = await getPendingQueueKeys();
      await loadAll(); // اسحب أحدث نسخة من Supabase
      if (stillPending.length) {
        const reason = Object.values(SYNC_LAST_ERRORS)[0];
        logActivity("مزامنة يدوية جزئية - عمليات لا تزال معلّقة", "settings");
        showToast(`⚠️ تعذّر رفع ${stillPending.length} عملية${reason ? ` — السبب: ${reason}` : ""}`);
      } else {
        logActivity("مزامنة يدوية مع Supabase", "settings");
        showToast("تمت المزامنة بنجاح");
      }
    } catch (e) {
      console.error("Manual sync failed:", e);
      showToast(`⚠️ تعذّرت المزامنة — ${(e && e.message) || "تحقّق من الاتصال"}`);
    }
    route();
  });
  const pauseBtn = document.getElementById("pauseSyncBtn");
  if (pauseBtn) pauseBtn.addEventListener("click", () => {
    SYNC_PAUSED = true;
    try { localStorage.setItem(SYNC_PAUSE_FLAG, "1"); } catch (e) { /* ignore */ }
    showToast("تم إيقاف المزامنة التلقائية مؤقتًا — البيانات تُحفظ محليًا فقط الآن");
    renderStorageIndicator();
  });
  const resumeBtn = document.getElementById("resumeSyncBtn");
  if (resumeBtn) resumeBtn.addEventListener("click", async () => {
    SYNC_PAUSED = false;
    try { localStorage.removeItem(SYNC_PAUSE_FLAG); } catch (e) { /* ignore */ }
    showToast("تمت إعادة تفعيل المزامنة — جارٍ الرفع والسحب...");
    renderStorageIndicator();
    await flushPendingSync();
    await loadAll();
    route();
  });
}
window.addEventListener("online", async () => {
  renderStorageIndicator();
  if (STORAGE_MODE === "supabase" && !SYNC_PAUSED) {
    SYNC_NEXT_RETRY_AT = 0; // عودة اتصال حقيقية = فرصة جديدة، تتجاوز فترة الانتظار التصاعدي
    await flushPendingSync();
    await loadAll();
    subscribeStaffAccountsRealtime();
    // لا تُعِد رسم الشاشة لو المستخدم وسط تعديل سجل قائم أو كتابة نشطة فى فورم
    // مفتوح الآن - فقد يمحو ذلك أى بيانات مكتوبة لم تُحفظ بعد. البيانات نفسها
    // تحدّثت فى الذاكرة بالفعل أعلاه، وستظهر تلقائيًا عند أقرب تنقّل أو حفظ.
    if (!isMidEdit() && !isUserActivelyTyping()) route();
  }
});
window.addEventListener("offline", renderStorageIndicator);
document.getElementById("sidebarOverlay").addEventListener("click", () => document.body.classList.remove("sidebar-open"));
// مزامنة دورية فى الخلفية كل 45 ثانية بدون تجميد الواجهة، تحسبًا لأى عمليات
// معلّقة لم تُرفَع بعد (مثلًا بعد فشل مؤقت فى الشبكة رغم ظهور "متصل").
setInterval(() => { if (STORAGE_MODE === "supabase" && !SYNC_PAUSED) flushPendingSync(); }, 45000);

// ======================================================================
// تحديث دورى صامت فى الخلفية (بدون تسجيل خروج): يسحب أحدث نسخة من كل الجداول
// من Supabase كل دقيقة تقريبًا، حتى تظهر تعديلات الأجهزة الأخرى (طبيب جديد،
// تغيير إعداد...) تلقائيًا لمن ترك الجلسة مفتوحة طويلًا دون تسجيل خروج/دخول.
// بحذر شديد: لا يلمس أى جدول لا يزال بداخل طابور المزامنة المعلّق (يتركه
// لـ flushPendingSync كى لا يطمس تعديلًا محليًا لم يُرفَع بعد - نفس منطق الحماية
// المطبَّق فى storeGet)، ولا يُعيد رسم الشاشة إطلاقًا أثناء تعديل سجل قائم أو
// كتابة نشطة فى أى حقل إدخال، تجنبًا لفقدان أى بيانات لم تُحفظ بعد.
// ======================================================================
const BACKGROUND_REFRESH_KEYS = ["doctors","employees","visitsClinic","visitsDental","visitsOperations","visitsLabs","visitsRadiology","income","expense","payroll","staffAccounts","categories","specialties","settings","labExpenses"];
let BACKGROUND_REFRESH_IN_PROGRESS = false;
function isUserActivelyTyping() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = (el.tagName || "").toLowerCase();
  return tag === "input" || tag === "textarea" || tag === "select";
}
function isMidEdit() {
  return !!(state.editId || state.editDocId || state.editUserId || state.editEmpId);
}
async function backgroundRefreshAll() {
  if (BACKGROUND_REFRESH_IN_PROGRESS || STORAGE_MODE !== "supabase" || !navigator.onLine || SYNC_PAUSED || !currentUser) return;
  if (isMidEdit() || isUserActivelyTyping()) return; // لا تلمس شيئًا أثناء تعديل نشط
  // إصلاح جوهري (سبب اختفاء الزيارة الجديدة مؤقتًا وأنت متصل بالإنترنت): لا تبدأ
  // أى سحب خلفى للبيانات إن كانت هناك عملية حفظ (persist) قيد التنفيذ فعليًا هذه
  // اللحظة فى مكان آخر من النظام (PENDING_WRITES > 0) - مثلًا تسجيل زيارة جديدة
  // لسه بترفع للسحابة ولم تكتمل بعد. لو بدأنا السحب هنا، النسخة السحابية التى
  // سنحصل عليها قد لا تحتوي بعد على التعديل الجديد (لأن رفعه لم يكتمل)، فنستبدل
  // بها الذاكرة المحلية ويختفى التعديل الجديد مؤقتًا حتى إعادة رسم تالية تعيد
  // قراءته من جديد. تأجيل السحب لحين اكتمال كل عمليات الحفظ الجارية يمنع هذا التضارب.
  if (PENDING_WRITES > 0) return;
  BACKGROUND_REFRESH_IN_PROGRESS = true;
  try {
    const pending = await getPendingQueueKeys();
    let changed = false;
    for (const key of BACKGROUND_REFRESH_KEYS) {
      if (pending.includes(key)) continue; // موجود بالفعل فى طابور الرفع - اتركه له كى لا يُطمَس
      if (PENDING_WRITES > 0) break; // بدأت عملية حفظ جديدة أثناء السحب نفسه - توقف فورًا ولا تكمل باقى الجداول
      try {
        const before = JSON.stringify(DB[key]);
        const generationBefore = TABLE_MUTATION_GENERATION[key] || 0;
        const fresh = await storeGet(key, DB[key]);
        // إعادة تحقق فورية بعد انتظار الشبكة (وهذا هو الإصلاح الجوهري لمشكلة
        // اختفاء التعديل بعد ثوانٍ رغم الاتصال): الفحص الأول لـ PENDING_WRITES
        // فى بداية الحلقة لا يكفى، لأن المستخدم قد يبدأ (أو حتى ينهي) حفظ تعديل
        // جديد لنفس هذا الجدول بالكامل أثناء فترة انتظار storeGet نفسها (طلب
        // شبكة يستغرق وقتًا). النتيجة "fresh" فى هذه الحالة لا يمكن الوثوق بها
        // لأنها قد لا تعكس التعديل الجديد بشكل موثوق، فنتجاهلها كليًا هنا بدل
        // استبدال DB[key] بها والتسبب فى اختفاء تعديل المستخدم الذى نجح فعليًا.
        if (PENDING_WRITES > 0) break;
        if ((TABLE_MUTATION_GENERATION[key] || 0) !== generationBefore) continue;
        const pendingAfter = await getPendingQueueKeys();
        if (pendingAfter.includes(key)) continue;
        if (fresh !== undefined && JSON.stringify(fresh) !== before) { DB[key] = fresh; changed = true; }
      } catch (e) { /* تجاهل فشل جدول واحد ولا يوقف تحديث الباقى */ }
    }
    // أعد التحقق مباشرة قبل إعادة الرسم: قد يكون المستخدم بدأ الكتابة أو حفظ تعديل جديد أثناء عملية السحب نفسها
    if (changed && currentUser && !isMidEdit() && !isUserActivelyTyping() && PENDING_WRITES === 0) route();
  } finally {
    BACKGROUND_REFRESH_IN_PROGRESS = false;
  }
}
setInterval(backgroundRefreshAll, 60000);

  const el = document.getElementById("topbar");
  const now = new Date();
  const dateStr = now.toLocaleDateString("ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

      <button id="hamburgerBtn" title="القائمة" style="display:none; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; border:1px solid var(--border,#ccc); background:var(--card); font-size:18px; cursor:pointer; flex-shrink:0;">☰</button>

          <span style="font-size:12.5px; font-weight:700; color:var(--navy);">👤 ${esc(currentUser.displayName)}</span>
          <span class="pill">${esc(currentUser.role)}</span>
          <button class="btn ghost sm" id="themeToggleBtn" title="تبديل الوضع الليلي/النهاري">${document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙"}</button>
          <button class="btn ghost sm" id="changeMyPasswordBtn" title="تغيير كلمة المرور الخاصة بك">🔑 كلمة المرور</button>

  if (themeToggleBtn) themeToggleBtn.addEventListener("click", () => {

function showToast(msg, duration) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove("show"), duration || 2200);
}

// نافذة "تغيير كلمة المرور الخاصة بي" - متاحة لأي مستخدم مسجّل دخول لحسابه هو
// فقط (لا يمكن بها تعديل حساب غيره). تستخدم بالضبط نفس مسار الحفظ المستخدم فى
// كل تعديلات النظام (persist("staffAccounts") + طابور المزامنة المحلى + الدمج
// الذكى بالاعتماد على updatedAt) فلا يوجد أى مسار خاص أو مختلف قد يسبب تعارضًا:
// تعمل أوفلاين (تُحفَظ محليًا وتُعرض حالة "بانتظار الرفع")، وتُرفع تلقائيًا فور
// عودة الاتصال بنفس الآلية المستخدمة لكل جدول آخر فى النظام.
function openChangeMyPasswordModal() {
  if (!currentUser) return;
  const existing = document.getElementById("changePassOverlay");
  if (existing) existing.remove();
  const overlay = document.createElement("div");
  overlay.id = "changePassOverlay";
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(16,42,53,.55); display:flex; align-items:center; justify-content:center; z-index:2000; padding:16px;";
  overlay.innerHTML = `
    <div class="card" style="max-width:420px; width:100%; margin:0;">
      <div class="section-title" style="margin-bottom:14px;">🔑 تغيير كلمة المرور</div>
      <form id="changePassForm">
        <div class="field" style="margin-bottom:12px;">
          <label>كلمة المرور الحالية</label>
          <input type="password" name="current" required autocomplete="current-password">
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>كلمة المرور الجديدة</label>
          <input type="password" name="new1" required minlength="3" autocomplete="new-password">
        </div>
        <div class="field" style="margin-bottom:16px;">
          <label>تأكيد كلمة المرور الجديدة</label>
          <input type="password" name="new2" required minlength="3" autocomplete="new-password">
        </div>
        <div id="changePassError" style="color:var(--expense,#B3261E); font-size:12.5px; margin-bottom:10px; display:none;"></div>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button type="button" class="btn ghost" id="changePassCancel">إلغاء</button>
          <button type="submit" class="btn">حفظ كلمة المرور</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(overlay);
  const closeModal = () => overlay.remove();
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  document.getElementById("changePassCancel").addEventListener("click", closeModal);
  document.getElementById("changePassForm").addEventListener("submit", async e => {
    e.preventDefault();
    const errBox = document.getElementById("changePassError");
    errBox.style.display = "none";
    const fd = new FormData(e.target);
    const current = fd.get("current"), new1 = fd.get("new1").trim(), new2 = fd.get("new2");
    // التحقق دائمًا من أحدث نسخة محلية متاحة لحساب المستخدم الحالى (وليس من
    // currentUser المخزَّن وقت تسجيل الدخول، والذى قد يكون أقدم لو تغيّرت كلمة
    // المرور من جهاز آخر ثم وصلت هذه المزامنة لهذا الجهاز بعد تسجيل الدخول).
    const account = DB.staffAccounts.find(a => a.id === currentUser.id);
    if (!account) { errBox.textContent = "تعذّر العثور على الحساب."; errBox.style.display = "block"; return; }
    if (account.password !== current) { errBox.textContent = "كلمة المرور الحالية غير صحيحة."; errBox.style.display = "block"; return; }
    if (new1 !== new2) { errBox.textContent = "كلمة المرور الجديدة وتأكيدها غير متطابقين."; errBox.style.display = "block"; return; }
    if (new1 === current) { errBox.textContent = "كلمة المرور الجديدة مطابقة للحالية - اختر كلمة مرور مختلفة."; errBox.style.display = "block"; return; }
    account.password = new1;
    account.updatedAt = nowISO(); // نفس آلية الدمج الذكى المستخدمة فى كل تعديلات حسابات المستخدمين
    currentUser.password = new1;
    setSession(currentUser); // حدّث الجلسة المحلية لتبقى متسقة مع الحساب
    persist("staffAccounts");
    logActivity("تغيير كلمة المرور الشخصية", "settings");
    saveToast("تم تغيير كلمة المرور بنجاح");
    closeModal();
  });
}
// رسالة تأكيد حفظ تعكس الحالة الحقيقية: لو أوفلاين (أو المزامنة موقوفة مؤقتًا أو
// لسه فى طابور الانتظار)، توضّح صراحة إن البيانات محفوظة محليًا بأمان وستُرفع
// تلقائيًا بمجرد عودة الاتصال - بدل رسالة عامة "تم الحفظ" قد تجعل المستخدم غير
// متأكد هل البيانات فعلًا بأمان أم لا وهو غير متصل بالإنترنت.
function saveToast(entityMsg) {
  const savedOnlyLocally = !(STORAGE_MODE === "supabase" && navigator.onLine && !SYNC_PAUSED);
  if (savedOnlyLocally) {
    showToast(`💾 ${entityMsg} — محفوظ على هذا الجهاز بأمان، وسيُرفع تلقائيًا لباقي الأجهزة بمجرد عودة الاتصال بالإنترنت`, 3800);
  } else {
    showToast(`✅ ${entityMsg}`);
  }
}

// يحوّل أى صيغة إدخال شائعة لرقم هاتف مصرى (محلى أو دولى، بمسافات أو شرطات أو
// رمز + ...) إلى الصيغة الدولية النظيفة التى يتطلّبها رابط wa.me (بادئة الدولة
// 20 بدون أى رمز + أو أصفار زائدة). يُعيد null صراحة لو تعذّر التعرّف على رقم
// هاتف صالح، حتى تتعامل الواجهة مع الحالة بوضوح (تعطيل الزر / تنبيه) بدل توليد
// رابط واتساب مكسور بصمت.
function sanitizePhoneForWhatsApp(raw) {
  if (!raw) return null;
  let digits = String(raw).replace(/\D/g, ""); // إزالة كل ما ليس رقمًا: مسافات، شرطات، +، أقواس...
  if (!digits) return null;
  if (digits.startsWith("0020")) digits = digits.slice(2);           // "0020xxxxxxxxxx" -> "20xxxxxxxxxx"
  else if (digits.startsWith("20") && digits.length >= 12) { /* دولية بالفعل */ }
  else if (digits.startsWith("0")) digits = "20" + digits.slice(1);   // "01012345678" -> "201012345678"
  else if (!digits.startsWith("20")) digits = "20" + digits;          // رقم بلا صفر بداية أصلًا
  // رقم محمول مصرى صالح بعد التطبيع: 20 + 10 أرقام (01xxxxxxxxx بدون الصفر) = 12 رقمًا
  if (!/^20\d{9,10}$/.test(digits)) return null;
  return digits;
}
// يصوغ رسالة واتساب احترافية موحّدة لأى إيصال/زيارة، بحقول اختيارية (تُحذف
// سطورها تلقائيًا لو لم تتوفر بيانتها بدل ترك سطر فارغ فى الرسالة).
// إصلاح: العنوان كان يعرض اسم القسم (clinicName) فقط ويسقط اسم المجمع تمامًا فى
// كل رسالة فعلية، لأن كل نقاط الاستدعاء بالفعل بتمرّر clinicName ("قسم العيادات"
// / "قسم الأسنان") فيبقى النص المبدئى ("مجمع ميت عزون الطبي...") لا يظهر إلا لو
// clinicName فاضية، وهو ما لا يحدث عمليًا. الآن يظهر اسم المجمع دايمًا مع اسم
// القسم المُرسِل منه معًا فى نفس السطر.
function buildWhatsAppMessage({ patientName, clinicName, doctorName, paid, remaining }) {
  const lines = [
    `🏥 مستشفى لجنة زكاة ميت على التخصصي${clinicName ? " - " + clinicName : ""}`,
    patientName ? `عزيزي/عزيزتي ${patientName}،` : null,
    "نشكر لكم زيارتكم، وهذه تفاصيل الحساب:",
    doctorName ? `👨‍⚕️ الطبيب: ${doctorName}` : null,
    paid !== undefined ? `💰 المبلغ المدفوع: ${fmt(paid)} ج.م` : null,
    (remaining !== undefined && remaining !== null)
      ? (remaining > 0 ? `⏳ المبلغ المتبقي: ${fmt(remaining)} ج.م` : `✅ تم سداد كامل المبلغ`)
      : null,
    "",
    "شكرًا لثقتكم بنا 🌿",
  ].filter(v => v !== null);
  return lines.join("\n");
}
// يبنى رابط wa.me جاهزًا؛ يُعيد null لو كان الرقم غير صالح كى يستطيع المستدعى
// إظهار تنبيه مناسب بدل فتح رابط لا يعمل. encodeURIComponent يمنع أى خطأ ناتج
// عن المسافات أو الرموز أو النصوص العربية داخل نص الرسالة.
function buildWhatsAppLink(phone, message) {
  const clean = sanitizePhoneForWhatsApp(phone);
  if (!clean) return null;
  return `https://wa.me/${clean}?text=${encodeURIComponent(message || "")}`;
}
// نقطة الدخول الموحّدة لأى زر/أيقونة واتساب فى الواجهة: تبنى الرسالة (إن
// توفّرت بيانتها) وتفتح المحادثة فى تبويب جديد، أو تُظهر تنبيهًا لطيفًا بدل
// تعطّل صامت لو كان رقم الهاتف مفقودًا أو غير صحيح.
function openWhatsAppChat(phone, messageData) {
  const message = messageData ? buildWhatsAppMessage(messageData) : "";
  const link = buildWhatsAppLink(phone, message);
  if (!link) { showToast("⚠️ رقم الهاتف مفقود أو غير صحيح — تعذّر فتح واتساب"); return; }
  window.open(link, "_blank", "noopener");
}

// فقط فى كل مرة بدل الجدول كامل، مع أزرار تنقّل واضحة وعداد "يعرض X-Y من Z".
const PAGE_SIZE = 50;
function paginateList(list, pageKey) {
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  let current = state.tablePage[pageKey] || 1;
  if (current > totalPages) current = totalPages;
  if (current < 1) current = 1;
  state.tablePage[pageKey] = current;
  const start = (current - 1) * PAGE_SIZE;
  return { pageItems: list.slice(start, start + PAGE_SIZE), current, totalPages, total: list.length, start: list.length ? start + 1 : 0, end: Math.min(start + PAGE_SIZE, list.length) };
}
function paginationControlsHTML(pageKey, pageInfo) {
  if (pageInfo.total <= PAGE_SIZE) return "";
  return `

// تصدير جدول إلى CSV يفتح مباشرة فى Excel (بدون أي مكتبات خارجية)
function exportTableToCSV(filename, headers, rows) {
  const escCsv = v => {
    const s = (v === null || v === undefined) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.map(escCsv).join(","), ...rows.map(r => r.map(escCsv).join(","))];
  const csv = "\uFEFF" + lines.join("\r\n"); // BOM لدعم عرض العربية بشكل صحيح فى Excel
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderVisitsPage(kind) {
  const isDental = kind === "dental";
  const list = isDental ? DB.visitsDental : DB.visitsClinic;
  const doctorsPool = DB.doctors.filter(d => d.type === (isDental ? "أسنان" : "عيادات") && d.status === "نشط");
  const c = document.getElementById("content");
  const editing = state.editId ? list.find(v => v.id === state.editId) : null;
  const canAdd = can(kind, "add"), canEdit = can(kind, "edit"), canDelete = can(kind, "delete");

  const granKey = `visitFilterGran_${kind}`, valKey = `visitFilterVal_${kind}`;
  ensurePeriodFilter(granKey, valKey);
  const granularity = state[granKey], filterValue = state[valKey];
  const displayList = list.filter(v => periodMatches(v.date, granularity, filterValue));
  const sortedVisits = sortByEntryOrderDesc(displayList);

  c.innerHTML = `
    ${(editing ? canEdit : canAdd) ? `
